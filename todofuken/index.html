<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- hikkoshi --><script src="../common/hikkoshi.js"></script><!-- /hikkoshi -->
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>都道府県パズル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Fredoka:wght@500;600;700&display=swap">
<style>
/* Layout: 海の上に日本地図、下(横向きなら右)にピースのトレイ。地図帳のような紙と海の色で、明るい一色の見た目に固定 */
:root{
  --sea:#bfe2ee; --sea-deep:#8cc6dc; --paper:#fffaf0; --land:#f6efdc; --ctx:#dcd6c6;
  --ink:#24324a; --ink-soft:#5f6b80; --line:#b9ad94; --accent:#ff7a59; --accent-ink:#ffffff; --good:#2fa36b;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
html[lang="en"]{--font:"Fredoka","Zen Maru Gothic","Arial Rounded MT Bold",system-ui,sans-serif}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--paper);box-shadow:0 2px 0 rgba(36,50,74,.08);z-index:2}
.chip{border:0;background:var(--land);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;white-space:nowrap}
#bar .ttl{flex:1;min-width:0;font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .ttl small{font-weight:500;font-size:12px;color:var(--ink-soft);margin-left:4px}
.stat{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:none}
#mapwrap{flex:1;min-height:0;position:relative;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%),var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%}
.slot{fill:var(--land);stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.noborder .slot{stroke:var(--land);stroke-dasharray:none}
.ctx{fill:var(--ctx);stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke}
.placed{stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.blink{animation:blink .5s ease-in-out 5 alternate}
@keyframes blink{from{fill:var(--land)}to{fill:#ffd166}}
.inset{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#tray{flex:none;display:flex;align-items:center;gap:8px;height:128px;background:var(--paper);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));box-shadow:0 -2px 0 rgba(36,50,74,.08)}
.card{flex:none;width:82px;height:104px;border-radius:16px;background:#fff;border:2px solid #efe6d2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:grab;
  transition:opacity .15s,transform .15s}
.card svg{width:60px;height:56px;overflow:visible}
.card .nm{font-weight:900;font-size:13px;line-height:1.1;text-align:center;padding:0 3px}
.card .nm.long{font-size:10.5px}
.card .kn{font-size:10px;color:var(--ink-soft);line-height:1.1}
.hidenames .card .nm,.hidenames .card .kn{display:none}
.hidenames .card svg{width:68px;height:76px}
.card.lifted{opacity:.25;transform:scale(.92)}
.card.wobble{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#more{flex:none;margin-left:auto;border:0;background:var(--land);border-radius:16px;width:56px;height:104px;font-weight:700;font-size:12px;line-height:1.3}
#more b{display:block;font-size:22px}
@media (min-aspect-ratio:5/4){
  #stage{flex-direction:row}
  #tray{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;height:auto;width:clamp(200px,24vw,290px);
    padding-block:12px;padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px));overflow:hidden;box-shadow:-2px 0 0 rgba(36,50,74,.08)}
  .card{width:calc(50% - 4px);height:116px}
  .card svg{width:76px;height:64px}
  #more{width:100%;height:52px;margin:0}
  #more b{display:inline;font-size:18px;margin-right:6px}
}
#float{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;overflow:visible}
#float path{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 6px 6px rgba(36,50,74,.3))}
#bubble{position:fixed;z-index:25;pointer-events:none;background:#fff;border-radius:18px;padding:8px 14px;
  box-shadow:0 6px 18px rgba(36,50,74,.22);text-align:center;transform:translate(-50%,-115%);transition:opacity .3s}
#bubble .em{font-size:30px;line-height:1}
#bubble .nm{font-weight:900;font-size:18px}
#bubble .kn{font-size:12px;color:var(--ink-soft)}
#bubble .mb{font-size:13px;font-weight:700;color:var(--good)}
.ov{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--sea);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-weight:900;font-size:clamp(30px,8vw,48px);letter-spacing:.04em;text-wrap:balance;text-align:center}
h1 ruby rt{font-size:.32em;font-weight:700;letter-spacing:.1em;color:var(--ink-soft)}
.lead{text-align:center;margin:0;font-size:15px;color:var(--ink-soft)}
#hero{width:100%;max-width:100%;height:auto;aspect-ratio:900/820;max-height:46vh}
#hero.us{aspect-ratio:975/610}
#hero path{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
#hero path:hover{filter:brightness(1.08)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{border:0;border-radius:18px;background:var(--paper);padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;
  box-shadow:0 3px 0 rgba(36,50,74,.12)}
.mode:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(36,50,74,.12)}
.mode .sw{width:28px;height:8px;border-radius:4px}
.mode .mn{font-weight:900;font-size:18px}
.mode .mk{font-size:11px;color:var(--ink-soft)}
.mode .mr{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:700}
.mode.big{grid-column:1/-1;background:var(--accent);color:var(--accent-ink)}
.mode.big .mk,.mode.big .mr{color:var(--accent-ink);opacity:.9}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tg{border:2px solid var(--paper);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.tg[aria-pressed="true"]{background:var(--paper)}
.tip{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}
#clear{display:flex;align-items:center;justify-content:center;background:rgba(36,50,74,.35)}
.cbox{background:var(--paper);border-radius:28px;padding:26px 22px;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 40px rgba(36,50,74,.3);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.cbox h2{margin:0;font-size:32px;font-weight:900}
.stars{font-size:40px;letter-spacing:6px;color:#ffb703}
.stars i{font-style:normal;color:#e4dccb}
.cbox .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cbox .nb{color:var(--accent);font-weight:900}
.btn{border:0;border-radius:999px;padding:13px 18px;font-size:17px;font-weight:900;background:var(--accent);color:var(--accent-ink)}
.btn.sub{background:var(--land);color:var(--ink)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:31}
/* こどもモード */
.slot.near{fill:#ffe08a;stroke:#f4a300;stroke-dasharray:none;stroke-width:2.5}
.emo{pointer-events:none;text-anchor:middle;dominant-baseline:central}
.kidkana .card .kn{order:1;font-size:13.5px;font-weight:900;color:var(--ink);white-space:nowrap;letter-spacing:-.04em}
@media (max-aspect-ratio:5/4){.kid .card{width:88px}}
.kidkana .card .nm{order:2;font-size:10px;font-weight:700;color:var(--ink-soft)}
.kid #tm{display:none}
.sec{margin:8px 0 0;font-size:20px;font-weight:900;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.sec small{font-size:13px;font-weight:700;color:var(--ink-soft)}
.stages{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.stg{border:0;border-radius:20px;background:var(--paper);padding:10px 12px 12px;text-align:left;display:flex;flex-direction:column;gap:4px;
  box-shadow:0 3px 0 rgba(36,50,74,.12);position:relative}
.stg:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(36,50,74,.12)}
.stg .no{font-size:12px;font-weight:900;color:var(--ink-soft)}
.stg .sn{font-size:17px;font-weight:900}
.stg .se{font-size:20px;letter-spacing:2px;line-height:1.2}
.stg .se i{font-style:normal;filter:grayscale(1);opacity:.3}
.stg .ok{position:absolute;top:8px;right:10px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;font-weight:900;display:grid;place-items:center;font-size:15px}
.zbtn{align-self:center;border:0;border-radius:999px;background:var(--paper);padding:10px 20px;font-size:16px;font-weight:900;box-shadow:0 3px 0 rgba(36,50,74,.12)}
.stk{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;font-size:34px}
.stk span{animation:pop .5s cubic-bezier(.2,1.6,.4,1) backwards}
/* ちず・ことば の きりかえ */
.seg{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}
.seg button{border:0;border-radius:999px;background:rgba(255,250,240,.55);padding:10px 18px;font-size:17px;font-weight:900;box-shadow:0 2px 0 rgba(36,50,74,.1)}
.seg button[aria-pressed="true"]{background:var(--paper);outline:3px solid var(--accent)}
.seg .lg{font-size:14px;padding:8px 14px}
#zukan .zhead{display:flex;align-items:center;gap:10px}
#zukan h2{margin:0;flex:1;font-size:22px;font-weight:900}
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.zc{border:0;border-radius:16px;background:var(--paper);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:104px}
.zc .ze{font-size:32px;line-height:1.1}
.zc svg{width:48px;height:40px}
.zc .zk{font-size:12px;font-weight:900}
.zc .zn{font-size:10px;color:var(--ink-soft)}
.zc.no{background:rgba(255,250,240,.5)}
.zc.no .zk{color:var(--ink-soft)}
@media (prefers-reduced-motion:reduce){.pop,.blink,.card.wobble,.cbox,.stk span{animation:none}}
</style>
<!-- app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/icon-192.png">
<script src="../common/app.js" defer></script>
<!-- /app -->
</head>
<body>


<div id="app">
  <header id="bar">
    <button class="chip" id="back">← もどる</button>
    <div class="ttl" id="ttl"></div>
    <button class="chip" id="hintBtn" title="ヒント">💡</button>
    <div class="stat" id="cnt">0/47</div>
    <div class="stat" id="tm">0:00</div>
  </header>
  <main id="stage">
    <div id="mapwrap"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="tray"></div>
  </main>
</div>
<svg id="float"></svg>
<div id="bubble" hidden></div>

<section class="ov" id="home">
  <div class="wrap">
    <div class="seg" id="mapSeg">
      <button id="m-jp" data-map="jp"></button>
      <button id="m-us" data-map="us"></button>
      <button class="lg" id="langBtn"></button>
    </div>
    <h1 id="h1"></h1>
    <p class="lead" id="lead"></p>
    <h2 class="sec" id="kidsSec"></h2>
    <div class="stages" id="stages"></div>
    <button class="zbtn" id="zOpen"></button>
    <h2 class="sec" id="regSec"></h2>
    <svg id="hero" role="img"></svg>
    <div class="modes" id="modes"></div>
    <div class="opts">
      <button class="tg" id="o-border" aria-pressed="true"></button>
      <button class="tg" id="o-names" aria-pressed="true"></button>
      <button class="tg" id="o-voice" aria-pressed="true"></button>
      <button class="tg" id="o-sound" aria-pressed="true"></button>
      <button class="tg" id="o-ai" aria-pressed="true" hidden></button>
    </div>
    <p class="tip" id="tip1"></p>
    <p class="tip" id="tip2"></p>
    <p class="tip" id="tipParent"></p>
    <p class="tip" id="tipCredit">こえ: VOICEVOX:冥鳴ひまり、VOICEVOX:四国めたん、VOICEVOX:ずんだもん、VOICEVOX:雨晴はう</p>
    <div id="kkSlot" style="text-align:center;margin:8px 0 16px"></div>
  </div>
</section>

<section class="ov" id="clear" hidden>
  <div class="cbox">
    <h2 id="cTitle"></h2>
    <div class="stars" id="cStars"></div>
    <div class="t" id="cTime"></div>
    <div class="nb" id="cBest"></div>
    <div class="stk" id="cStk"></div>
    <button class="btn" id="cAgain"></button>
    <button class="btn sub" id="cHome"></button>
  </div>
</section>

<section class="ov" id="zukan" hidden>
  <div class="wrap">
    <div class="zhead"><button class="chip" id="zClose"></button><h2 id="zTitle"></h2><div class="stat" id="zCnt"></div></div>
    <p class="tip" id="zTip"></p>
    <div class="zgrid" id="zGrid"></div>
  </div>
</section>
<canvas id="confetti"></canvas>

<script src="../common/kakin.js"></script>

/* ---------- こえの じゅんばんまち（2026-11-16）: どの こえも さいごまで よむ。とめるのは がめんを でるとき（hush）だけ ----------
   mode: なし＝じゅんばんに まつ / 'idle'＝ほかの こえが なっていなければ だけ（おしゃべり）/ 'swap'＝'swap' どうしだけ いれかわる（かぞえる こえ・タップで なまえ） */
const VQ = { q: [], cur: null, seq: 0 };
function vqBusy() { return !!VQ.cur || VQ.q.length > 0; }
function vqHas(tag) { return (VQ.cur && VQ.cur.tag === tag) || VQ.q.some(x => x.tag === tag); }
function vqAdd(it, mode) {
  if (mode === 'idle' && vqBusy()) return false;
  it.swap = mode === 'swap';
  if (it.swap) { VQ.q = VQ.q.filter(x => !x.swap); if (VQ.cur && VQ.cur.swap) vqCut(); }
  VQ.q.push(it); vqNext(); return true;
}
function vqCut() { const c = VQ.cur; VQ.cur = null; VQ.seq++; if (c && c.stop) try { c.stop(); } catch (e) {} }
function vqNext() {
  if (VQ.cur) return;
  const it = VQ.q.shift(); if (!it) return;
  VQ.cur = it; const my = ++VQ.seq; let fin = false, safety = 0;
  const done = () => { if (fin) return; fin = true; clearTimeout(safety); if (my !== VQ.seq) return; VQ.cur = null; if (it.onend) try { it.onend(); } catch (e) {} vqNext(); };
  safety = setTimeout(done, (it.max || 8) * 1000);
  try { it.stop = it.play(done) || null; } catch (e) { done(); }
}
function hush() { VQ.q = []; vqCut(); try { if (window.speechSynthesis) speechSynthesis.cancel(); } catch (e) {} }
function vqTts(u) {
  return done => { u.onend = done; u.onerror = done; speechSynthesis.cancel(); speechSynthesis.speak(u); return () => speechSynthesis.cancel(); };
}
// 端末の 英語の声（アメリカの英語を さきに えらぶ）
let enVoice=null;
function pickVoice(){
  try{
    const vs=speechSynthesis.getVoices(); if(!vs.length) return;
    const us=vs.filter(v=>/^en[-_]US/i.test(v.lang)), en=vs.filter(v=>/^en/i.test(v.lang));
    const pref=/Samantha|Google US English|Aria|Jenny|Ava|Allison|Zira/i;
    enVoice=us.find(v=>pref.test(v.name))||us.find(v=>v.localService)||us[0]||en[0]||null;
  }catch(e){}
}
if(window.speechSynthesis){ pickVoice(); try{ speechSynthesis.addEventListener("voiceschanged",pickVoice); }catch(e){} }
// 端末の よみあげ。日本語は 県の名前を 漢字で わたす（ひらがなだと アクセントが くずれやすい、2026-11-23〜）
function sayDev(text, mode, tag){
  if(!window.speechSynthesis) return;
  try{ const u=new SpeechSynthesisUtterance(text);
    if(LANG==="ja"){ u.lang="ja-JP"; u.rate=1; } else { u.lang="en-US"; if(enVoice) u.voice=enVoice; u.rate=.95; }
    vqAdd({play:vqTts(u), max:3+text.length*(LANG==="ja"?.25:.12), tag}, mode); }catch(e){}
}
/* こえは keys（ことばの 名前）で よぶ: n<id>＝なまえ、f<id>＝めいぶつ、p0〜p4＝ほめことば、here/close/glow/hintS/clear/clearKid/clearAll/nost。

   opt.ai: 1〜4＝AIのこえ、0＝たんまつの こえ */
const AI_VOICES=["vv_himari","vv_metan","vv_zunda","vv_hau"];
const useAI = () => M.ai && LANG==="ja" && opt.ai;
const vtext = k => { const v=L().v;
  if(k[0]==="n"&&/^\d/.test(k.slice(1))) return I(+k.slice(1)).say;
  if(k[0]==="f"&&/^\d/.test(k.slice(1))) return I(+k.slice(1)).mb;
  if(/^p\d$/.test(k)) return v.p[+k[1]];
  if(k==="clearAll") return LM().clearAll;
  return v[k]||""; };
const aiBuf={};
function aiLoad(k){
  const id=AI_VOICES[(opt.ai||1)-1]+"/"+k;
  if(aiBuf[id]) return aiBuf[id];
  return aiBuf[id]=fetch("voice/"+id+".mp3").then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(b=>new Promise((res,rej)=>{ unlockAudio(); ac.decodeAudioData(b,res,rej); })).catch(()=>null);
}
function say(keys, mode, tag){
  if(!opt.voice) return;
  if(tag && vqHas(tag)) return;
  if(typeof keys==="string") keys=[keys];
  const text = LANG==="ja" ? keys.map(vtext).join(keys.length>1&&keys[1]!=="hintS"?"。":"")
    : keys.map(vtext).join(keys[1]==="hintS"?" ":/^p\d$/.test(keys[0])?" ":". ");
  if(!useAI()||!ac){ sayDev(text,mode,tag); return; }
  const ps=keys.map(aiLoad);
  vqAdd({tag, max:4+keys.length*2, play:done=>{
    let stop=false, src=null;
    Promise.all(ps).then(bs=>{
      if(stop) return;
      if(bs.some(b=>!b)){ done(); sayDev(text,mode,tag); return; }
      let i=0; const next=()=>{ if(stop) return; if(i>=bs.length){ done(); return; }
        src=ac.createBufferSource(); src.buffer=bs[i++]; src.connect(ac.destination); src.onended=next; src.start(); };
      next();
    });
    return ()=>{ stop=true; try{ src&&src.stop(); }catch(e){} };
  }}, mode);
}

  if(!modeOpen(k)){ Kakin.ask(); return; }
  const mode=findMode(k);
  G={mode,ids:mode.ids.slice(),queue:shuffle(mode.ids.slice()),tray:[],placed:new Set(),miss:{},errors:0,t0:0,sec:0,started:false,lastId:null};
  clearInterval(timerId); $("#tm").textContent="0:00";
  $("#ttl").innerHTML=`${nameOf(mode)}<small>${kanaOf(mode)}</small>`;
  $("#home").hidden=true; $("#clear").hidden=true; $("#bubble").hidden=true; stopConfetti();
  document.body.classList.toggle("noborder",!opt.border);
  document.body.classList.toggle("hidenames",!opt.names);
  document.body.classList.toggle("kid",!!mode.kid);
  // 日本の地図を 日本語で: こどもステージは ひらがなを 大きく
  document.body.classList.toggle("kidkana",!!mode.kid && MAPK==="jp" && LANG==="ja");
  $("#zukan").hidden=true;
  buildMap(); layoutTray(); updateCount();
}

function insetRect(id,o,m){ const b=P(id).b; m=m||(MAPK==="jp"?9:7); return el("rect",{class:"inset",x:b[0]+o[0]-m,y:b[1]+o[1]-m,width:b[2]+m*2,height:b[3]+m*2,rx:6}); }
function buildMap(){
  map.innerHTML="";
  const inMode=new Set(G.ids);
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of G.ids){ const b=P(id).b, o=offOf(id); x0=Math.min(x0,b[0]+o[0]); y0=Math.min(y0,b[1]+o[1]); x1=Math.max(x1,b[0]+b[2]+o[0]); y1=Math.max(y1,b[1]+b[3]+o[1]); }
  const pad=Math.max(x1-x0,y1-y0)*.07+8;
  map.setAttribute("viewBox",`${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}`);
  const ctx=el("g"), slots=el("g"), placed=el("g",{id:"placedG"}), emo=el("g",{id:"emoG"});
  for(const s of SH){
    if(inMode.has(s.id) || M.ctxSkip.includes(s.id)) continue;
    const c=el("path",{d:s.d,class:"ctx"});
    // こどもステージでは、シールを持っている ところを うすく色づけして「ここまで できた」が見えるように
    if(G.mode.kid && stickers.has(s.id)) c.setAttribute("style",`fill:${M.color(s.id)};opacity:.55`);
    ctx.appendChild(c);
  }
  for(const id of G.ids){
    const o=offOf(id);
    slots.appendChild(el("path",{d:P(id).d,class:"slot",id:"slot"+id,transform:`translate(${o[0]} ${o[1]})`}));
  }
  map.append(ctx,slots,placed,emo);
  for(const id of M.insets) if(inMode.has(id)) map.appendChild(insetRect(id,offOf(id)));
}

function trayCapacity(){
  const land=matchMedia("(min-aspect-ratio:5/4)").matches;
  const cs=getComputedStyle(tray);
  if(land){ const h=tray.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-60; return Math.max(2,Math.floor(h/124)*2); }
  const w=tray.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-64;
  return Math.max(1,Math.floor(w/(G&&G.mode.kid?96:90)));
}
function layoutTray(){
  if(!G) return;
  const n=trayCapacity();
  while(G.tray.length>n) G.queue.unshift(G.tray.pop());
  while(G.tray.length<n && G.queue.length) G.tray.push(G.queue.shift());
  renderTray();
}
function cardSvg(id){
  const b=P(id).b, m=Math.max(b[2],b[3])*.06+1;
  return `<svg viewBox="${b[0]-m} ${b[1]-m} ${b[2]+m*2} ${b[3]+m*2}" aria-hidden="true"><path d="${P(id).d}" fill="${M.color(id)}" stroke="#fff" stroke-width="${Math.max(b[2],b[3])/60}"/></svg>`;
}
function renderTray(){
  tray.innerHTML="";
  for(const id of G.tray){
    const c=document.createElement("div"); c.className="card"; c.dataset.id=id; const inf=I(id);
    c.innerHTML=cardSvg(id)+`<div class="nm${isLong(inf.nm)?" long":""}">${inf.nm}</div><div class="kn">${inf.kn}</div>`;
    c.addEventListener("pointerdown",e=>startDrag(e,id,c));
    tray.appendChild(c);
  }
  if(G.queue.length){
    const m=document.createElement("button"); m.id="more";
    m.innerHTML=`<b>↻</b>${L().more}`; m.title=L().moreT(G.queue.length);
    m.onclick=()=>{ unlockAudio(); sPick(); G.queue.push(...G.tray); G.tray=[]; layoutTray(); };
    tray.appendChild(m);
  }
}
function updateCount(){ $("#cnt").textContent=`${G.placed.size}/${G.ids.length}`; }
const fmt = s => `${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
function startTimer(){
  G.started=true; G.t0=Date.now();
  timerId=setInterval(()=>{ G.sec=Math.floor((Date.now()-G.t0)/1000); $("#tm").textContent=fmt(G.sec); },500);
}

/* ---------- ドラッグ ---------- */
function startDrag(e,id,card){
  if(drag||!G) return;
  e.preventDefault(); unlockAudio(); sPick();
  if(G.mode.kid) say("n"+id,"swap"); // 字が よめない子にも わかるように、もったら 名前を よむ
  if(!G.started) startTimer();
  G.lastId=id;
  const p=P(id), a=map.getScreenCTM().a, maxDim=Math.max(p.b[2],p.b[3]);
  // 小さい ところ（香川・ロードアイランドなど）も 指の上で見えるように、持ち上げたピースは ある程度の大きさにする
  const s=Math.max(a,(G.mode.kid?46:30)/maxDim);
  const lift=e.pointerType==="mouse"?0:Math.min(90,maxDim*s*.45+34);
  const g=el("g"); g.appendChild(el("path",{d:p.d,fill:M.color(id)}));
  floatSvg.appendChild(g);
  const r=card.getBoundingClientRect();
  drag={id,card,g,s,lift,X:e.clientX,Y:e.clientY-lift,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,home:[r.left+r.width/2,r.top+r.height/2]};
  card.classList.add("lifted");
  setFloat(drag.X,drag.Y,s);
  try{ card.setPointerCapture(e.pointerId); }catch(_){}
  window.addEventListener("pointermove",onMove,{passive:false});
  window.addEventListener("pointerup",onUp);
  window.addEventListener("pointercancel",onCancel);
}
function setFloat(X,Y,s){ const c=P(drag.id).c; drag.g.setAttribute("transform",`translate(${X} ${Y}) scale(${s}) translate(${-c[0]} ${-c[1]})`); }
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) drag.moved=true;
  drag.X=e.clientX; drag.Y=e.clientY-drag.lift; setFloat(drag.X,drag.Y,drag.s);
  if(G.mode.kid && drag.moved){ const h=judge(drag.id,drag.X,drag.Y); $("#slot"+drag.id)?.classList.toggle("near",h.ok); }
}
// 放した場所が正しいか。こどもステージは当たりの範囲を広くする
function judge(id,X,Y){
  const ctm=map.getScreenCTM(), a=ctm.a, p=P(id), o=offOf(id);
  const mx=(X-ctm.e)/a, my=(Y-ctm.f)/ctm.d;
  const tx=p.c[0]+o[0], ty=p.c[1]+o[1];
  const d=Math.hypot(mx-tx,my-ty)*a, kid=G.mode.kid;
  const dim=Math.max(p.b[2],p.b[3])*a;
  const tol=kid?Math.max(46,Math.min(100,.5*dim)):Math.max(30,Math.min(72,.35*dim));
  let near=null, nd=1e9;
  for(const j of G.ids){ if(G.placed.has(j)) continue; const q=P(j), qo=offOf(j); const dd=Math.hypot(mx-q.c[0]-qo[0],my-q.c[1]-qo[1]); if(dd<nd){ nd=dd; near=j; } }
  return {ok:d<tol && (near===id || d<(kid?28:16)), sx:tx*a+ctm.e, sy:ty*ctm.d+ctm.f, a};
}
function endListeners(){ window.removeEventListener("pointermove",onMove); window.removeEventListener("pointerup",onUp); window.removeEventListener("pointercancel",onCancel); }
function onCancel(){ if(!drag) return; endListeners(); returnHome(false); }
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  endListeners();
  const id=drag.id;
  $("#slot"+id)?.classList.remove("near");
  if(!drag.moved){ if(!G.mode.kid) say("n"+id,"swap"); returnHome(false); return; }
  const h=judge(id,drag.X,drag.Y), kid=G.mode.kid;
  G.miss[id]=G.miss[id]||0;
  if(!h.ok){ G.errors++; G.miss[id]++; sMiss(); }
  // こどもステージでは3回まちがえたら、ピースが自分で正しい場所へ飛んでいく
  if(h.ok || (kid && G.miss[id]>=3)){
    const dr=drag;
    if(!h.ok) say("here","","miss");
    animateFloat(dr,h.sx,h.sy,h.a,h.ok?200:700,()=>{ dr.g.remove(); drag=null; place(id); });
  } else {
    if(kid) say(G.miss[id]===1?"close":"glow","","miss");
    if(G.miss[id]>=(kid?1:2)) blinkSlot(id);
    returnHome(true);
  }
}
function animateFloat(dr,X,Y,s,ms,done){
  const X0=dr.X,Y0=dr.Y,s0=dr.s,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  (function step(t){
    let k=reduce?1:Math.min(1,(t-t0)/ms); k=1-Math.pow(1-k,3);
    const c=P(dr.id).c;
    dr.g.setAttribute("transform",`translate(${X0+(X-X0)*k} ${Y0+(Y-Y0)*k}) scale(${s0+(s-s0)*k}) translate(${-c[0]} ${-c[1]})`);
    if(k<1) requestAnimationFrame(step); else done();
  })(t0);
}
function returnHome(wobble){
  const dr=drag; if(!dr) return;
  animateFloat(dr,dr.home[0],dr.home[1],Math.min(dr.s,40/Math.max(P(dr.id).b[2],P(dr.id).b[3])),220,()=>{
    dr.g.remove(); dr.card.classList.remove("lifted");
    if(wobble){ dr.card.classList.remove("wobble"); void dr.card.offsetWidth; dr.card.classList.add("wobble"); }
    if(drag===dr) drag=null;
  });
}
function blinkSlot(id){
  const s=$("#slot"+id); if(!s) return;
  s.classList.remove("blink"); void s.getBBox(); s.classList.add("blink");
  setTimeout(()=>s.classList.remove("blink"),2600);
}

function place(id){
  G.placed.add(id);
  G.tray=G.tray.filter(x=>x!==id); G.queue=G.queue.filter(x=>x!==id);
  const o=offOf(id), g=el("g",{transform:`translate(${o[0]} ${o[1]})`});
  const path=el("path",{d:P(id).d,class:"placed pop",fill:M.color(id)});
  path.addEventListener("click",()=>showBubble(id));
  g.appendChild(path); $("#placedG").appendChild(g);
  $("#slot"+id)?.classList.remove("blink");
  sOk(); showBubble(id);
  if(G.mode.kid){
    say(["p"+(Math.random()*5|0),"n"+id]);
    const p=P(id), a=map.getScreenCTM().a, fs=Math.min(26/a,Math.max(p.b[2],p.b[3])*.55);
    const t=el("text",{x:p.c[0]+o[0],y:p.c[1]+o[1],class:"emo pop","font-size":fs}); t.textContent=I(id).em;
    $("#emoG").appendChild(t);
  } else say("n"+id,"swap");
  if(!stickers.has(id)){ stickers.add(id); store.set(M.store+"-stickers",[...stickers]); }
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_){}
  updateCount(); layoutTray();
  if(G.placed.size===G.ids.length) setTimeout(finish,700);
}

let bubbleT=null;
function showBubble(id){
  const b=$("#bubble"), ctm=map.getScreenCTM(), p=P(id), o=offOf(id), inf=I(id);
  b.innerHTML=`<div class="em">${inf.em}</div><div class="nm">${inf.nm}</div><div class="kn">${inf.kn}</div><div class="mb">${inf.mb}</div>`;
  let x=(p.c[0]+o[0])*ctm.a+ctm.e, y=(p.b[1]+o[1])*ctm.d+ctm.f;
  x=Math.max(90,Math.min(innerWidth-90,x)); y=Math.max(150,y);
  b.style.left=x+"px"; b.style.top=y+"px"; b.style.opacity=1; b.hidden=false;
  clearTimeout(bubbleT); bubbleT=setTimeout(()=>{ b.style.opacity=0; bubbleT=setTimeout(()=>b.hidden=true,300); },1800);
}

/* ---------- ヒント・もどる ---------- */
$("#hintBtn").onclick=()=>{
  if(!G) return; unlockAudio();
  const id=G.tray.includes(G.lastId)?G.lastId:G.tray[0]; if(!id) return;
  G.errors++; blinkSlot(id); if(G.mode.kid) G.miss[id]=(G.miss[id]||0)+1;
  const c=tray.querySelector(`.card[data-id="${id}"]`); if(c){ c.classList.remove("wobble"); void c.offsetWidth; c.classList.add("wobble"); }
  say(["n"+id,"hintS"],"","hint");
};
let backArmed=0;
$("#back").onclick=()=>{
  if(G && G.placed.size>0 && G.placed.size<G.ids.length && Date.now()-backArmed>2500){
    backArmed=Date.now(); $("#back").textContent=L().backAgain;
    setTimeout(()=>$("#back").textContent=L().back,2500); return;
  }
  goHome();
};
function goHome(){ hush(); stopConfetti(); clearInterval(timerId); G=null; tray.innerHTML=""; renderHome(); $("#clear").hidden=true; $("#zukan").hidden=true; $("#home").hidden=false; $("#bubble").hidden=true; $("#back").textContent=L().back; }

/* ---------- クリア ---------- */
function finish(){
  clearInterval(timerId);
  if(G.mode.kid) return finishKid();
  $("#cStk").innerHTML=""; $("#cStars").hidden=false; $("#cAgain").textContent=L().again; $("#cHome").textContent=L().otherReg;
  const n=G.ids.length, e=G.errors;
  const st=e<=Math.floor(n/7)?3:e<=Math.ceil(n/3)?2:1;
  const k=G.mode.k, prev=best[k]||{};
  const newBest=!prev.t||G.sec<prev.t;
  best[k]={t:newBest?G.sec:prev.t,st:Math.max(st,prev.st||0)}; store.set(M.store+"-best",best);
  $("#cTitle").textContent=k==="all"?LM().allTitle:L().done;
  $("#cStars").innerHTML="★".repeat(st)+"<i>"+"★".repeat(3-st)+"</i>";
  $("#cTime").textContent=L().time(fmt(G.sec),e);
  $("#cBest").textContent=newBest&&prev.t?L().newBest:"";
  $("#clear").hidden=false; sClear(); say(k==="all"?"clearAll":"clear"); confetti();
}
function finishKid(){
  const m=G.mode, next=M.kids[m.no];
  kidDone[m.k]=true; store.set(M.store+"-kid",kidDone);
  $("#cTitle").textContent=L().stickerGet;
  $("#cStars").hidden=true; $("#cTime").textContent=L().kidDone(nameOf(m)); $("#cBest").textContent="";
  $("#cStk").innerHTML=m.ids.map((id,i)=>`<span style="animation-delay:${.15+i*.15}s" title="${I(id).nm}">${I(id).em}</span>`).join("");
  $("#cAgain").textContent=next?L().next:LM().tryAll;
  $("#cHome").textContent=L().choose;
  $("#clear").hidden=false; sClear(); say("clearKid"); confetti();
}
$("#cAgain").onclick=()=>{
  const m=G.mode;
  if(m.kid) startGame(M.kids[m.no]?M.kids[m.no].k:"all"); else startGame(m.k);
};
$("#cHome").onclick=goHome;

let confT=0;
function stopConfetti(){ confT++; const cv=$("#confetti"); cv.getContext("2d").clearRect(0,0,cv.width,cv.height); }
function confetti(){
  const my=++confT;
  const cv=$("#confetti"), cx=cv.getContext("2d"), dpr=devicePixelRatio||1;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cols=M.modes.map(m=>m.color);
  const ps=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,w:6+Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    cx.clearRect(0,0,innerWidth,innerHeight);
    if(my!==confT) return;   // つぎの ゲームが はじまったら すぐ けす（まえは 1こま のこっていた）
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-3,p.w,6); cx.restore(); }
    if(t-t0<3200) requestAnimationFrame(f); else cx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------- ホーム ---------- */
function applyTexts(){
  const t=L();
  document.documentElement.lang=LANG;
  document.title=LANG==="ja"?(MAPK==="jp"?"都道府県パズル":"アメリカ 州パズル"):(MAPK==="jp"?"Japan Prefecture Puzzle":"USA States Puzzle");
  $("#m-jp").textContent=t.jp.map; $("#m-us").textContent=t.us.map; $("#langBtn").textContent=t.langBtn;
  $("#m-jp").setAttribute("aria-pressed",MAPK==="jp"); $("#m-us").setAttribute("aria-pressed",MAPK==="us");
  $("#h1").innerHTML=LM().title; $("#lead").textContent=t.lead;
  $("#kidsSec").innerHTML=`${t.kidsSec}<small>${LM().kidsSub}</small>`;
  $("#regSec").innerHTML=`${LM().regSec}<small>${t.regSub}</small>`;
  for(const k of ["border","names","voice","sound"]) $("#o-"+k).textContent=t[k];
  $("#tip1").textContent=t.tip1; $("#tip2").textContent=LM().tip2; $("#tip2").hidden=!LM().tip2;
  $("#tipParent").textContent=LM().parent;
  $("#tipCredit").hidden=!(M.ai&&LANG==="ja");
  aiLabel(); $("#o-ai").hidden=!(M.ai&&LANG==="ja");
  $("#back").textContent=t.back; $("#hintBtn").title=t.hint;
  $("#zClose").textContent=t.back; $("#zTitle").textContent=t.zukan; $("#zTip").textContent=LM().zTip;
  $("#hero").setAttribute("aria-label",t.heroLabel);
}
function renderHome(){
  applyTexts();
  const hero=$("#hero"); hero.innerHTML=""; hero.setAttribute("viewBox",M.view); hero.classList.toggle("us",MAPK==="us");
  for(const s of SH){
    const p=el("path",{d:s.d,fill:M.heroColor(s.id)});
    const t=el("title"); t.textContent=I(s.id).nm; p.appendChild(t);
    p.addEventListener("click",()=>{ unlockAudio(); startGame(M.modeOfId(s.id)); });
    hero.appendChild(p);
  }
  for(const id of M.insets) hero.appendChild(insetRect(id,[0,0]));
  const box=$("#modes"); box.innerHTML="";
  for(const m of M.modes){
    const r=best[m.k], btn=document.createElement("button");
    btn.className="mode"+(m.k==="all"?" big":"")+(modeOpen(m.k)?"":" kk-lock");
    btn.innerHTML=`${m.k==="all"?"":`<span class="sw" style="background:${m.color}"></span>`}<span class="mn">${nameOf(m)}</span><span class="mk">${kanaOf(m)}${L().sep}${L().pieces(m.ids.length)}</span><span class="mr">${r?`⏱ ${fmt(r.t)}　${"★".repeat(r.st)}`:L().notYet}</span>`;
    btn.onclick=()=>{ unlockAudio(); startGame(m.k); };
    box.appendChild(btn);
  }
  const sb=$("#stages"); sb.innerHTML="";
  for(const m of M.kids){
    const btn=document.createElement("button"); btn.className="stg"+(modeOpen(m.k)?"":" kk-lock");
    btn.innerHTML=`<span class="no">${kanaOf(m)}</span><span class="sn">${nameOf(m)}</span><span class="se">${m.ids.map(id=>stickers.has(id)?I(id).em:`<i>${I(id).em}</i>`).join("")}</span>${kidDone[m.k]?`<span class="ok" aria-label="${L().cleared}">✓</span>`:""}`;
    btn.onclick=()=>{ unlockAudio(); startGame(m.k); };
    sb.appendChild(btn);
  }
  $("#zOpen").textContent=`${L().zukan}　${stickers.size}/${M.n}`;
  $("#kkSlot").replaceChildren(Kakin.parentButton());
}
function openZukan(){
  const g=$("#zGrid"); g.innerHTML="";
  $("#zCnt").textContent=`${stickers.size}/${M.n}`;
  for(let id=1;id<=M.n;id++){
    const has=stickers.has(id), inf=I(id), b=document.createElement("button");
    b.className="zc"+(has?"":" no");
    b.innerHTML=has?`<span class="ze">${inf.em}</span><span class="zk">${inf.nm}</span><span class="zn">${inf.mb}</span>`
      :cardSvg(id).replace(/fill="[^"]*"/,'fill="#d9d2c0"')+`<span class="zk">${L().q}</span><span class="zn">${MAPK==="jp"&&LANG==="ja"?inf.kn:inf.nm}</span>`;
    b.onclick=()=>{ unlockAudio(); say(has?["n"+id,"f"+id]:["n"+id,"nost"],"swap"); };
    g.appendChild(b);
  }
  $("#home").hidden=true; $("#zukan").hidden=false; $("#zukan").scrollTop=0;
}
$("#zOpen").onclick=()=>{ unlockAudio(); openZukan(); };
$("#zClose").onclick=()=>{ hush(); $("#zukan").hidden=true; renderHome(); $("#home").hidden=false; };
for(const k of ["border","names","voice","sound"]){
  const b=$("#o-"+k); b.setAttribute("aria-pressed",opt[k]);
  b.onclick=()=>{ opt[k]=!opt[k]; b.setAttribute("aria-pressed",opt[k]); store.set("todofuken-opt",opt); unlockAudio(); if(k==="sound"&&opt.sound) sOk(); if(k==="voice"&&!opt.voice) hush(); };
}
function aiLabel(){ $("#o-ai").textContent=opt.ai?L().ai(opt.ai):L().dev; }
$("#o-ai").onclick=()=>{ opt.ai=(opt.ai+1)%5; store.set("todofuken-opt",opt); aiLabel(); unlockAudio(); hush(); opt.voice=true; $("#o-voice").setAttribute("aria-pressed",true); say("p0","swap"); };
// ちず・ことば の きりかえ（べつべつに えらべる）
for(const b of document.querySelectorAll("#mapSeg [data-map]")) b.onclick=()=>{ if(b.dataset.map===MAPK) return; hush(); loadMap(b.dataset.map); store.set("todofuken-map",MAPK); renderHome(); };
$("#langBtn").onclick=()=>{ hush(); LANG=LANG==="ja"?"en":"ja"; store.set("todofuken-lang",LANG); renderHome(); };
addEventListener("resize",()=>{ if(G&&!drag) layoutTray(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
renderHome();
</script>
