<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}body{margin:0}[hidden]{display:none!important}</style>
<title>都道府県パズル</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: 海の上に日本地図、下(横向きなら右)にピースのトレイ。地図帳のような紙と海の色で、明るい一色の見た目に固定 */
:root{
  --sea:#bfe2ee; --sea-deep:#8cc6dc; --paper:#fffaf0; --land:#f6efdc; --ctx:#dcd6c6;
  --ink:#24324a; --ink-soft:#5f6b80; --line:#b9ad94; --accent:#ff7a59; --accent-ink:#ffffff; --good:#2fa36b;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font-family:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#app{height:100%;display:flex;flex-direction:column}
#bar{display:flex;align-items:center;gap:8px;padding-block:8px;
  padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  background:var(--paper);box-shadow:0 2px 0 rgba(36,50,74,.08);z-index:2}
.chip{border:0;background:var(--land);border-radius:999px;padding:8px 14px;font-size:15px;font-weight:700;white-space:nowrap}
#bar .ttl{flex:1;min-width:0;font-weight:900;font-size:17px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#bar .ttl small{font-weight:500;font-size:12px;color:var(--ink-soft);margin-left:4px}
.stat{font-variant-numeric:tabular-nums;font-weight:700;font-size:15px;white-space:nowrap}
#stage{flex:1;min-height:0;display:flex;flex-direction:column;touch-action:none}
#mapwrap{flex:1;min-height:0;position:relative;
  background:radial-gradient(circle at 30% 20%,rgba(255,255,255,.35),transparent 60%),var(--sea)}
#map{position:absolute;inset:0;width:100%;height:100%}
.slot{fill:var(--land);stroke:var(--line);stroke-width:1.1;stroke-dasharray:3 2.5;vector-effect:non-scaling-stroke;stroke-linejoin:round}
.noborder .slot{stroke:var(--land);stroke-dasharray:none}
.ctx{fill:var(--ctx);stroke:#fff;stroke-width:.6;vector-effect:non-scaling-stroke}
.placed{stroke:#fff;stroke-width:1.6;vector-effect:non-scaling-stroke;stroke-linejoin:round;cursor:pointer}
.pop{transform-box:fill-box;transform-origin:center;animation:pop .45s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.blink{animation:blink .5s ease-in-out 5 alternate}
@keyframes blink{from{fill:var(--land)}to{fill:#ffd166}}
.inset{fill:none;stroke:var(--ink-soft);stroke-width:1;stroke-dasharray:5 4;vector-effect:non-scaling-stroke}
#tray{flex:none;display:flex;align-items:center;gap:8px;height:128px;background:var(--paper);
  padding-block:10px;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));
  padding-bottom:max(10px,env(safe-area-inset-bottom,0px));box-shadow:0 -2px 0 rgba(36,50,74,.08)}
.card{flex:none;width:82px;height:104px;border-radius:16px;background:#fff;border:2px solid #efe6d2;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;touch-action:none;cursor:grab;
  transition:opacity .15s,transform .15s}
.card svg{width:60px;height:56px;overflow:visible}
.card .nm{font-weight:900;font-size:13px;line-height:1.1}
.card .kn{font-size:10px;color:var(--ink-soft);line-height:1.1}
.hidenames .card .nm,.hidenames .card .kn{display:none}
.hidenames .card svg{width:68px;height:76px}
.card.lifted{opacity:.25;transform:scale(.92)}
.card.wobble{animation:wob .4s}
@keyframes wob{25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}
#more{flex:none;margin-left:auto;border:0;background:var(--land);border-radius:16px;width:56px;height:104px;font-weight:700;font-size:12px;line-height:1.3}
#more b{display:block;font-size:22px}
@media (min-aspect-ratio:5/4){
  #stage{flex-direction:row}
  #tray{flex-direction:row;flex-wrap:wrap;align-content:flex-start;justify-content:center;height:auto;width:clamp(200px,24vw,290px);
    padding-block:12px;padding-left:12px;padding-right:max(12px,env(safe-area-inset-right,0px));overflow:hidden;box-shadow:-2px 0 0 rgba(36,50,74,.08)}
  .card{width:calc(50% - 4px);height:116px}
  .card svg{width:76px;height:64px}
  #more{width:100%;height:52px;margin:0}
  #more b{display:inline;font-size:18px;margin-right:6px}
}
#float{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20;overflow:visible}
#float path{stroke:#fff;stroke-width:1.5;vector-effect:non-scaling-stroke;filter:drop-shadow(0 6px 6px rgba(36,50,74,.3))}
#bubble{position:fixed;z-index:25;pointer-events:none;background:#fff;border-radius:18px;padding:8px 14px;
  box-shadow:0 6px 18px rgba(36,50,74,.22);text-align:center;transform:translate(-50%,-115%);transition:opacity .3s}
#bubble .em{font-size:30px;line-height:1}
#bubble .nm{font-weight:900;font-size:18px}
#bubble .kn{font-size:12px;color:var(--ink-soft)}
#bubble .mb{font-size:13px;font-weight:700;color:var(--good)}
.ov{position:fixed;inset:0;z-index:30;overflow-y:auto;background:var(--sea);
  padding-block:max(16px,env(safe-area-inset-top,0px)) max(24px,env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{margin:6px 0 0;font-weight:900;font-size:clamp(30px,8vw,48px);letter-spacing:.04em;text-wrap:balance;text-align:center}
h1 ruby rt{font-size:.32em;font-weight:700;letter-spacing:.1em;color:var(--ink-soft)}
.lead{text-align:center;margin:0;font-size:15px;color:var(--ink-soft)}
#hero{width:100%;max-width:100%;height:auto;aspect-ratio:900/820;max-height:46vh}
#hero path{stroke:#fff;stroke-width:.8;vector-effect:non-scaling-stroke;cursor:pointer}
#hero path:hover{filter:brightness(1.08)}
.modes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.mode{border:0;border-radius:18px;background:var(--paper);padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:3px;
  box-shadow:0 3px 0 rgba(36,50,74,.12)}
.mode:active{transform:translateY(2px);box-shadow:0 1px 0 rgba(36,50,74,.12)}
.mode .sw{width:28px;height:8px;border-radius:4px}
.mode .mn{font-weight:900;font-size:18px}
.mode .mk{font-size:11px;color:var(--ink-soft)}
.mode .mr{font-size:13px;font-variant-numeric:tabular-nums;color:var(--ink-soft);font-weight:700}
.mode.big{grid-column:1/-1;background:var(--accent);color:var(--accent-ink)}
.mode.big .mk,.mode.big .mr{color:var(--accent-ink);opacity:.9}
.opts{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.tg{border:2px solid var(--paper);background:transparent;border-radius:999px;padding:7px 14px;font-weight:700;font-size:14px}
.tg[aria-pressed="true"]{background:var(--paper)}
.tip{font-size:12px;color:var(--ink-soft);text-align:center;margin:0}
#clear{display:flex;align-items:center;justify-content:center;background:rgba(36,50,74,.35)}
.cbox{background:var(--paper);border-radius:28px;padding:26px 22px;text-align:center;max-width:360px;width:100%;display:flex;flex-direction:column;gap:10px;
  box-shadow:0 12px 40px rgba(36,50,74,.3);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.cbox h2{margin:0;font-size:32px;font-weight:900}
.stars{font-size:40px;letter-spacing:6px;color:#ffb703}
.stars i{font-style:normal;color:#e4dccb}
.cbox .t{font-size:18px;font-weight:700;font-variant-numeric:tabular-nums}
.cbox .nb{color:var(--accent);font-weight:900}
.btn{border:0;border-radius:999px;padding:13px 18px;font-size:17px;font-weight:900;background:var(--accent);color:var(--accent-ink)}
.btn.sub{background:var(--land);color:var(--ink)}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:31}
@media (prefers-reduced-motion:reduce){.pop,.blink,.card.wobble,.cbox{animation:none}}
</style>
</head>
<body>


<div id="app">
  <header id="bar">
    <button class="chip" id="back">← もどる</button>
    <div class="ttl" id="ttl">ぜんこく</div>
    <button class="chip" id="hintBtn" title="ヒント">💡</button>
    <div class="stat" id="cnt">0/47</div>
    <div class="stat" id="tm">0:00</div>
  </header>
  <main id="stage">
    <div id="mapwrap"><svg id="map" preserveAspectRatio="xMidYMid meet"></svg></div>
    <div id="tray"></div>
  </main>
</div>
<svg id="float"></svg>
<div id="bubble" hidden></div>

<section class="ov" id="home">
  <div class="wrap">
    <h1><ruby>都道府県<rt>とどうふけん</rt></ruby>パズル</h1>
    <p class="lead">かたちを ゆびで うごかして、ちずに はめよう</p>
    <svg id="hero" viewBox="20 18 870 810" role="img" aria-label="日本地図。地方をタップするとはじまります"></svg>
    <div class="modes" id="modes"></div>
    <div class="opts">
      <button class="tg" id="o-border" aria-pressed="true">さかいせん</button>
      <button class="tg" id="o-names" aria-pressed="true">なまえ</button>
      <button class="tg" id="o-voice" aria-pressed="true">こえ</button>
      <button class="tg" id="o-sound" aria-pressed="true">おと</button>
    </div>
    <p class="tip">さかいせん・なまえ を けすと むずかしくなるよ。スマホは ちほうごと が あそびやすいよ。</p>
  </div>
</section>

<section class="ov" id="clear" hidden>
  <div class="cbox">
    <h2 id="cTitle">できた！</h2>
    <div class="stars" id="cStars"></div>
    <div class="t" id="cTime"></div>
    <div class="nb" id="cBest"></div>
    <button class="btn" id="cAgain">もういちど</button>
    <button class="btn sub" id="cHome">ほかの ちほう</button>
  </div>
</section>
<canvas id="confetti"></canvas>

let ac=null;
function unlockAudio(){ if(!ac){ try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(ac&&ac.state==="suspended") ac.resume(); }
function tone(f,t0,dur,type="sine",vol=.18){
  if(!ac||!opt.sound) return; const o=ac.createOscillator(), g=ac.createGain(); const t=ac.currentTime+t0;
  o.type=type; o.frequency.setValueAtTime(f,t); g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(vol,t+.01);
  g.gain.exponentialRampToValueAtTime(.001,t+dur); o.connect(g).connect(ac.destination); o.start(t); o.stop(t+dur+.02);
}

}

/* ---------- ゲームの状態 ---------- */
let G=null, drag=null, timerId=null;

function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.random()*(i+1)|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }
function offOf(id){ return (id===47 && G && G.mode.k==="ks") ? okiOffsetKs : [0,0]; }

function startGame(k){
  const mode=MODES.find(m=>m.k===k);
  G={mode,ids:mode.ids.slice(),queue:shuffle(mode.ids.slice()),tray:[],placed:new Set(),miss:{},errors:0,t0:0,sec:0,started:false,lastId:null};
  clearInterval(timerId); $("#tm").textContent="0:00";
  $("#ttl").innerHTML=`${mode.name}<small>${mode.kana}</small>`;
  $("#home").hidden=true; $("#clear").hidden=true; $("#bubble").hidden=true;
  document.body.classList.toggle("noborder",!opt.border);
  document.body.classList.toggle("hidenames",!opt.names);
  buildMap(); layoutTray(); updateCount();
}

function buildMap(){
  map.innerHTML="";
  const inMode=new Set(G.ids), all=G.mode.k==="all";
  let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;
  for(const id of G.ids){ const b=P(id).b, o=offOf(id); x0=Math.min(x0,b[0]+o[0]); y0=Math.min(y0,b[1]+o[1]); x1=Math.max(x1,b[0]+b[2]+o[0]); y1=Math.max(y1,b[1]+b[3]+o[1]); }
  const pad=Math.max(x1-x0,y1-y0)*.07+8;
  map.setAttribute("viewBox",`${x0-pad} ${y0-pad} ${x1-x0+pad*2} ${y1-y0+pad*2}`);
  const ctx=el("g"), slots=el("g"), placed=el("g",{id:"placedG"});
  for(const s of SHAPES){
    if(inMode.has(s.id)) continue;
    if(s.id===47) continue;
    ctx.appendChild(el("path",{d:s.d,class:"ctx"}));
  }
  for(const id of G.ids){
    const o=offOf(id);
    slots.appendChild(el("path",{d:P(id).d,class:"slot",id:"slot"+id,transform:`translate(${o[0]} ${o[1]})`}));
  }
  map.append(ctx,slots,placed);
  if(inMode.has(47)){ const b=P(47).b, o=offOf(47), m=9;
    map.appendChild(el("rect",{class:"inset",x:b[0]+o[0]-m,y:b[1]+o[1]-m,width:b[2]+m*2,height:b[3]+m*2,rx:6})); }
}

function trayCapacity(){
  const land=matchMedia("(min-aspect-ratio:5/4)").matches;
  const cs=getComputedStyle(tray);
  if(land){ const h=tray.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom)-60; return Math.max(2,Math.floor(h/124)*2); }
  const w=tray.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)-64;
  return Math.max(1,Math.floor(w/90));
}
function layoutTray(){
  if(!G) return;
  const n=trayCapacity();
  while(G.tray.length>n) G.queue.unshift(G.tray.pop());
  while(G.tray.length<n && G.queue.length) G.tray.push(G.queue.shift());
  renderTray();
}
function cardSvg(id){
  const b=P(id).b, m=Math.max(b[2],b[3])*.06+1;
  return `<svg viewBox="${b[0]-m} ${b[1]-m} ${b[2]+m*2} ${b[3]+m*2}" aria-hidden="true"><path d="${P(id).d}" fill="${colorOf(id)}" stroke="#fff" stroke-width="${Math.max(b[2],b[3])/60}"/></svg>`;
}
function renderTray(){
  tray.innerHTML="";
  for(const id of G.tray){
    const c=document.createElement("div"); c.className="card"; c.dataset.id=id;
    c.innerHTML=cardSvg(id)+`<div class="nm">${INFO[id-1][0]}</div><div class="kn">${INFO[id-1][1]}</div>`;
    c.addEventListener("pointerdown",e=>startDrag(e,id,c));
    tray.appendChild(c);
  }
  if(G.queue.length){
    const m=document.createElement("button"); m.id="more";
    m.innerHTML=`<b>↻</b>ほかの<br>ピース`; m.title=`ほかのピースにする（のこり ${G.queue.length}）`;
    m.onclick=()=>{ unlockAudio(); sPick(); G.queue.push(...G.tray); G.tray=[]; layoutTray(); };
    tray.appendChild(m);
  }
}

function startDrag(e,id,card){
  if(drag||!G) return;
  e.preventDefault(); unlockAudio(); sPick();
  if(!G.started) startTimer();
  G.lastId=id;
  const p=P(id), a=map.getScreenCTM().a, maxDim=Math.max(p.b[2],p.b[3]);
  const s=Math.max(a,30/maxDim);
  const lift=e.pointerType==="mouse"?0:Math.min(90,maxDim*s*.45+34);
  const g=el("g"); g.appendChild(el("path",{d:p.d,fill:colorOf(id)}));
  floatSvg.appendChild(g);
  const r=card.getBoundingClientRect();
  drag={id,card,g,s,lift,X:e.clientX,Y:e.clientY-lift,sx:e.clientX,sy:e.clientY,moved:false,pid:e.pointerId,home:[r.left+r.width/2,r.top+r.height/2]};
  card.classList.add("lifted");
  setFloat(drag.X,drag.Y,s);

  window.addEventListener("pointermove",onMove,{passive:false});
  window.addEventListener("pointerup",onUp);

}
function setFloat(X,Y,s){ const c=P(drag.id).c; drag.g.setAttribute("transform",`translate(${X} ${Y}) scale(${s}) translate(${-c[0]} ${-c[1]})`); }
function onMove(e){
  if(!drag||e.pointerId!==drag.pid) return;
  e.preventDefault();
  if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)>6) drag.moved=true;
  drag.X=e.clientX; drag.Y=e.clientY-drag.lift; setFloat(drag.X,drag.Y,drag.s);
}
function endListeners(){ window.removeEventListener("pointermove",onMove); window.removeEventListener("pointerup",onUp); window.removeEventListener("pointercancel",onCancel); }
function onCancel(){ if(!drag) return; endListeners(); returnHome(false); }
function onUp(e){
  if(!drag||e.pointerId!==drag.pid) return;
  endListeners();
  const id=drag.id;
  if(!drag.moved){ say(INFO[id-1][1]); returnHome(false); return; }
  const ctm=map.getScreenCTM(), a=ctm.a, p=P(id), o=offOf(id);
  const mx=(drag.X-ctm.e)/a, my=(drag.Y-ctm.f)/ctm.d;
  const tx=p.c[0]+o[0], ty=p.c[1]+o[1];
  const d=Math.hypot(mx-tx,my-ty)*a;
  const tol=Math.max(30,Math.min(72,.35*Math.max(p.b[2],p.b[3])*a));
  let near=null, nd=1e9;
  for(const j of G.ids){ if(G.placed.has(j)) continue; const q=P(j), qo=offOf(j); const dd=Math.hypot(mx-q.c[0]-qo[0],my-q.c[1]-qo[1]); if(dd<nd){ nd=dd; near=j; } }
  if(d<tol && (near===id || d<16)){
    const dr=drag;
    animateFloat(dr,tx*a+ctm.e,ty*ctm.d+ctm.f,a,200,()=>{ dr.g.remove(); drag=null; place(id); });
  } else {
    G.errors++; G.miss[id]=(G.miss[id]||0)+1; sMiss();
    if(G.miss[id]>=2) blinkSlot(id);
    returnHome(true);
  }
}
function animateFloat(dr,X,Y,s,ms,done){
  const X0=dr.X,Y0=dr.Y,s0=dr.s,t0=performance.now();
  const reduce=matchMedia("(prefers-reduced-motion:reduce)").matches;
  (function step(t){
    let k=reduce?1:Math.min(1,(t-t0)/ms); k=1-Math.pow(1-k,3);
    const c=P(dr.id).c;
    dr.g.setAttribute("transform",`translate(${X0+(X-X0)*k} ${Y0+(Y-Y0)*k}) scale(${s0+(s-s0)*k}) translate(${-c[0]} ${-c[1]})`);
    if(k<1) requestAnimationFrame(step); else done();
  })(t0);
}
function returnHome(wobble){
  const dr=drag; if(!dr) return;
  animateFloat(dr,dr.home[0],dr.home[1],Math.min(dr.s,40/Math.max(P(dr.id).b[2],P(dr.id).b[3])),220,()=>{
    dr.g.remove(); dr.card.classList.remove("lifted");
    if(wobble){ dr.card.classList.remove("wobble"); void dr.card.offsetWidth; dr.card.classList.add("wobble"); }
    if(drag===dr) drag=null;
  });
}
function blinkSlot(id){
  const s=$("#slot"+id); if(!s) return;
  s.classList.remove("blink"); void s.getBBox(); s.classList.add("blink");
  setTimeout(()=>s.classList.remove("blink"),2600);
}

function place(id){
  G.placed.add(id);
  G.tray=G.tray.filter(x=>x!==id); G.queue=G.queue.filter(x=>x!==id);
  const o=offOf(id), g=el("g",{transform:`translate(${o[0]} ${o[1]})`});
  const path=el("path",{d:P(id).d,class:"placed pop",fill:colorOf(id)});
  path.addEventListener("click",()=>showBubble(id));
  g.appendChild(path); $("#placedG").appendChild(g);
  $("#slot"+id)?.classList.remove("blink");
  sOk(); say(INFO[id-1][1]); showBubble(id);
  if(navigator.vibrate) try{ navigator.vibrate(30); }catch(_){}
  updateCount(); layoutTray();
  if(G.placed.size===G.ids.length) setTimeout(finish,700);
}

let bubbleT=null;
function showBubble(id){
  const b=$("#bubble"), ctm=map.getScreenCTM(), p=P(id), o=offOf(id), inf=INFO[id-1];
  b.innerHTML=`<div class="em">${inf[2]}</div><div class="nm">${inf[0]}</div><div class="kn">${inf[1]}</div><div class="mb">${inf[3]}</div>`;
  let x=(p.c[0]+o[0])*ctm.a+ctm.e, y=(p.b[1]+o[1])*ctm.d+ctm.f;
  x=Math.max(90,Math.min(innerWidth-90,x)); y=Math.max(150,y);
  b.style.left=x+"px"; b.style.top=y+"px"; b.style.opacity=1; b.hidden=false;
  clearTimeout(bubbleT); bubbleT=setTimeout(()=>{ b.style.opacity=0; bubbleT=setTimeout(()=>b.hidden=true,300); },1800);
}

/* ---------- ヒント・もどる ---------- */
$("#hintBtn").onclick=()=>{
  if(!G) return; unlockAudio();
  const id=G.tray.includes(G.lastId)?G.lastId:G.tray[0]; if(!id) return;
  G.errors++; blinkSlot(id);
  const c=tray.querySelector(`.card[data-id="${id}"]`); if(c){ c.classList.remove("wobble"); void c.offsetWidth; c.classList.add("wobble"); }
  say(INFO[id-1][1]+"は ひかっている ところ だよ");
};
let backArmed=0;
$("#back").onclick=()=>{
  if(G && G.placed.size>0 && G.placed.size<G.ids.length && Date.now()-backArmed>2500){
    backArmed=Date.now(); $("#back").textContent="もういちど おしてね";
    setTimeout(()=>$("#back").textContent="← もどる",2500); return;
  }
  goHome();
};
function goHome(){ clearInterval(timerId); G=null; tray.innerHTML=""; renderHome(); $("#clear").hidden=true; $("#home").hidden=false; $("#back").textContent="← もどる"; }

/* ---------- クリア ---------- */
function finish(){
  clearInterval(timerId);
  const n=G.ids.length, e=G.errors;
  const st=e<=Math.floor(n/7)?3:e<=Math.ceil(n/3)?2:1;
  const k=G.mode.k, prev=best[k]||{};
  const newBest=!prev.t||G.sec<prev.t;
  best[k]={t:newBest?G.sec:prev.t,st:Math.max(st,prev.st||0)}; store.set("todofuken-best",best);
  $("#cTitle").textContent=k==="all"?"にっぽん かんせい！":"できた！";
  $("#cStars").innerHTML="★".repeat(st)+"<i>"+"★".repeat(3-st)+"</i>";
  $("#cTime").textContent=`じかん ${fmt(G.sec)}　まちがい ${e}かい`;
  $("#cBest").textContent=newBest&&prev.t?"じこベスト こうしん！":"";
  $("#clear").hidden=false; sClear(); say(k==="all"?"にっぽん かんせい！ すごいね！":"ぜんぶ できたね！"); confetti();
}
$("#cAgain").onclick=()=>startGame(G.mode.k);
$("#cHome").onclick=goHome;

function confetti(){
  const cv=$("#confetti"), cx=cv.getContext("2d"), dpr=devicePixelRatio||1;
  if(matchMedia("(prefers-reduced-motion:reduce)").matches) return;
  cv.width=innerWidth*dpr; cv.height=innerHeight*dpr; cx.scale(dpr,dpr);
  const cols=Object.values(COLORS).concat(["#ff7a59"]);
  const ps=Array.from({length:120},()=>({x:Math.random()*innerWidth,y:-20-Math.random()*innerHeight*.5,vx:(Math.random()-.5)*2,vy:2+Math.random()*3,r:Math.random()*6,w:6+Math.random()*6,c:cols[Math.random()*cols.length|0]}));
  const t0=performance.now();
  (function f(t){
    cx.clearRect(0,0,innerWidth,innerHeight);
    for(const p of ps){ p.x+=p.vx; p.y+=p.vy; p.r+=.1; cx.save(); cx.translate(p.x,p.y); cx.rotate(p.r); cx.fillStyle=p.c; cx.fillRect(-p.w/2,-3,p.w,6); cx.restore(); }
    if(t-t0<3200) requestAnimationFrame(f); else cx.clearRect(0,0,innerWidth,innerHeight);
  })(t0);
}

/* ---------- ホーム ---------- */
function renderHome(){
  const hero=$("#hero"); hero.innerHTML="";
  for(const s of SHAPES){
    const p=el("path",{d:s.d,fill:COLORS[groupOf(s.id)]});
    const t=el("title"); t.textContent=INFO[s.id-1][0]; p.appendChild(t);
    p.addEventListener("click",()=>{ unlockAudio(); startGame(modeOfId(s.id)); });
    hero.appendChild(p);
  }
  const b=P(47).b; hero.appendChild(el("rect",{class:"inset",x:b[0]-9,y:b[1]-9,width:b[2]+18,height:b[3]+18,rx:6}));
  const box=$("#modes"); box.innerHTML="";
  for(const m of MODES){
    const r=best[m.k], btn=document.createElement("button");
    btn.className="mode"+(m.k==="all"?" big":"");
    btn.innerHTML=`${m.k==="all"?"":`<span class="sw" style="background:${m.color}"></span>`}<span class="mn">${m.name}</span><span class="mk">${m.kana}・${m.ids.length}まい</span><span class="mr">${r?`⏱ ${fmt(r.t)}　${"★".repeat(r.st)}`:"まだ あそんでいない"}</span>`;
    btn.onclick=()=>{ unlockAudio(); startGame(m.k); };
    box.appendChild(btn);
  }
}
for(const k of ["border","names","voice","sound"]){
  const b=$("#o-"+k); b.setAttribute("aria-pressed",opt[k]);
  b.onclick=()=>{ opt[k]=!opt[k]; b.setAttribute("aria-pressed",opt[k]); store.set("todofuken-opt",opt); unlockAudio(); if(k==="sound"&&opt.sound) sOk(); };
}
addEventListener("resize",()=>{ if(G&&!drag) layoutTray(); });
document.addEventListener("gesturestart",e=>e.preventDefault());
renderHome();
</script>
