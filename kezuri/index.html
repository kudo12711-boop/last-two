<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#e8f3ff">
<title>けずって なにかな？</title>
<style>
:root{
  --bg:#eaf4ff; --ink:#33405a; --card:#ffffff; --accent:#ff7a59; --ok:#2fbf71; --soft:#dceaff;
  --line:#c9dcf5; --shadow:0 4px 0 rgba(40,70,120,.16);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Kosugi Maru","Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.screen.on{display:flex}

/* タイトル */
#title{align-items:center;gap:14px;overflow:auto;padding-top:calc(env(safe-area-inset-top) + 20px);padding-bottom:24px}
#title h1{margin:0;font-size:clamp(32px,9vw,54px);letter-spacing:.03em;text-align:center;line-height:1.2}
#title h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
#title h1 span:nth-child(2n){animation-delay:.3s;color:var(--accent)}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{margin:-6px 0 0;font-size:16px;opacity:.75;text-align:center}
#demo{width:min(240px,60vw);aspect-ratio:1;border-radius:26px;box-shadow:var(--shadow);touch-action:none;flex:none;background:#fff}
.big{display:flex;align-items:center;gap:14px;width:min(420px,100%);padding:16px 20px;border-radius:24px;background:var(--card);
  box-shadow:var(--shadow);font-size:22px;font-weight:700;text-align:left;flex:none}
.big .ico{font-size:36px;line-height:1}
.big small{display:block;font-size:13px;font-weight:400;opacity:.7}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(40,70,120,.16)}
.big.go{background:var(--accent);color:#fff;justify-content:center;font-size:26px}
.box{width:min(420px,100%);background:var(--card);border-radius:20px;padding:10px 12px;box-shadow:var(--shadow);flex:none}
.box b{font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.row button{padding:8px 10px;border-radius:14px;background:var(--soft);font-weight:700;line-height:1.2;min-width:62px;font-size:15px}
.row button small{display:block;font-size:11px;font-weight:400;opacity:.8}
.row button.sel{background:var(--accent);color:#fff}
#fats button{display:flex;flex-direction:column;align-items:center;gap:4px;flex:1;min-width:0}
#fats button i{display:block;border-radius:50%;background:currentColor;opacity:.75}
.foot{display:flex;gap:10px;font-size:14px;flex-wrap:wrap;justify-content:center}
.foot button{background:none;text-decoration:underline;opacity:.7;padding:6px}

/* ゲーム */
#game{padding-left:8px;padding-right:8px}
.bar{display:flex;align-items:center;gap:8px;height:62px;flex:none}
.round{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:grid;place-items:center;flex:none;position:relative}
.round:active{transform:translateY(3px);box-shadow:none}
.round i{position:absolute;right:-4px;top:-4px;min-width:20px;height:20px;border-radius:10px;background:var(--accent);color:#fff;font-size:12px;font-style:normal;font-weight:900;display:grid;place-items:center;padding:0 4px}
#prog{flex:1;text-align:center;font-size:18px;font-weight:900;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#board{flex:1;position:relative;min-height:0}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#under{flex:none;min-height:118px;display:flex;align-items:center;justify-content:center;padding:6px 0 10px}
#msg{font-size:20px;font-weight:700;opacity:.7;text-align:center;animation:bob 2.4s ease-in-out infinite}
#choices{display:none;gap:8px;width:min(560px,100%);justify-content:center}
#choices.on{display:flex}
#choices button{flex:1;max-width:140px;min-height:98px;border-radius:22px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 4px;animation:popIn .4s cubic-bezier(.3,1.6,.5,1) backwards}
#choices button:nth-child(2){animation-delay:.08s}#choices button:nth-child(3){animation-delay:.16s}#choices button:nth-child(4){animation-delay:.24s}
#choices button .e{font-size:46px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#choices button img{width:56px;height:56px;border-radius:12px;object-fit:cover}
#choices button span{font-size:14px;font-weight:700;line-height:1.2;word-break:keep-all}
#choices button.no{opacity:.25;animation:shake .4s;pointer-events:none}
#choices button.yes{background:#d8f5e3;transform:scale(1.08)}
#choices button:active{transform:translateY(3px);box-shadow:none}
@keyframes popIn{from{transform:scale(.3);opacity:0}}
@keyframes shake{25%{transform:translateX(-8px)}50%{transform:translateX(8px)}75%{transform:translateX(-5px)}}
#nextB{display:none;font-size:24px;padding:16px 36px;border-radius:24px;background:var(--accent);color:#fff;font-weight:900;box-shadow:var(--shadow);animation:popIn .4s cubic-bezier(.3,1.6,.5,1)}
#nextB.on{display:block}
#say{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(34px,10vw,66px);font-weight:900;color:#fff;
  -webkit-text-stroke:3px var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.12);pointer-events:none;opacity:0;white-space:nowrap;z-index:5}
#say.on{animation:sayA 1.6s ease-out forwards}
@keyframes sayA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

/* ずかん */
#book{gap:8px;padding-bottom:12px}
#book .bar b{flex:1;text-align:center;font-size:20px}
#bookTabs{display:flex;gap:6px;overflow-x:auto;flex:none;padding-bottom:4px}
#bookTabs button{flex:none;padding:8px 12px;border-radius:14px;background:var(--card);font-weight:700;font-size:15px;box-shadow:var(--shadow);white-space:nowrap}
#bookTabs button.sel{background:var(--accent);color:#fff}
#bookTabs button.full::after{content:' 👑'}
#bookGrid{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:10px;align-content:start;padding:4px 2px 20px}
#bookGrid button{position:relative;aspect-ratio:1;border-radius:20px;background:var(--card);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px}
#bookGrid button .e{font-size:44px;line-height:1.1;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
#bookGrid button img{width:60px;height:60px;border-radius:12px;object-fit:cover}
#bookGrid button.yet{background:#f2f6fb;box-shadow:none}
#bookGrid button.yet .e{filter:brightness(0);opacity:.13}
#bookGrid button span{font-size:12px;font-weight:700;line-height:1.2}
#bookGrid button i{position:absolute;right:6px;top:4px;font-size:11px;font-style:normal;font-weight:700;opacity:.6}
#bookGrid button.shiny{background:linear-gradient(135deg,#fff6c9,#ffe07a)}
#bookGrid button.shiny::before{content:'✨';position:absolute;left:5px;top:3px;font-size:14px}
#bookGrid button.hop{animation:jump .6s}
@keyframes jump{40%{transform:translateY(-12px) scale(1.08)}}
#bookSum{flex:none;text-align:center;font-size:14px;opacity:.75}

/* モーダル */
.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:30;padding:16px}
.modal.on{display:flex}
.panel{background:var(--card);border-radius:28px;padding:16px;width:min(440px,100%);box-shadow:0 8px 0 rgba(40,70,120,.16);animation:panelIn .45s cubic-bezier(.3,1.5,.5,1);font-size:15px;line-height:1.7;max-height:calc(100dvh - 32px);overflow:auto}
@keyframes panelIn{from{transform:translateY(60%) scale(.8);opacity:0}}
.panel h2{margin:0;font-size:22px;color:var(--accent)}
.panel h3{margin:14px 0 4px;font-size:17px}
.note{font-size:13px;opacity:.75;line-height:1.6;margin:4px 0 8px}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.opt button{padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px}
.opt button.sel{background:var(--accent);color:#fff}
.panel .big{width:100%;justify-content:center;margin-top:12px;font-size:18px;padding:12px}
#phList{display:flex;flex-direction:column;gap:8px;margin-top:8px}
.ph{display:flex;align-items:center;gap:8px;background:#f4f8fd;border-radius:16px;padding:6px}
.ph img{width:58px;height:58px;border-radius:12px;object-fit:cover;flex:none}
.ph input{flex:1;min-width:0;font:inherit;font-size:16px;padding:8px;border-radius:10px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.ph button{width:40px;height:40px;border-radius:50%;background:#fff;font-size:18px;flex:none;box-shadow:var(--shadow)}
.ph button.rec{background:#ff5a5a;color:#fff;animation:blink .8s infinite}
.ph button.has{background:#d8f5e3}
@keyframes blink{50%{opacity:.55}}
</style>
</head>
<body>

<div id="title" class="screen on">
  <h1 id="tTitle"></h1>
  <p class="sub" id="tSub"></p>
  <canvas id="demo"></canvas>
  <button class="big go" id="goB"></button>
  <div class="box"><b id="tCats"></b><div class="row" id="cats"></div></div>
  <div class="box"><b id="tLv"></b><div class="row" id="lvs"></div></div>
  <div class="box"><b id="tFat"></b><div class="row" id="fats"></div></div>

  <button class="big" id="photoB"><span class="ico">📷</span><span><span id="tPhotos"></span><small id="tPhotosSub"></small></span></button>
  <div class="foot"><button id="setB"></button><button id="langB">English</button></div>
</div>

<div id="game" class="screen">

    <div id="choices"></div>
    <button id="nextB"></button>
  </div>
</div>

<div id="book" class="screen">
  <div class="bar">
    <button class="round" id="bookBack" aria-label="back">◀</button>
    <b id="tBook2"></b>
    <span style="width:50px"></span>
  </div>
  <div id="bookTabs"></div>
  <div id="bookGrid"></div>
  <div id="bookSum"></div>
</div>

<div class="modal" id="photoM"><div class="panel">
  <h2 id="tPh"></h2>
  <p class="note" id="tPhNote"></p>
  <button class="big" id="phAdd"><span class="ico">➕</span><span id="tPhAdd"></span></button>

  <div id="phList"></div>
  <button class="big go" id="phClose"></button>
</div></div>

<div class="modal" id="setM"><div class="panel">
  <h2 id="tSet"></h2>
  <h3 id="tVoice"></h3><div class="opt" id="voiceOpt"></div>
  <h3 id="tSound"></h3><div class="opt" id="soundOpt"></div>
  <h3>Language / ことば</h3><div class="opt" id="langOpt"></div>
  <h3 id="tKk"></h3><p class="note" id="tKkNote"></p><div id="kkSlot"></div>
  <h3 id="tReset"></h3><p class="note" id="tResetNote"></p>
  <div class="opt"><button id="resetB"></button></div>
  <button class="big go" id="setClose"></button>
</div></div>

<div id="say"></div>
<canvas id="fx"></canvas>

<script src="../common/kakin.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const ease = t => t < 0 ? 0 : t > 1 ? 1 : t * t * (3 - 2 * t);
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },

function pickLang() {
  const q = new URLSearchParams(location.search).get('lang');
  if (q && TEXT[q]) return q;
  const s = store.get('kezuri-lang', null); if (s && TEXT[s]) return s;
  try { const gl = localStorage.getItem('games-lang'); if (gl && TEXT[gl]) return gl; } catch (e) {} // 入口ページで えらんだ ことば
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ja').slice(0, 2);
  return TEXT[nav] ? nav : 'en';
}

let soundOn = store.get('kezuri-sound', true);
let actx = null;
function audio() {
  if (!soundOn) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, type = 'sine', vol = .25, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const sfx = {
  tap() { tone(880, 0, .06, 'sine', .08); },
  wrong() { tone(300, 0, .16, 'sine', .14, 220); tone(240, .15, .2, 'sine', .12, 180); },
  quiz() { [659, 784, 988].forEach((f, i) => tone(f, i * .08, .15, 'triangle', .12)); },
  reveal() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .09, i === 6 ? .6 : .14, 'square', .07)); },
  shiny() { [1568, 2093, 2637, 3136, 2637, 3136, 3520].forEach((f, i) => tone(f, .7 + i * .07, .35, 'sine', .08)); },
  comp() { [523, 659, 784, 1047, 1319, 1568].forEach((f, i) => tone(f, i * .12, .5, 'triangle', .1)); }
};

let scr = null;
function scratchSound(level) {
  const a = audio(); if (!a) return;
  if (!scr) {
    const n = a.sampleRate * 2, b = a.createBuffer(1, n, a.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (.6 + .4 * Math.sin(i / 90));
    const s = a.createBufferSource(), f = a.createBiquadFilter(), g = a.createGain();
    s.buffer = b; s.loop = true; f.type = 'bandpass'; f.frequency.value = 3200; f.Q.value = .9; g.gain.value = 0;
    s.connect(f).connect(g).connect(a.destination); s.start();
    scr = { g, f };
  }
  const t = a.currentTime;
  scr.g.gain.cancelScheduledValues(t);
  scr.g.gain.setTargetAtTime(level * .22, t, .03);
  scr.f.frequency.setTargetAtTime(2400 + level * 2400, t, .05);
}

const AI_VOICES = ['jf_alpha', 'jf_gongitsune', 'jf_nezumi', 'jf_tebukuro']; // 日本語だけ
const aiBuf = {}; let aiSrc = null;
function aiLoad(id, keys) {
  const a = audio(); if (!a) return;
  for (const key of keys) {
    const k = `${id}/${key}`;
    if (aiBuf[k]) continue;
    aiBuf[k] = 'loading';
    fetch(`voice/${k}.mp3?v=1`).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => a.decodeAudioData(b, res, rej)))
      .then(buf => { aiBuf[k] = buf; }).catch(() => { aiBuf[k] = 'none'; });
  }
}
let devVoices = [];
function voiceScore(v) {
  const n = v.name; let s = 0;
  if (/拡張|Enhanced|Premium|プレミアム/i.test(n)) s += 50;
  if (/Natural|Neural|Online/i.test(n)) s += 45;
  if (/Google/i.test(n)) s += 30;
  if (/Kyoko|O-ren|Nanami|Samantha|Karen|Jenny|Aria/i.test(n)) s += 10;
  if (/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad|Bells|Bubbles|Jester|Whisper|Zarvox|Albert|Trinoids|Organ|Cellos|Boing|Wobble|Superstar/i.test(n)) s -= 60;
  return s;
}
function loadVoices() { try { devVoices = speechSynthesis.getVoices(); } catch (e) {} }
if ('speechSynthesis' in window) { loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function tts(text, onend) {
  if (!('speechSynthesis' in window)) { if (onend) setTimeout(onend, 700); return; }
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text), code = L === 'ja' ? 'ja-JP' : 'en-US';
    const vs = devVoices.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(L)).sort((a, b) => voiceScore(b) - voiceScore(a));
    u.lang = code; u.pitch = 1.15; u.rate = L === 'ja' ? .95 : .9; if (vs[0]) u.voice = vs[0];
    if (onend) { let done = false; const f = () => { if (!done) { done = true; onend(); } }; u.onend = f; setTimeout(f, 2600); }
    speechSynthesis.speak(u);
  } catch (e) {}
}

let voiceMode = store.get('kezuri-voice', 'ai:jf_alpha');
const useAI = () => L === 'ja' && voiceMode.startsWith('ai:');
function playBuf(b, off = 0, dur) {
  const a = audio(); if (!a) return;
  try { if (aiSrc) aiSrc.stop(); } catch (e) {}
  try { speechSynthesis.cancel(); } catch (e) {}
  const src = a.createBufferSource(); src.buffer = b; src.connect(a.destination); src.start(0, off, dur || b.duration); aiSrc = src;
}
let speakTok = 0;
// key: 'ok0' など、または 'it_dog'（なまえ）。しゃべりおわったら onend
function say(key, onend) {
  const tok = ++speakTok, fin = () => { if (onend && tok === speakTok) onend(); };
  if (!soundOn || voiceMode === 'off') { if (onend) setTimeout(fin, 350); return; }
  let text, ph = null;
  if (key.startsWith('it_')) {
    const id = key.slice(3); ph = photos.find(p => p.id === id);
    if (ph) {
      if (ph.recBuf && audio()) { playBuf(ph.recBuf.buf, ph.recBuf.off, ph.recBuf.dur); if (onend) setTimeout(fin, ph.recBuf.dur * 1000 + 150); return; }
      text = ph.name;
    } else text = ITEM_BY[id] ? nameOf(ITEM_BY[id]) : '';
  } else text = T().say[key] || '';
  if (useAI() && !ph) {
    const id = voiceMode.slice(3), a = audio();
    if (a) {
      aiLoad(id, [key]);
      const b = aiBuf[`${id}/${key}`];
      if (b && typeof b !== 'string') { playBuf(b); if (onend) setTimeout(fin, b.duration * 1000 + 150); return; }
    }
  }
  tts(text, onend ? fin : null);
}

let photos = []; // { id:'p…', name, blob, rec, url, img, recBuf }
const pdb = {
  open() { return new Promise((res, rej) => { const r = indexedDB.open('kezuri', 1); r.onupgradeneeded = () => r.result.createObjectStore('photo'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async run(mode, fn) { const db = await this.open(); return new Promise((res, rej) => { const t = db.transaction('photo', mode), st = t.objectStore('photo'); fn(st); t.oncomplete = () => res(); t.onerror = () => rej(t.error); }); },
  put(k, v) { return this.run('readwrite', st => st.put(v, k)); },
  del(k) { return this.run('readwrite', st => st.delete(k)); },
  async all() { const out = []; await this.run('readonly', st => { const c = st.openCursor(); c.onsuccess = () => { const cur = c.result; if (cur) { out.push(Object.assign({ id: cur.key }, cur.value)); cur.continue(); } }; }); return out; }
};
function photoSave(p) { return pdb.put(p.id, { name: p.name, blob: p.blob, rec: p.rec || null, t: p.t }).catch(() => {}); }
function photoReady(p) {
  p.url = URL.createObjectURL(p.blob);
  p.img = new Image(); p.img.src = p.url;
  p.photo = true; p.cat = 'home'; p.e = '';
  if (p.rec) decodeRec(p);
  return p;
}
function decodeRec(p) {
  const a = audio() || (window.OfflineAudioContext ? new OfflineAudioContext(1, 1, 44100) : null);
  if (!a || !p.rec) return;
  const blob = p.rec;
  blob.arrayBuffer().then(ab => new Promise((res, rej) => a.decodeAudioData(ab, res, rej))).then(buf => {
    const d = buf.getChannelData(0); let pk = 0; for (let i = 0; i < d.length; i++) pk = Math.max(pk, Math.abs(d[i]));
    const th = Math.max(.02, pk * .12); let i0 = 0, i1 = d.length - 1;
    while (i0 < d.length && Math.abs(d[i0]) < th) i0++;
    while (i1 > i0 && Math.abs(d[i1]) < th) i1--;
    const off = Math.max(0, i0 / buf.sampleRate - .04), end = Math.min(buf.duration, i1 / buf.sampleRate + .12);
    if (p.rec === blob) p.recBuf = { buf, off, dur: Math.max(.1, end - off) };
  }).catch(() => {});
}

document.addEventListener('pointerdown', () => { if (audio()) photos.forEach(p => { if (p.rec && !p.recBuf) decodeRec(p); }); }, { passive: true, once: true });

function shrinkPhoto(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const M = 900, r = Math.min(1, M / Math.max(im.naturalWidth, im.naturalHeight));
      const c = document.createElement('canvas'); c.width = Math.round(im.naturalWidth * r); c.height = Math.round(im.naturalHeight * r);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); URL.revokeObjectURL(url);
      c.toBlob(b => b ? res(b) : rej(), 'image/jpeg', .85);
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(); };
    im.src = url;
  });
}

$('#phFile').onchange = async e => {

function renderPhotos() {

  for (const p of photos) {

async function recordFor(p, btn) {
  if (recState) { recState.stop(); return; }
  audio();
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = () => {
      stream.getTracks().forEach(t => t.stop()); recState = null; btn.classList.remove('rec');

    };
    mr.start(); btn.classList.add('rec');

    setTimeout(() => { if (recState) recState.stop(); }, 3000);
  } catch (e) { alert(L === 'ja' ? 'マイクが つかえませんでした' : 'Could not use the microphone'); }

  const list = bookTab === 'home' ? photos : ITEMS.filter(i => i.cat === bookTab);
  for (const it of list) {
    const r = book[it.id], b = document.createElement('button');
    if (!r) b.className = 'yet';
    else if (r.s) b.className = 'shiny';
    b.innerHTML = it.photo ? (r ? '<img alt=""><span></span>' : '<div class="e">❓</div><span>？</span>') : `<div class="e">${it.e}</div><span></span>`;
    if (it.photo && r) b.querySelector('img').src = it.url;
    if (r) { b.querySelector('span').textContent = nameOf(it); if (r.n > 1) b.insertAdjacentHTML('beforeend', `<i>×${r.n}</i>`); }
    else if (!it.photo) b.querySelector('span').textContent = '？';
    b.onclick = () => {
      if (!r) { sfx.tap(); return; }
      b.classList.remove('hop'); void b.offsetWidth; b.classList.add('hop'); say('it_' + it.id);
    };
    grid.appendChild(b);
  }
  prepVoice(list.filter(i => !i.photo).map(i => 'it_' + i.id));
  const all = ITEMS.length + photos.length, got = ITEMS.filter(i => book[i.id]).length + photos.filter(p => book[p.id]).length;
  $('#bookSum').textContent = t.bookSum(got, all);
}
$('#bookBack').onclick = () => { if (bookFrom === 'game' && st) { show('game'); requestAnimationFrame(layout); } else { renderTitle(); show('title'); } };

/* ---------- くす玉 ---------- */
const fx = $('#fx'), fg = fx.getContext('2d');
function confetti(gold) {
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  fx.width = innerWidth * dpr; fx.height = innerHeight * dpr;
  const cols = gold ? ['#ffd700', '#fff1a8', '#ffb300', '#ffffff'] : ['#ff7a59', '#ffd23f', '#5aa9ff', '#7bc96f', '#c58cff', '#ff6f91'];
  const ps = Array.from({ length: 90 }, () => ({ x: innerWidth / 2 + rnd(-40, 40), y: innerHeight * .4, vx: rnd(-320, 320), vy: rnd(-620, -200), r: rnd(0, 7), vr: rnd(-8, 8), c: pick(cols), s: rnd(6, 11) }));
  let t0 = performance.now(), last = t0;
  (function f(now) {
    const dt = Math.min(.04, (now - last) / 1000); last = now;
    fg.setTransform(dpr, 0, 0, dpr, 0, 0); fg.clearRect(0, 0, innerWidth, innerHeight);
    for (const p of ps) { p.vy += 900 * dt; p.vx *= .99; p.x += p.vx * dt; p.y += p.vy * dt; p.r += p.vr * dt; fg.save(); fg.translate(p.x, p.y); fg.rotate(p.r); fg.fillStyle = p.c; fg.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); fg.restore(); }
    if (now - t0 < 2200) requestAnimationFrame(f); else fg.clearRect(0, 0, innerWidth, innerHeight);
  })(t0);
}
function showSay(t) { const s = $('#say'); s.textContent = t; s.classList.remove('on'); void s.offsetWidth; s.classList.add('on'); }

renderTitle();
requestAnimationFrame(frame);
</script>
