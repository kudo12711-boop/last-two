<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#bfe9ff">
<title>ふしぎな いきもの ずかん</title>
<style>
:root{--ink:#3b2f4a;--sub:#7b6d88;--card:#fffdf8;--line:#eadff0;--pink:#ff7aa8;--blue:#5fb8ff;--shadow:0 6px 18px rgba(60,30,80,.18)}
html,body{margin:0;height:100%;overflow:hidden;background:#bfe9ff;color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","BIZ UDPGothic","Rounded Mplus 1c","Noto Sans JP",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block}
#ui{position:fixed;inset:0;pointer-events:none}
.scr{position:absolute;inset:0;display:none}
.scr.on{display:block}
button{font:inherit;color:inherit}
.btn{pointer-events:auto;border:0;border-radius:999px;background:#fff;color:var(--ink);font-weight:700;font-size:16px;
  padding:10px 16px;box-shadow:var(--shadow);cursor:pointer;line-height:1.2}
.btn:active{transform:scale(.95)}
.btn.pink{background:var(--pink);color:#fff}
.btn.blue{background:var(--blue);color:#fff}
.btn[disabled]{opacity:.5}
.pill{display:inline-block;background:rgba(255,255,255,.88);border-radius:999px;padding:7px 14px;font-weight:700;box-shadow:var(--shadow);font-size:15px}
.top{position:absolute;left:0;right:0;top:0;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:calc(10px + env(safe-area-inset-top)) 12px 0}
.hint{position:absolute;left:12px;right:12px;text-align:center;bottom:calc(18px + env(safe-area-inset-bottom));transition:opacity .6s}
.hint .pill{max-width:520px;line-height:1.5}

/* タイトル */
#title{overflow-y:auto;pointer-events:auto;touch-action:pan-y}
#title .wrap{max-width:560px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 16px calc(32vh + 20px)}
#title h1{margin:4px 0 2px;text-align:center;font-size:clamp(26px,7.4vw,40px);letter-spacing:.04em;color:#fff;
  text-shadow:0 3px 0 #e2609a,0 0 3px #e2609a,2px 2px 0 #e2609a,-2px 2px 0 #e2609a,2px -1px 0 #e2609a,-2px -1px 0 #e2609a}
#title .sub{text-align:center;font-weight:700;margin:6px 0 14px;color:#3b4a6a}
.habs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.hab{position:relative;border:0;border-radius:18px;padding:12px 6px 10px;box-shadow:var(--shadow);cursor:pointer;font-weight:700;font-size:15px;color:#3b2f4a}
.hab .ic{display:block;font-size:30px;line-height:1.1;margin-bottom:4px}
.hab:active{transform:scale(.96)}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.row .btn{font-size:18px;padding:12px 20px}
.mini{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;align-items:center}
.mini .btn{font-size:14px;padding:8px 12px}
.note{font-size:13px;text-align:center;color:#3b4a6a;margin-top:8px;font-weight:700}

/* さがす */
.arrows{position:absolute;left:0;right:0;bottom:calc(120px + env(safe-area-inset-bottom));display:flex;justify-content:space-between;padding:0 10px}
.arrows .btn{font-size:22px;width:52px;height:52px;padding:0;opacity:.85}

/* なかよく */
.tray{position:absolute;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));display:flex;gap:6px;
  background:rgba(255,255,255,.92);border-radius:22px;padding:8px;box-shadow:var(--shadow);pointer-events:auto}
.tray button{border:0;background:#fff4e2;border-radius:14px;width:48px;height:48px;font-size:28px;padding:0;cursor:pointer}
.tray button:active{transform:scale(.9)}
#meet .hint{bottom:calc(84px + env(safe-area-inset-bottom))}

/* もーだる */
.modal{position:absolute;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,20,60,.35);pointer-events:auto;padding:16px;box-sizing:border-box}
.modal.on{display:flex}
.card{background:var(--card);border-radius:24px;box-shadow:0 10px 30px rgba(40,20,60,.3);padding:18px;max-width:420px;width:100%;box-sizing:border-box;text-align:center;max-height:100%;overflow-y:auto;touch-action:pan-y}
.card h2{margin:2px 0 6px;font-size:22px}
.card .nm{font-size:22px;font-weight:800;margin:4px 0}
.card .meta{font-size:14px;color:var(--sub);line-height:1.6}
.card .news{margin:8px 0;font-weight:700;color:#e2609a;line-height:1.6}
.card .btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:8px}
.chip{font-size:12px;background:#f3ecf7;border-radius:999px;padding:4px 9px;font-weight:700}
.chip.rare{background:#fff0b8}
.chip.no{color:#b9adc4;background:#f6f2f8}

/* ずかん */
#book .panel,#picker .panel{position:absolute;inset:0;background:#fffaf2;pointer-events:auto;display:flex;flex-direction:column}
.phead{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top)) 12px 8px}
.phead h2{flex:1;margin:0;font-size:20px}
.tabs{display:flex;gap:6px;padding:0 12px 8px}
.tabs button{flex:1;border:0;border-radius:999px;padding:9px;font-weight:700;background:#f1e8f5;cursor:pointer}
.tabs button.on{background:var(--pink);color:#fff}
.pbody{flex:1;overflow-y:auto;padding:4px 12px calc(20px + env(safe-area-inset-bottom));touch-action:pan-y}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.cell{background:#fff;border-radius:16px;box-shadow:0 3px 10px rgba(60,30,80,.1);border:0;padding:4px 4px 6px;cursor:pointer;position:relative}
.cell canvas{display:block;margin:0 auto}
.cell .n{font-size:11px;color:var(--sub)}
.cell .t{font-size:13px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cell .b{position:absolute;top:4px;right:6px;font-size:13px}
.cell.sel{outline:3px solid var(--pink)}
.cell[disabled]{opacity:.35}
.empty{text-align:center;color:var(--sub);font-weight:700;padding:40px 10px;line-height:1.7}
.prow{margin:10px 0 14px}
.prow h3{margin:0 0 4px;font-size:15px}
.prow .chips{justify-content:flex-start}
.ptotal{font-weight:800;text-align:center;margin:4px 0 2px}
.bar{height:10px;background:#f1e8f5;border-radius:999px;overflow:hidden;margin:0 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#ff9ac0,#ffc56b)}
#rename{display:none;gap:6px;justify-content:center;margin-top:6px}
#rename input{font:inherit;font-size:16px;border:2px solid var(--line);border-radius:12px;padding:6px 10px;width:150px;-webkit-user-select:text;user-select:text}

/* たまご */
.slot{position:absolute;bottom:calc(16px + env(safe-area-inset-bottom));pointer-events:auto}
#slotA{left:12px}#slotB{right:12px}
#breed .hint{bottom:calc(76px + env(safe-area-inset-bottom))}
</style>
</head>
<body>
<canvas id="cv"></canvas>
<div id="ui">
  <div class="scr on" id="title"><div class="wrap">
    <h1 id="tTitle"></h1>
    <div class="sub" id="tSub"></div>
    <div class="habs" id="habs"></div>
    <div class="row">
      <button class="btn pink" id="tBook"></button>
      <button class="btn blue" id="tEgg"></button>
    </div>
    <div class="note" id="tEggNote"></div>
    <div class="mini">
      <button class="btn" id="tLang"></button>
      <button class="btn" id="tSnd"></button>
      <span id="kkSlot"></span>
    </div>
  </div></div>

  <div class="scr" id="explore">
    <div class="top">
      <button class="btn" data-home>🏠</button>
      <span class="pill" id="eHab"></span>
      <button class="btn" data-book>📖 <span class="cnt"></span></button>
    </div>
    <div class="arrows"><button class="btn" id="eL">◀</button><button class="btn" id="eR">▶</button></div>
    <div class="hint" id="eHint"><span class="pill"></span></div>
  </div>

  <div class="scr" id="meet">
    <div class="top">
      <button class="btn" id="mBye"></button>
      <span></span>
    </div>
    <div class="hint" id="mHint"><span class="pill"></span></div>
    <div class="tray" id="tray"></div>
  </div>

  <div class="scr" id="breed">
    <div class="top">
      <button class="btn" data-home>🏠</button>
      <span class="pill" id="bTitle"></span>
      <button class="btn" data-book>📖 <span class="cnt"></span></button>
    </div>
    <div class="hint" id="bHint"><span class="pill"></span></div>
    <button class="btn slot" id="slotA"></button>
    <button class="btn slot" id="slotB"></button>
  </div>

  <div class="modal" id="result"><div class="card">
    <h2 id="rHead"></h2>
    <div id="rPic"></div>
    <div class="nm" id="rName"></div>
    <div class="meta" id="rMeta"></div>
    <div class="news" id="rNews"></div>
    <div class="btns"><button class="btn pink" id="rA"></button><button class="btn" id="rB"></button></div>
  </div></div>

  <div class="scr" id="book"><div class="panel">
    <div class="phead"><h2 id="bkTitle"></h2><button class="btn" id="bkClose">✕</button></div>
    <div class="tabs"><button id="tabC" class="on"></button><button id="tabP"></button></div>
    <div class="pbody" id="bkBody"></div>
  </div></div>

  <div class="scr" id="picker"><div class="panel">
    <div class="phead"><h2 id="pkTitle"></h2><button class="btn" id="pkClose">✕</button></div>
    <div class="pbody" id="pkBody"></div>
  </div></div>

  <div class="modal" id="detail"><div class="card">
    <div id="dPic"></div>
    <div class="nm" id="dName"></div>
    <div id="rename"><input id="rnIn" maxlength="12"><button class="btn pink" id="rnOk">OK</button></div>
    <div class="meta" id="dMeta"></div>
    <div class="chips" id="dParts"></div>
    <div class="btns">
      <button class="btn" id="dRen"></button>
      <button class="btn blue" id="dEgg"></button>
      <button class="btn" id="dClose"></button>
    </div>
  </div></div>
</div>
<script src="../common/kakin.js"></script>
<script>
'use strict';
/* =========================================================
   ふしぎな いきもの ずかん v0.1
   - 絵は1枚も使わず、生きもの・景色をすべてプログラムで描く
   - 生きもの = 8つの部品（からだ・もよう・め・くち・あたま・しっぽ・あし・はね）＋ 色
   - 2匹から 部品と色を受けつぐ子どもが 生まれる（ときどき めずらしい部品に かわる）
   ========================================================= */
const $ = s => document.querySelector(s);
const TAU = Math.PI * 2;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => b === undefined ? Math.random() * a : a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const hash = n => { const x = Math.sin(n * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
function mulberry(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wpick(arr, wf) {
  let tot = 0; const ws = arr.map(k => { const w = Math.max(0, wf(k)); tot += w; return w; });
  if (tot <= 0) return arr[0];
  let r = Math.random() * tot;
  for (let i = 0; i < arr.length; i++) { r -= ws[i]; if (r <= 0) return arr[i]; }
  return arr[arr.length - 1];
}
const hsl = (h, s, l, a = 1) => `hsla(${Math.round(((h % 360) + 360) % 360)},${Math.round(s)}%,${Math.round(l)}%,${a})`;

/* ---------- 部品 ---------- */
const CATS = ['body', 'pat', 'eyes', 'mouth', 'top', 'tail', 'legs', 'wings'];
const PARTS = {
  body: ['round', 'egg', 'pear', 'long', 'spiky', 'drop', 'mochi'],
  pat: ['none', 'spots', 'stripes', 'belly', 'twotone', 'stars', 'rainbow'],
  eyes: ['two', 'one', 'sleepy', 'sparkle', 'glow', 'three'],
  mouth: ['smile', 'o', 'fang', 'beak', 'cat', 'tongue'],
  top: ['none', 'cat', 'bunny', 'bear', 'antenna', 'horns', 'sprout', 'crown', 'unicorn'],
  tail: ['none', 'nub', 'curl', 'fluffy', 'fin', 'leaf', 'bolt'],
  legs: ['two', 'four', 'paws', 'none', 'tentacle'],
  wings: ['none', 'bird', 'fairy', 'bat', 'fins'],
};
// めずらしい部品（野生では ほとんど出ない。たまごで 出やすい）
const RARE = { pat: ['stars', 'rainbow'], eyes: ['three'], top: ['crown', 'unicorn'], tail: ['bolt'] };
const isRare = (cat, k) => !!(RARE[cat] && RARE[cat].includes(k));
// その場所に いかないと 出会えない部品（ほかでは たまごの へんかで だけ）
const EXCL = { eyes: ['glow'], legs: ['tentacle'], wings: ['bat', 'fins'], top: ['horns'], tail: ['fin'] };
// 「なし」は 集める ぶひん に 数えない
const COLLECT = c => PARTS[c].filter(k => k !== 'none');
const TOTAL_PARTS = CATS.reduce((n, c) => n + COLLECT(c).length, 0);

const FOODS = ['🍎', '🐟', '🌰', '🍯', '🍓', '🥕'];

/* ---------- すみか ---------- */

}
let detailE = null;
function openDetail(e) {
  detailE = e; const t = T();
  const pic = $('#dPic'); pic.innerHTML = ''; pic.appendChild(makeLive(e.g, 200, 'idle'));
  $('#dName').textContent = dispName(e); $('#rename').style.display = 'none';
  const lines = [t.no(e.id) + ' · ' + (e.from === 'egg' ? t.fromEgg + ' · ' + t.gen(e.gen) : t.fromHab(t.hab[e.from] || ''))];
  if (e.par) { const a = findE(e.par[0]), b = findE(e.par[1]); if (a && b) lines.push(t.parents(dispName(a), dispName(b))); }
  lines.push(e.fk ? t.likes(FOODS[e.g.food] + ' ' + t.food[e.g.food]) : t.likesQ);
  $('#dMeta').innerHTML = lines.map(s => '<div></div>').join('');
  $('#dMeta').querySelectorAll('div').forEach((d, i) => d.textContent = lines[i]);
  const ch = $('#dParts'); ch.innerHTML = '';
  for (const c of CATS) { if (c !== 'body' && (e.g[c] === 'none')) continue; const s = document.createElement('span'); s.className = 'chip' + (isRare(c, e.g[c]) ? ' rare' : ''); s.textContent = (isRare(c, e.g[c]) ? '★ ' : '') + partName(c, e.g[c]); ch.appendChild(s); }
  $('#dRen').textContent = t.rename; $('#dEgg').textContent = t.useEgg; $('#dClose').textContent = t.close;
  $('#dEgg').style.display = book.list.length >= 2 ? '' : 'none';
  $('#detail').classList.add('on');
}
$('#dClose').onclick = () => { sfx.tap(); $('#detail').classList.remove('on'); };
$('#dRen').onclick = () => { sfx.tap(); $('#rename').style.display = 'flex'; $('#rnIn').value = dispName(detailE); $('#rnIn').focus(); };
$('#rnOk').onclick = () => {
  const v = $('#rnIn').value.trim().slice(0, 12); detailE.cn = v; saveBook();
  $('#dName').textContent = dispName(detailE); $('#rename').style.display = 'none'; renderBook();
};
$('#rnIn').addEventListener('keydown', e => { if (e.key === 'Enter') $('#rnOk').click(); });
$('#dEgg').onclick = () => {
  sfx.tap(); const e = detailE; $('#detail').classList.remove('on'); $('#book').classList.remove('on');
  startBreed(); setSlot('a', e);
};

/* ---------- たまご ---------- */
let br = null;
function brR() { return clamp(Math.min(W, H) * .13, 38, 90); }
function homeX(w) { return w === 'a' ? W * .24 : W * .76; }
function startBreed() {
  br = { a: null, b: null, pa: { x: W * .24, l: 0 }, pb: { x: W * .76, l: 0 }, drag: null, phase: 'pick', t0: 0, cracks: 0, wob: 0, child: null };
  showScene('breed'); $('#bTitle').textContent = T().breed; renderBreed(); renderTitle();
}
function setSlot(w, e) {
  if (!br) return;
  const other = w === 'a' ? br.b : br.a; if (other && other.id === e.id) { if (w === 'a') br.b = null; else br.a = null; }
  br[w] = e; br['p' + w].x = homeX(w);
  if (br.a && br.b && br.phase === 'pick') br.phase = 'ready';
  renderBreed();
}
function renderBreed() {
  const t = T();
  $('#slotA').textContent = br.a ? t.change : t.pickA; $('#slotB').textContent = br.b ? t.change : t.pickB;
  const busy = br.phase === 'love' || br.phase === 'egg' || br.phase === 'hatch';
  $('#slotA').style.display = $('#slotB').style.display = busy ? 'none' : '';
  $('#bHint .pill').textContent = br.phase === 'pick' ? t.brHint0 : br.phase === 'ready' ? t.brHint1 : br.phase === 'egg' ? t.brHint2 : '';
  $('#bHint').style.opacity = br.phase === 'love' || br.phase === 'hatch' ? 0 : 1;
}
$('#slotA').onclick = () => { sfx.tap(); openPicker('a'); };
$('#slotB').onclick = () => { sfx.tap(); openPicker('b'); };
let pickFor = null;
function openPicker(w) {
  pickFor = w; $('#pkTitle').textContent = T().pkTitle;
  const body = $('#pkBody'); body.innerHTML = '';
  const g = document.createElement('div'); g.className = 'grid';
  const other = w === 'a' ? br.b : br.a;
  for (const e of book.list.slice().reverse()) {
    const c = cell(e, () => { sfx.tap(); $('#picker').classList.remove('on'); setSlot(pickFor, e); });
    if (other && other.id === e.id) c.disabled = true;
    g.appendChild(c);
  }
  body.appendChild(g); $('#picker').classList.add('on');
}
$('#pkClose').onclick = () => { sfx.tap(); $('#picker').classList.remove('on'); };
function brPos(w) {
  const R = brR(), e = br[w], p = br['p' + w];
  return { x: p.x, y: GY() + H * .06 - bodyInfo(e.g.body, R).bot - p.l, R };
}
function nestPos() { return { x: W / 2, y: GY() + H * .1 }; }
function drawNestBg() {
  let gr = ctx.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#ffd9e8'); gr.addColorStop(.6, '#fff3dc'); gr.addColorStop(1, '#fff3dc');
  ctx.fillStyle = gr; ctx.fillRect(0, 0, W, H);
  for (let i = 0; i < 18; i++) { const x = hash(i * 3.3) * W, y = hash(i * 7.1) * GY() * .8 + Math.sin(TS + i) * 6; heartPath(ctx, x, y, 10 + hash(i) * 14); ctx.fillStyle = 'rgba(255,160,190,.25)'; ctx.fill(); }
  const gy = GY();
  ctx.fillStyle = '#9fdc8a'; ctx.beginPath(); ctx.ellipse(W / 2, gy + H * .3, W * .9, H * .32, 0, 0, TAU); ctx.fill();
  const n = nestPos(), nw = Math.min(W * .22, 120);
  ctx.fillStyle = '#b07a48'; ctx.beginPath(); ctx.ellipse(n.x, n.y, nw, nw * .32, 0, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#8a5a32'; ctx.lineWidth = 3;
  for (let i = 0; i < 9; i++) { ctx.beginPath(); ctx.ellipse(n.x, n.y, nw * (1 - i * .03), nw * .32 * (1 - i * .05), (i - 4) * .04, Math.PI * (1.1 + i * .02), Math.PI * (1.9 - i * .02)); ctx.stroke(); }
  ctx.fillStyle = '#7a4e2a'; ctx.beginPath(); ctx.ellipse(n.x, n.y - nw * .06, nw * .7, nw * .16, 0, 0, TAU); ctx.fill();
}
function drawEgg(x, y, s, g, cracks, wob) {
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.sin(TS * 30) * .18 * wob);
  ctx.beginPath(); ctx.ellipse(0, -s * .55, s * .42, s * .55, 0, 0, TAU);
  ctx.fillStyle = hsl(g.h1, 35, 92); ctx.fill(); ctx.strokeStyle = hsl(g.h1, 30, 55); ctx.lineWidth = 2.5; ctx.stroke();
  ctx.save(); ctx.clip(); const rng = mulberry(g.seed + 7);
  for (let i = 0; i < 7; i++) { ctx.fillStyle = hsl(i % 2 ? g.h2 : g.h1, 60, 72); ctx.beginPath(); ctx.arc((rng() - .5) * s * .7, -rng() * s * 1.05, s * (.05 + rng() * .07), 0, TAU); ctx.fill(); }
  ctx.restore();
  ctx.strokeStyle = '#6a4a3a'; ctx.lineWidth = 2;
  for (let i = 0; i < cracks; i++) {
    const yy = -s * (.45 + i * .15); ctx.beginPath(); ctx.moveTo(-s * .38, yy);
    for (let j = 1; j <= 6; j++) ctx.lineTo(-s * .38 + j * s * .127, yy + (j % 2 ? -1 : 1) * s * .07); ctx.stroke();
  }
  ctx.restore();
}
function updateBreed(dt) {
  if (!br) return;
  for (const w of ['a', 'b']) {
    const p = br['p' + w];
    if (br.drag !== w) { if (br.phase === 'love') { const tx = W / 2 + (w === 'a' ? -1 : 1) * brR() * 1.1; p.x = lerp(p.x, tx, Math.min(1, dt * .01)); } else p.x = lerp(p.x, homeX(w), Math.min(1, dt * .008)); p.l = lerp(p.l, 0, Math.min(1, dt * .015)); }
  }
  br.wob = Math.max(0, br.wob - dt * .002);
  if (br.phase === 'love' && now - br.t0 > 1700) { br.phase = 'egg'; sfx.pop(); const n = nestPos(); burstSparkle(n.x, n.y - 40, 14); renderBreed(); }
  if (br.phase === 'love' && Math.random() < dt * .012) burstHearts(W / 2 + rnd(-30, 30), GY() - brR() * 1.2, 1);
  if (br.phase === 'hatch' && now - br.t0 > 1100 && !br.shown) {
    br.shown = true; const c = br.child;
    showResult({ head: T().born, e: c.e, newParts: c.newParts, mut: c.mut, a: T().again, b: T().toBook,
      onA: () => { br.phase = 'ready'; br.child = null; br.cracks = 0; br.shown = false; renderBreed(); renderTitle(); },
      onB: () => { br.phase = 'ready'; br.child = null; br.cracks = 0; br.shown = false; renderBreed(); openBook(); } });
  }
}
function drawBreed(dt) {
  drawNestBg();
  if (!br) return;
  const n = nestPos();
  for (const w of ['a', 'b']) {
    if (!br[w]) continue;
    const q = brPos(w);
    const mood = br.phase === 'love' ? 'happy' : br.drag === w ? 'happy' : 'idle';
    drawCreature(ctx, br[w].g, q.x, q.y, q.R, { t: TS + (w === 'b' ? 1.3 : 0), mood, flip: w === 'b', look: w === 'a' ? .7 : -.7, walk: br.drag === w });
  }
  if (br.phase === 'egg') drawEgg(n.x, n.y - 4, Math.min(W, H) * .22, br.child.e.g, br.cracks, br.wob);
  if (br.phase === 'hatch') {
    const p = clamp((now - br.t0) / 700, 0, 1), R = brR() * .8;
    drawCreature(ctx, br.child.e.g, n.x, n.y - bodyInfo(br.child.e.g.body, R).bot, R * (.5 + .5 * p), { t: TS, mood: 'happy', lift: Math.sin(p * Math.PI) * R });
  }
}
function downBreed(x, y) {
  if (!br || (br.phase !== 'ready' && br.phase !== 'egg')) return;
  if (br.phase === 'egg') {
    const n = nestPos(), s = Math.min(W, H) * .22;
    if (Math.abs(x - n.x) < s * .7 && y > n.y - s * 1.3 && y < n.y + 20) {
      br.cracks++; br.wob = 1; sfx.crack(); burstSparkle(x, y, 5, '#fff');
      if (br.cracks >= 3) {
        br.phase = 'hatch'; br.t0 = now; sfx.hatch();
        for (let i = 0; i < 12; i++) { const a = rnd(Math.PI, TAU); spawn({ kind: 'shell', x: n.x, y: n.y - s * .5, vx: Math.cos(a) * rnd(.1, .25), vy: Math.sin(a) * rnd(.1, .3), g: .0008, life: 1000, size: 8, col: hsl(br.child.e.g.h1, 35, 92) }); }
        burstSparkle(n.x, n.y - s * .5, 18); renderBreed();
      }
    }
    return;
  }
  for (const w of ['a', 'b']) {
    if (!br[w]) continue;
    const q = brPos(w), I = bodyInfo(br[w].g.body, q.R);
    if (Math.hypot(x - q.x, y - (q.y + (I.top + I.bot) / 2)) < q.R * 1.4) { br.drag = w; br.dragOff = x - q.x; sfx.tap(); return; }
  }
}
function moveBreed() {
  if (!br || !br.drag) return;
  const p = br['p' + br.drag]; p.x = clamp(P.x - br.dragOff, 20, W - 20); p.l = lerp(p.l, brR() * .25, .3);
  const d = Math.abs(br.pa.x - br.pb.x);
  if (d < brR() * 2.1) {
    br.drag = null; br.phase = 'love'; br.t0 = now; sfx.love();
    const m = mixGenome(br.a.g, br.b.g);
    const { e, newParts } = addToBook(m.g, 'egg', [br.a.id, br.b.id], childName(br.a.nm, br.b.nm));
    br.child = { e, newParts, mut: m.mut };
    renderBreed(); renderTitle();
  }
}
function upBreed() { if (br) br.drag = null; }

/* ---------- ゆび ---------- */
const P = { down: false, x: 0, y: 0, sx: 0, sy: 0, t: 0, moved: 0, id: null, lt: 0 };
cv.addEventListener('pointerdown', e => {
  if (P.down) return; ac();
  P.down = true; P.id = e.pointerId; P.x = P.sx = e.clientX; P.y = P.sy = e.clientY; P.t = P.lt = now; P.moved = 0;
  try { cv.setPointerCapture(e.pointerId); } catch (er) {}
  if (scene === 'explore') camV = 0;
  if (scene === 'breed') downBreed(P.x, P.y);
});
cv.addEventListener('pointermove', e => {
  if (!P.down || e.pointerId !== P.id) { if (!P.down) { P.x = e.clientX; P.y = e.clientY; } return; }
  const dx = e.clientX - P.x, dy = e.clientY - P.y, dt = Math.max(1, now - P.lt);
  P.x = e.clientX; P.y = e.clientY; P.lt = now; P.moved += Math.abs(dx) + Math.abs(dy);
  if (scene === 'explore' && !pop) { camX -= dx; camV = lerp(camV, -dx / dt, .5); }
  if (scene === 'meet') rubMeet(dx, dy);
  if (scene === 'breed') moveBreed();
});
function endPointer(e) {
  if (!P.down || e.pointerId !== P.id) return;
  P.down = false;
  if (P.moved < 14 && now - P.t < 500) { if (scene === 'explore') tapExplore(P.x, P.y); }
  if (scene === 'explore' && now - P.lt > 80) camV = 0;
  if (scene === 'breed') upBreed();
}
cv.addEventListener('pointerup', endPointer);
cv.addEventListener('pointercancel', endPointer);

/* ---------- まわす ---------- */
let last = performance.now();
function frame(ts) {
  const dt = Math.min(50, ts - last); last = ts; now = ts; TS = ts / 1000;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (scene === 'title') drawTitle(dt);
  else if (scene === 'explore') { updateExplore(dt); drawExplore(dt); }
  else if (scene === 'meet') { updateMeet(dt); drawMeet(dt); }
  else if (scene === 'breed') { updateBreed(dt); drawBreed(dt); }
  updateParts(dt); drawParts(ctx); ambTick();
  for (const o of live) { if (!o.c.isConnected) live.delete(o); else drawPortrait(o); }
  requestAnimationFrame(frame);
}
makeDemo(); renderTitle();
requestAnimationFrame(frame);
