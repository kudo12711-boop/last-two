<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#ffe9a8">
<title>ゆびで めいろ</title>
<style>
:root{
  --bg:#fff6d8; --ink:#4a3b2a; --card:#ffffff; --accent:#ff8a3d; --ok:#2fbf71; --soft:#ffe3b8;
  --line:#f0d9a8; --shadow:0 4px 0 rgba(120,80,20,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Kosugi Maru","Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.screen.on{display:flex}

/* タイトル */
#title{align-items:center;justify-content:center;gap:16px;overflow:auto;padding-top:24px;padding-bottom:24px}
#title h1{margin:0;font-size:clamp(34px,9vw,56px);letter-spacing:.04em;text-align:center;line-height:1.2}
#title h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
#title h1 span:nth-child(2n){animation-delay:.3s;color:var(--accent)}
@keyframes bob{50%{transform:translateY(-6px)}}
.sub{margin:-8px 0 4px;font-size:16px;opacity:.75;text-align:center}
.big{display:flex;align-items:center;gap:14px;width:min(420px,100%);padding:16px 20px;border-radius:24px;background:var(--card);
  box-shadow:var(--shadow);font-size:22px;font-weight:700;text-align:left}
.big .ico{font-size:40px;line-height:1}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,80,20,.18)}
.lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;font-size:15px;width:min(440px,100%)}
.lvl button{padding:8px 12px;border-radius:16px;background:var(--soft);font-weight:700;line-height:1.25;min-width:72px}
.lvl button small{display:block;font-size:11px;font-weight:400;opacity:.8}
.lvl button.sel{background:var(--accent);color:#fff}
#btnRandom{justify-content:center;background:linear-gradient(135deg,#fff,#ffeec9)}
.big small{display:block;font-size:13px;font-weight:400;opacity:.7;margin-top:2px}
#heroes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:min(420px,100%)}
#heroes button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px 10px;border-radius:22px;background:var(--card);
  box-shadow:var(--shadow);font-size:14px;font-weight:700}
#heroes button .ico{font-size:46px;line-height:1.1}
#heroes button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(120,80,20,.18)}
#book{width:min(420px,100%);background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow)}
#book b{font-size:15px}
#bookList{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px;font-size:30px;min-height:36px}
#bookList .empty{font-size:14px;opacity:.6;align-self:center}
.foot{display:flex;gap:10px;font-size:14px}
.foot button{background:none;text-decoration:underline;opacity:.7;padding:6px}

/* ゲーム */
#game{padding-left:8px;padding-right:8px}
.bar{display:flex;align-items:center;gap:8px;height:62px;flex:none}
.round{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:none}
#items{flex:1;display:flex;justify-content:center;gap:4px;font-size:30px;min-width:0}
#items i{font-style:normal;filter:grayscale(1);opacity:.3;transition:.3s}
#items i.got{filter:none;opacity:1;animation:pop .5s}
@keyframes pop{40%{transform:scale(1.6)}}
#board{flex:1;position:relative;min-height:0;padding-bottom:8px}
#cv{position:absolute;left:0;top:0;width:100%;height:100%;touch-action:none;display:block}
#say{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%);font-size:clamp(38px,11vw,72px);font-weight:900;color:#fff;
  -webkit-text-stroke:3px var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.12);pointer-events:none;opacity:0;white-space:nowrap;z-index:5}
#say.on{animation:sayA 1.4s ease-out forwards}
@keyframes sayA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}

#clear{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(255,246,216,.6);z-index:10;padding:16px}
#clear.on{display:flex}
.panel{background:var(--card);border-radius:28px;padding:22px 20px;width:min(380px,100%);text-align:center;box-shadow:0 8px 0 rgba(120,80,20,.18);animation:panelIn .45s cubic-bezier(.3,1.5,.5,1)}
@keyframes panelIn{from{transform:scale(.6);opacity:0}}
.panel h2{margin:0;font-size:32px;color:var(--accent)}
#reward{font-size:96px;line-height:1.1;margin:8px 0;animation:jump 1s ease-in-out infinite}
@keyframes jump{50%{transform:translateY(-14px) rotate(-6deg)}}
.panel p{margin:4px 0 14px}
.panel .big{width:100%;justify-content:center;margin-top:10px}

#help{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.35);z-index:30;padding:16px}
#help.on{display:flex}
#help .panel{text-align:left;font-size:15px;line-height:1.7;max-height:calc(100dvh - 32px);overflow:auto}
#help h3{margin:16px 0 4px;font-size:18px}
#help .note{font-size:13px;opacity:.75;line-height:1.6;margin:4px 0 8px}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.opt button{padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px}
.opt button.sel{background:var(--accent);color:#fff}
.vrow{display:flex;gap:6px;margin-top:6px}
.vrow select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.rb{padding:8px 10px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px;white-space:nowrap}
</style>
</head>
<body>

<section id="title" class="screen on">
  <h1 id="h1"></h1>
  <p class="sub" data-t="sub"></p>

  <div class="lvl" id="lvl"></div>
  <button class="big" id="btnRandom"><span class="ico">🎲</span><span><span data-t="random"></span><small data-t="randomSub"></small></span></button>
  <div id="heroes"></div>

  <div id="book"><b data-t="book"></b> <span id="bookCount"></span><div id="bookList"></div></div>
  <div class="foot"><button id="btnHelp" data-t="help"></button><button id="btnSnd"></button><button id="btnLang"></button></div>
</section>

<section id="game" class="screen">
  <div class="bar">
    <button class="round" id="btnHome" data-ta="home">🏠</button>
    <div id="items"></div>
    <button class="round" id="btnHint" data-ta="hint">💡</button>
  </div>
  <div id="board"><canvas id="cv"></canvas></div>
</section>

<div id="say"></div>
<canvas id="confetti"></canvas>
<div id="clear"><div class="panel">
  <h2 data-t="goal"></h2>
  <div id="reward">🐻</div>
  <p data-t="gotSticker"></p>
  <button class="big" id="btnNext"><span class="ico">▶️</span><span data-t="next"></span></button>
  <button class="big" id="btnBack"><span class="ico">🏠</span><span data-t="back"></span></button>
</div></div>
<div id="help"><div class="panel">
  <h2 style="font-size:22px" data-t="parents"></h2>
  <div data-th="howto"></div>
  <h3 data-t="guideH"></h3>
  <div class="note" data-t="guideNote"></div>
  <div class="opt" id="optGuide">
    <button data-v="always" data-t="always"></button><button data-v="hint" data-t="onHint"></button>
  </div>
  <h3 data-t="voiceH"></h3>
  <div class="vrow"><select id="voiceSel"></select><button class="rb" id="voiceTest" data-t="test"></button></div>
  <div class="note" data-t="voiceNote"></div>
  <h3>🌐 ことば / Language</h3>
  <div class="opt" id="optLang"><button data-v="ja">日本語</button><button data-v="en">English</button></div>
  <h3 data-t="fullH"></h3>
  <div class="note" data-t="fullNote"></div>
  <div id="kkSlot"></div>
  <button class="big" id="btnHelpClose" style="justify-content:center;margin-top:14px" data-t="close"></button>
</div></div>

<script src="../common/kakin.js"></script>
<script>
'use strict';
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const EMOJI_FONT = '"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';

/* ---------- ことば（言語を足すときは TEXT に1つ足す。声のセリフは TEXT.<言語>.say） ---------- */
const TEXT = {
  ja: {
    title: 'ゆびで めいろ', h1: ['ゆびで', 'めいろ'], sub: 'ゆびで みちを なぞって ゴールまで つれていってね',
    random: 'おまかせ', randomSub: 'だれが でるかな？ まいかい かわるよ', book: 'あつめた シール', bookN: n => `（${n}まい）`, bookEmpty: 'ゴールすると シールが もらえるよ',
    help: 'おうちのかたへ・せってい', sndOn: '🔊 おと あり', sndOff: '🔇 おと なし', lang: 'English', home: 'もどる', hint: 'ヒント',
    goal: 'ゴール！', gotSticker: 'シールを もらったよ！', next: 'つぎの めいろ', back: 'はじめに もどる',
    parents: 'おうちのかたへ',
    howto: '・キャラクターに指をあてて、道をなぞるとキャラクターがついてきます。かべは通りぬけられないので、まちがえても「ぽよん」と止まるだけです。<br>・指をはなしても大丈夫。キャラクターか、通ってきた線のどこからでも続きをなぞれます。もどりたいときは線を逆になぞります。<br>・とちゅうの くだものや ほしを集めながらゴールを目指します。<br>・こまったら 💡 で、ゴールまでの道がしばらく光ります。<br>・むずかしさは タイトル画面の「★」で選べます（2さい向け〜5さい以上向け）。毎回ちがう迷路が自動でできます。',
    guideH: '🧭 みちしるべ', guideNote: 'はじめての子には「いつも」がおすすめです。ゴールまでの道に うすい点が出ます。', always: 'いつも だす', onHint: '💡のときだけ',
    voiceH: '🗣️ こえ', test: '▶ ためす', voiceNote: '「AIのこえ」は、あらかじめ AI で作っておいた声です（Kokoro-82M／Apache-2.0）。',
    aiVoice: n => `AIのこえ ${n}`, devVoice: 'スマホの よみあげ', noVoice: 'こえ なし',
    fullH: '🔓 ぜんぶ版', fullNote: 'むりょうでは 🐶 わんちゃん と 🐰 うさぎさん で あそべます。ぜんぶ版（買い切り）か ファミリーパスで、🐧🐝🚀🚗 の めいろも あそべます。広告は出しません。',
    close: 'とじる', ages: ['2さい〜', '3さい〜', '4さい〜', '5さい〜'],
    heroes: { dog: 'わんちゃん', rabbit: 'うさぎさん', penguin: 'ペンギン', bee: 'はちさん', rocket: 'ロケット', car: 'くるま' },
    say: {
      start: ['ゴールまで、なぞってね。', 'どっちに いくのかな？'], here: ['ここから、なぞってね。'], bump: ['そっちは、かべだよ。', 'こっちかな？'],
      item: ['ゲット！', 'いいね！', 'きらきら！'], cheer: ['もうすこし！', 'がんばれ！'], hint: ['ひかってる みちを、すすんでね。'],
      goal: ['ゴール！やったね！', 'ついたね！すごーい！', 'じょうずに、できました！']
    }
  },
  en: {
    title: 'Finger Maze', h1: ['Finger', 'Maze'], sub: 'Trace the path with your finger and lead your friend to the goal!',
    random: 'Surprise me', randomSub: 'Who will it be? A new friend every time', book: 'My stickers', bookN: n => `(${n})`, bookEmpty: 'Reach the goal to get a sticker!',
    help: 'For grown-ups / Settings', sndOn: '🔊 Sound on', sndOff: '🔇 Sound off', lang: '日本語', home: 'Home', hint: 'Hint',
    goal: 'Goal!', gotSticker: 'You got a sticker!', next: 'Next maze', back: 'Back to start',
    parents: 'For grown-ups',
    howto: '• Put a finger on the character and trace the path; the character follows. Walls can’t be crossed, so a wrong move just makes a soft “boing”.<br>• It’s fine to lift the finger. Continue from the character or anywhere on the line already drawn. To go back, trace the line backwards.<br>• Collect the fruit and stars on the way to the goal.<br>• Stuck? Tap 💡 and the path to the goal lights up for a while.<br>• Choose the difficulty with the “★” buttons on the title screen (age 2 to 5+). A new maze is made every time.',
    guideH: '🧭 Path guide', guideNote: '“Always” is best for first-timers: faint dots show the way to the goal.', always: 'Always', onHint: 'Only with 💡',
    voiceH: '🗣️ Voice', test: '▶ Try', voiceNote: '“AI voices” were made in advance with AI (Kokoro-82M / Apache-2.0).',
    aiVoice: n => `AI voice ${n}`, devVoice: 'Device voice', noVoice: 'No voice',
    fullH: '🔓 Full version', fullNote: 'Free: the 🐶 Dog and 🐰 Bunny mazes. With the full version (one-time purchase) or the Family Pass, the 🐧🐝🚀🚗 mazes open too. No ads.',
    close: 'Close', ages: ['Age 2+', 'Age 3+', 'Age 4+', 'Age 5+'],
    heroes: { dog: 'Dog', rabbit: 'Bunny', penguin: 'Penguin', bee: 'Bee', rocket: 'Rocket', car: 'Car' },
    say: {
      start: ['Trace the way to the goal!', 'Which way should we go?'], here: ['Start tracing from here!'], bump: ['Oops, that’s a wall!', 'Maybe this way?'],
      item: ['Got it!', 'Nice!', 'Sparkly!'], cheer: ['Almost there!', 'You can do it!'], hint: ['Follow the shining path!'],
      goal: ['Goal! Hooray!', 'You made it! Amazing!', 'Great job!']
    }
  }
};
function pickLang() {
  const q = new URLSearchParams(location.search).get('lang'); if (q && TEXT[q]) return q;
  const s = store.get('meiro-lang', null); if (s && TEXT[s]) return s;
  try { const gl = localStorage.getItem('games-lang'); if (gl && TEXT[gl]) return gl; } catch (e) {} // 入口ページで えらんだ ことば
  const nav = ((navigator.languages && navigator.languages[0]) || navigator.language || 'ja').slice(0, 2);
  return TEXT[nav] ? nav : 'en';
}
let L = pickLang();
const T = () => TEXT[L];
function applyText() {
  const t = T();
  document.documentElement.lang = L; document.title = t.title;
  $('#h1').innerHTML = t.h1.map(w => [...w].map(c => `<span>${c}</span>`).join('')).join('<br>');
  document.querySelectorAll('[data-t]').forEach(e => { e.textContent = t[e.dataset.t]; });
  document.querySelectorAll('[data-th]').forEach(e => { e.innerHTML = t[e.dataset.th]; });
  document.querySelectorAll('[data-ta]').forEach(e => e.setAttribute('aria-label', t[e.dataset.ta]));
}
function setLang(l) { L = l; store.set('meiro-lang', l); applyText(); renderTitle(); if ($('#help').classList.contains('on')) renderHelp(); prepVoice(); }

/* ---------- おと と こえ ---------- */
let soundOn = store.get('meiro-sound', true);
let actx = null;
function audio() {
  if (!soundOn) return null;
  if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
  if (actx.state === 'suspended') actx.resume();
  return actx;
}
function tone(freq, t0, dur, type = 'sine', vol = .25, slideTo) {
  const a = audio(); if (!a) return;
  const o = a.createOscillator(), g = a.createGain(), t = a.currentTime + t0;
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t + dur);
  g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol, t + .02); g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .05);
}
const SCALE = [523, 587, 659, 784, 880, 1047, 1175, 1319, 1568, 1760];
const sfx = {
  step(n) { tone(SCALE[n % SCALE.length], 0, .12, 'triangle', .12); },
  back() { tone(440, 0, .08, 'sine', .07, 380); },
  bump() { tone(220, 0, .18, 'sine', .22, 140); tone(330, .05, .12, 'sine', .08, 200); },
  item() { [988, 1319, 1760].forEach((f, i) => tone(f, i * .06, .18, 'triangle', .18)); },
  clear() { [523, 659, 784, 1047, 784, 1047, 1319].forEach((f, i) => tone(f, i * .12, i === 6 ? .8 : .2, 'square', .1)); },
  tap() { tone(880, 0, .06, 'sine', .08); }
};
/* こえ：AIで作っておいた声（voice/フォルダ）→ なければ 端末の読み上げ */
// AIのこえ 1〜4。ことばごとに ちがう声（voice/<声>/<場面><番号>.mp3）
const AI_VOICES = { ja: ['jf_alpha', 'jf_gongitsune', 'jf_nezumi', 'jf_tebukuro'], en: ['af_heart', 'af_bella', 'bf_emma', 'am_michael'] };
const aiCount = cat => T().say[cat].length;
const aiBuf = {}; // 'jf_alpha/goal0' -> AudioBuffer
let aiSrc = null;
function aiLoad(id) {
  const a = audio(); if (!a) return;
  for (const cat of Object.keys(T().say)) for (let i = 0; i < aiCount(cat); i++) {
    const k = `${id}/${cat}${i}`;
    if (aiBuf[k]) continue;
    aiBuf[k] = 'loading';
    fetch(`voice/${k}.mp3?v=1`).then(r => { if (!r.ok) throw 0; return r.arrayBuffer(); })
      .then(b => new Promise((res, rej) => a.decodeAudioData(b, res, rej)))
      .then(buf => { aiBuf[k] = buf; }).catch(() => { aiBuf[k] = 'none'; });
  }
}
function aiReady(id, cat) {
  const r = [];
  for (let i = 0; i < aiCount(cat); i++) { const b = aiBuf[`${id}/${cat}${i}`]; if (b && typeof b !== 'string') r.push(`${id}/${cat}${i}`); }
  return r;
}
let voiceList = [], devVoice = null;
function voiceScore(v) {
  const n = v.name; let s = 0;
  if (/拡張|Enhanced|Premium|プレミアム/i.test(n)) s += 50;
  if (/Natural|Neural|Online/i.test(n)) s += 45;
  if (/Google/i.test(n)) s += 30;
  if (/Kyoko|O-ren|Nanami|Hattori|Ayumi|Haruka|Samantha|Karen|Jenny|Aria/i.test(n)) s += 10;
  if (/Eddy|Flo|Grandma|Grandpa|Reed|Rocko|Sandy|Shelley|Bad|Bells|Bubbles|Jester|Whisper|Zarvox|Albert|Trinoids|Organ|Cellos|Boing|Wobble|Superstar/i.test(n)) s -= 60;
  return s;
}
function loadVoice() {
  try { voiceList = speechSynthesis.getVoices(); } catch (e) {}
}
if ('speechSynthesis' in window) { loadVoice(); speechSynthesis.onvoiceschanged = loadVoice; }
function tts(text) {
  if (!('speechSynthesis' in window)) return;
  try {
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const vs = voiceList.filter(v => v.lang.replace('_', '-').toLowerCase().startsWith(L)).sort((a, b) => voiceScore(b) - voiceScore(a));
    u.lang = L === 'ja' ? 'ja-JP' : 'en-US'; u.pitch = 1.15; u.rate = L === 'ja' ? .95 : .9; if (vs[0]) u.voice = vs[0];
    speechSynthesis.speak(u);
  } catch (e) {}
}
const lastTake = {};
function pickTake(cat, list) { // おなじ声が つづかないように
  const c = list.length > 1 ? list.filter(k => k !== lastTake[cat]) : list;
  return (lastTake[cat] = pick(c));
}
// 'ai:1'〜'ai:4'（AIのこえ 何番）/ 'dev'（端末の読み上げ）/ 'off'。むかしの 'ai:jf_alpha' なども よめる
let voiceMode = store.get('meiro-voice', 'ai:1');
{ const i = AI_VOICES.ja.indexOf(voiceMode.slice(3)); if (i >= 0) voiceMode = 'ai:' + (i + 1); }
const aiId = () => AI_VOICES[L][(+voiceMode.slice(3) || 1) - 1] || AI_VOICES[L][0];
let lastSpeak = 0;
function speak(cat, force) {
  if (!soundOn || voiceMode === 'off') return;
  const now = performance.now();
  if (!force && now - lastSpeak < 1600) return; // しゃべりすぎない
  lastSpeak = now;
  if (voiceMode.startsWith('ai:')) {
    const id = aiId(), a = audio(); if (!a) return;
    aiLoad(id);
    const ready = aiReady(id, cat);
    if (ready.length) {
      try { if (aiSrc) aiSrc.stop(); } catch (e) {}
      const src = a.createBufferSource(); src.buffer = aiBuf[pickTake('ai-' + cat, ready)];
      src.connect(a.destination); src.start(); aiSrc = src; return;
    }
    // まだ読みこめていない・ファイルがないときは 端末の声で
  }
  tts(pickTake(L + cat, T().say[cat]));
}

function renderTitle() {
  $('#lvl').innerHTML = LEVELS.map((lv, i) => `<button data-l="${i}" class="${i === level ? 'sel' : ''}">${lv.label}<small>${T().ages[i]}</small></button>`).join('');
  $('#heroes').innerHTML = THEMES.map((t, i) => `<button data-t="${i}" class="${heroOpen(i) ? '' : 'kk-lock'}"><span class="ico">${t.hero}</span>${T().heroes[t.id]}</button>`).join('');
  const book = store.get('meiro-book', []);
  $('#bookCount').textContent = book.length ? T().bookN(book.length) : '';
  $('#bookList').innerHTML = book.length ? book.slice(-40).map(e => `<span>${e}</span>`).join('') : `<span class="empty">${T().bookEmpty}</span>`;
  $('#btnSnd').textContent = soundOn ? T().sndOn : T().sndOff; $('#btnLang').textContent = T().lang;
}
function goTitle() {
  state = 'idle'; drag = null; maze = null; clearTimeout(clearTimer);
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('on'));
  $('#title').classList.add('on'); $('#clear').classList.remove('on');
  document.querySelector('meta[name=theme-color]').content = '#ffe9a8';
  renderTitle();
}
$('#lvl').onclick = e => { const b = e.target.closest('button'); if (!b) return; level = +b.dataset.l; store.set('meiro-level', level); audio(); sfx.tap(); renderTitle(); };
$('#heroes').onclick = e => { const b = e.target.closest('button'); if (!b) return; audio(); if (!heroOpen(+b.dataset.t)) { sfx.tap(); Kakin.ask(); return; } prepVoice(); sfx.tap(); omakase = false; startGame(THEMES[+b.dataset.t]); };
$('#btnRandom').onclick = () => { audio(); prepVoice(); sfx.tap(); omakase = true; startGame(randomTheme()); };
$('#btnHome').onclick = () => { sfx.tap(); goTitle(); };
$('#btnBack').onclick = () => { sfx.tap(); goTitle(); };
$('#btnNext').onclick = () => { sfx.tap(); startGame(omakase ? randomTheme() : theme); };
$('#btnSnd').onclick = () => { soundOn = !soundOn; store.set('meiro-sound', soundOn); if (soundOn) { audio(); sfx.tap(); } renderTitle(); };
function renderHelp() {
  document.querySelectorAll('#optGuide button').forEach(b => b.classList.toggle('sel', b.dataset.v === guide));
  $('#voiceSel').innerHTML = [1, 2, 3, 4].map(n => `<option value="ai:${n}">${T().aiVoice(n)}</option>`).join('') +
    `<option value="dev">${T().devVoice}</option><option value="off">${T().noVoice}</option>`;
  document.querySelectorAll('#optLang button').forEach(b => b.classList.toggle('sel', b.dataset.v === L));
  $('#voiceSel').value = voiceMode;
}
$('#btnHelp').onclick = () => { renderHelp(); $('#help').classList.add('on'); };
$('#btnHelpClose').onclick = () => $('#help').classList.remove('on');
$('#optGuide').onclick = e => { const b = e.target.closest('button'); if (!b) return; guide = b.dataset.v; store.set('meiro-guide', guide); renderHelp(); };
$('#voiceSel').onchange = e => { voiceMode = e.target.value; store.set('meiro-voice', voiceMode); prepVoice(); };
$('#voiceTest').onclick = () => { audio(); prepVoice(); setTimeout(() => speak('goal', true), voiceMode.startsWith('ai:') ? 400 : 0); };
$('#btnLang').onclick = () => { sfx.tap(); setLang(L === 'ja' ? 'en' : 'ja'); };
$('#optLang').onclick = e => { const b = e.target.closest('button'); if (b) setLang(b.dataset.v); };
applyText();
renderTitle();
</script>
</body>
</html>
