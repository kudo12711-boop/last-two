<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#ffe9f2">
<title>ちいさな おうこく</title>
<meta name="description" content="プリンセス・おうじさま・きしさま・さむらいさまになって、むらの みんなの おねがいを かなえよう">
<style>
:root{
  --bg:#fff4f8; --panel:#ffffff; --ink:#4a3446; --sub:#8b7287; --line:#f5d7e6;
  --accent:#ff6fa8; --accent2:#7f6bff; --gold:#e9b949; --ok:#3fbf7f;
  --shadow:0 3px 0 #efc9dc, 0 8px 22px rgba(160,60,110,.12);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#211a26; --panel:#2f2536; --ink:#f8eaf3; --sub:#cdb6c8; --line:#46374f;
    --shadow:0 3px 0 #17111b, 0 8px 22px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --bg:#211a26; --panel:#2f2536; --ink:#f8eaf3; --sub:#cdb6c8; --line:#46374f;
  --shadow:0 3px 0 #17111b, 0 8px 22px rgba(0,0,0,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);overflow:hidden;
  font-family:"Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP","Yu Gothic",system-ui,sans-serif;
  -webkit-user-select:none;user-select:none;touch-action:manipulation}
button{font:inherit;color:inherit;cursor:pointer}
.screen{position:fixed;inset:0;display:none;flex-direction:column;
  padding:calc(env(safe-area-inset-top) + 10px) 14px calc(env(safe-area-inset-bottom) + 12px)}
.screen.on{display:flex}
.big{border:0;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:20px;
  padding:14px 30px;box-shadow:0 4px 0 #d94f87;min-height:56px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 #d94f87}
.big.sub{background:var(--panel);color:var(--ink);box-shadow:0 4px 0 var(--line);border:2px solid var(--line)}
.icon-btn{border:2px solid var(--line);background:var(--panel);border-radius:16px;min-width:52px;height:52px;
  font-size:24px;display:grid;place-items:center;position:relative;padding:0 8px;box-shadow:0 3px 0 var(--line)}
.icon-btn:active{transform:translateY(2px);box-shadow:none}
.icon-btn .lbl{position:absolute;bottom:-17px;left:50%;transform:translateX(-50%);font-size:10px;white-space:nowrap;color:var(--sub)}
.badge{position:absolute;top:-6px;right:-6px;background:#ff4d6d;color:#fff;border-radius:999px;font-size:12px;
  min-width:20px;height:20px;display:grid;place-items:center;font-weight:700;animation:pop 1s ease-in-out infinite}
h1.logo{font-size:clamp(34px,10vw,56px);margin:0;text-align:center;letter-spacing:.04em;
  color:var(--accent);text-shadow:0 3px 0 #fff, 0 6px 0 #f5c6dc}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center}
.langs{display:flex;gap:6px;justify-content:center}
.langs button{border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:14px;min-height:40px}
.langs button[aria-pressed="true"]{background:var(--accent2);color:#fff;border-color:var(--accent2)}
.title-av{display:flex;gap:4px;justify-content:center}
.title-av svg{width:72px;height:100px}

/* role pick */
.ttl{font-size:22px;font-weight:700;text-align:center;margin:6px 0 12px}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;flex:1;align-content:center;max-width:520px;margin:0 auto;width:100%}
.role{background:var(--panel);border:3px solid var(--line);border-radius:22px;padding:8px 6px 10px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;align-items:center}
.role:active{transform:scale(.97)}
.role svg{width:100%;max-width:150px;height:auto;aspect-ratio:200/280}
.role b{font-size:18px}

/* closet */
#closet .stage{flex:none;display:flex;justify-content:center;align-items:flex-end;height:38vh;min-height:220px;position:relative}
#closet .stage svg{height:100%;width:auto}
#closet .pet{position:absolute;bottom:4px;font-size:44px;left:calc(50% + 16vh)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 6px;flex:none;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:none;border:2px solid var(--line);background:var(--panel);border-radius:999px;padding:6px 14px;font-size:15px;min-height:42px}
.tabs button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
.opts{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:10px;align-content:start;padding:6px 2px}
.opt{aspect-ratio:1;border:3px solid var(--line);background:var(--panel);border-radius:18px;font-size:32px;
  display:grid;place-items:center;position:relative;overflow:hidden;padding:0}
.opt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px #ffd0e4}
.opt.locked{opacity:.45}
.opt.locked::after{content:"🔒";position:absolute;right:3px;bottom:0;font-size:16px}
.opt .sw{width:60%;height:60%;border-radius:50%;border:2px solid rgba(0,0,0,.1)}
.opt svg{width:90%;height:90%}
.opt small{position:absolute;bottom:2px;font-size:10px;color:var(--sub)}
.row{display:flex;gap:10px;justify-content:center;align-items:center;flex:none;padding-top:8px;flex-wrap:wrap}
.name-in{border:2px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:18px;width:100%;
  background:var(--panel);color:var(--ink);-webkit-user-select:text;user-select:text}

/* kingdom */
#kingdom{padding-left:0;padding-right:0;padding-bottom:0}
.topbar{display:flex;align-items:center;gap:8px;padding:0 10px 18px;flex:none}
.hearts{display:flex;align-items:center;gap:6px;background:var(--panel);border:2px solid var(--line);border-radius:999px;
  padding:4px 12px 4px 8px;font-weight:700;font-size:18px;min-height:44px}
.prog{flex:none;padding:0 14px 8px;display:flex;align-items:center;gap:10px}
.prog .bar{flex:1}
.prog .bar{height:12px;border-radius:999px;background:var(--line);overflow:hidden}
.prog .fill{height:100%;background:linear-gradient(90deg,#ff9ec6,#ff6fa8);border-radius:999px;transition:width .6s}
.prog .nx{font-size:13px;color:var(--sub);white-space:nowrap;flex:none;max-width:65%;overflow:hidden;text-overflow:ellipsis}
.scene-wrap{flex:1;position:relative;min-height:0;background:linear-gradient(#8fd3ff 0 45%,#9fe08a 45%)}
.scene-wrap.night{background:linear-gradient(#5b5fb8 0 45%,#9fe08a 45%)}
#scene{position:absolute;inset:0;width:100%;height:100%}
.tap{cursor:pointer}
.bob{animation:bob 1.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.cloud{animation:drift 40s linear infinite}
.twinkle{animation:tw 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(480px)}}
@keyframes tw{50%{opacity:.25}}
@keyframes pop{50%{transform:scale(1.15)}}
@keyframes shake{20%,60%{transform:translateX(-7px) rotate(-4deg)}40%,80%{transform:translateX(7px) rotate(4deg)}}
@keyframes grow{from{transform:scale(.3)}to{transform:scale(1)}}
@keyframes fly{to{transform:translateY(-70vh) rotate(var(--r,30deg));opacity:0}}
.shake{animation:shake .45s}
.grow{animation:grow .35s cubic-bezier(.3,1.6,.6,1)}

/* overlay / dialogs */
.ov{position:fixed;inset:0;background:rgba(60,30,60,.45);display:none;align-items:flex-end;justify-content:center;z-index:20;
  padding:12px 12px calc(env(safe-area-inset-bottom) + 12px)}
.ov.on{display:flex}
.card{background:var(--panel);border-radius:26px;padding:18px 16px 16px;width:100%;max-width:520px;box-shadow:0 10px 40px rgba(0,0,0,.25);
  text-align:center;position:relative;max-height:calc(100vh - 40px);overflow:auto}
.card .who{font-size:64px;line-height:1;margin-top:-4px}
.card .say{font-size:20px;font-weight:700;margin:8px 0 4px;line-height:1.5}
.card .note{color:var(--sub);font-size:14px;margin:0 0 14px}
.card .btns{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.x{position:absolute;top:8px;right:10px;border:0;background:transparent;font-size:26px;color:var(--sub);width:44px;height:44px}

/* minigame */
#game{background:linear-gradient(#e9f6ff,#fff4f8)}
:root[data-theme="dark"] #game{background:linear-gradient(#1d2433,#211a26)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) #game{background:linear-gradient(#1d2433,#211a26)}}
.ghead{display:flex;align-items:center;gap:10px;flex:none}
.ghead .who{font-size:44px}
.ghead .say{flex:1;font-size:18px;font-weight:700;line-height:1.4}
.garea{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;min-height:0}
.tray{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:460px}
.item{width:72px;height:72px;border-radius:20px;border:3px solid var(--line);background:var(--panel);font-size:40px;
  display:grid;place-items:center;box-shadow:0 3px 0 var(--line);padding:0}
.item:active{transform:translateY(2px);box-shadow:none}
.item.done{opacity:.25;pointer-events:none}
.bush.hint{animation:pop .8s ease-in-out infinite}
.item.hint{animation:pop .8s ease-in-out infinite;border-color:var(--gold)}
.order{display:flex;gap:8px;background:var(--panel);border:3px dashed var(--line);border-radius:18px;padding:8px 14px;font-size:34px}
.order span{position:relative}
.order span.ok::after{content:"✔";position:absolute;right:-6px;bottom:-6px;font-size:18px;color:var(--ok)}
.cake{position:relative;width:220px;height:150px}
.cake .layer{position:absolute;left:10px;right:10px;bottom:0;height:90px;border-radius:16px 16px 22px 22px;
  background:linear-gradient(#fff 0 26%,#ffd3e3 26% 34%,#f7b98a 34%);box-shadow:inset 0 -8px 0 rgba(0,0,0,.08)}
.cake .tops{position:absolute;left:20px;right:20px;top:20px;height:50px;display:flex;justify-content:space-around;align-items:flex-end;font-size:36px}
.pots{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pot{width:92px;height:110px;border:0;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:0;position:relative}
.pot .pl{font-size:46px;line-height:1;min-height:50px}
.pot .base{width:70px;height:44px;background:#d98b5f;border-radius:6px 6px 18px 18px;box-shadow:inset 0 6px 0 #b86e47}
.drop{position:absolute;top:-10px;font-size:26px;animation:fall .5s ease-in forwards}
@keyframes fall{from{transform:translateY(-20px);opacity:1}to{transform:translateY(40px);opacity:0}}
.dragon{font-size:110px;line-height:1;position:relative}
.think{position:absolute;top:-30px;right:-70px;background:var(--panel);border:3px solid var(--line);border-radius:50%;width:78px;height:78px;
  display:grid;place-items:center;font-size:44px}
.bushes{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.bush{width:96px;height:96px;border:0;background:transparent;font-size:70px;position:relative;padding:0}
.bush .found{position:absolute;left:0;right:0;bottom:-6px;font-size:36px}
.houses{display:flex;gap:12px;justify-content:center}
.house{width:96px;height:110px;border:0;background:transparent;padding:0;display:flex;flex-direction:column;align-items:center}
.house .roof{width:0;height:0;border-left:48px solid transparent;border-right:48px solid transparent;border-bottom:40px solid}
.house .wall{width:76px;height:64px;background:#fff6e8;border:3px solid #e6d2b5;border-top:0;display:grid;place-items:center;font-size:26px}
.letter{font-size:70px;position:relative;line-height:1}
.letter i{position:absolute;right:-8px;bottom:6px;width:30px;height:30px;border-radius:50%;border:3px solid #fff}
.lanterns{display:flex;gap:6px;justify-content:center;align-items:flex-start}
.lan{width:46px;height:62px;border-radius:44% 44% 44% 44%/50%;position:relative;border:2px solid rgba(0,0,0,.15);
  background-image:repeating-linear-gradient(transparent 0 9px,rgba(0,0,0,.12) 9px 11px)}
.lan::before,.lan::after{content:"";position:absolute;left:12px;right:12px;height:7px;background:#3b2a2a;border-radius:2px}
.lan::before{top:-5px}.lan::after{bottom:-5px}
.lan.q{background:var(--panel);border:3px dashed var(--sub);display:grid;place-items:center;font-size:26px;font-weight:700;color:var(--sub)}
.lan.q::before,.lan.q::after{display:none}
.item .lan{transform:scale(.8)}
.string{height:3px;background:#8a6a5a;width:100%;max-width:360px;margin-bottom:-6px;border-radius:2px}

/* portraits */
.wall{flex:1;overflow-y:auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:14px;align-content:start;padding:6px 2px 10px}
.wall img{width:100%;border-radius:8px;box-shadow:var(--shadow);display:block}
.wall .empty{grid-column:1/-1;text-align:center;color:var(--sub);padding:30px 10px}
.crop{position:relative;width:260px;height:260px;margin:0 auto 10px;touch-action:none}
.crop canvas{width:260px;height:260px;border-radius:20px;background:#eee}
input[type=range]{width:220px;accent-color:var(--accent)}
.bgs{display:flex;gap:8px;justify-content:center;margin:6px 0 12px;flex-wrap:wrap}
.bgs button{width:44px;height:44px;border-radius:50%;border:3px solid var(--line)}
.bgs button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px #ffd0e4}
#bigimg{max-width:100%;max-height:60vh;border-radius:8px}

.fx{position:fixed;font-size:34px;pointer-events:none;z-index:50;animation:fly 1.6s ease-out forwards}
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 70px);transform:translateX(-50%);background:var(--panel);
  border:2px solid var(--line);border-radius:999px;padding:8px 18px;font-weight:700;z-index:60;box-shadow:var(--shadow);display:none;white-space:nowrap}
</style>
</head>
<body>

<!-- タイトル -->
<section class="screen on" id="title">
  <div class="langs" role="group" aria-label="Language">
    <button type="button" data-lang="ja">にほんご</button>
    <button type="button" data-lang="en">English</button>
  </div>
  <div class="center">
    <div class="title-av" id="titleAv"></div>
    <h1 class="logo" data-t="title"></h1>
    <p data-t="lead" style="margin:0;color:var(--sub);font-size:16px;max-width:340px"></p>
    <button class="big" id="startBtn" data-t="start"></button>
    <button class="big sub" id="resetBtn" data-t="newGame" style="display:none;font-size:15px;min-height:44px;padding:8px 18px"></button>
  </div>
</section>

<!-- だれになる？ -->
<section class="screen" id="rolepick">
  <div class="ttl" data-t="whoAreYou"></div>
  <div class="roles" id="roles"></div>
</section>

<!-- きせかえ -->
<section class="screen" id="closet">
  <div class="stage" id="closetStage"></div>
  <div class="tabs" id="tabs"></div>
  <div class="opts" id="opts"></div>
  <div class="row">
    <button class="big" id="closetDone" data-t="decide"></button>
  </div>
</section>

<!-- おうこく -->
<section class="screen" id="kingdom">
  <div class="topbar">
    <div class="hearts">❤️ <span id="hc">0</span></div>
    <div style="flex:1"></div>
    <button class="icon-btn" id="btnMail" aria-label="mail">📮<span class="lbl" data-t="mail"></span></button>
    <button class="icon-btn" id="btnCloset" aria-label="closet">👗<span class="lbl" data-t="closet"></span></button>
    <button class="icon-btn" id="btnGallery" aria-label="portraits">🖼️<span class="lbl" data-t="gallery"></span></button>
    <button class="icon-btn" id="btnMenu" aria-label="menu">⚙️<span class="lbl" data-t="menu"></span></button>
  </div>
  <div class="prog"><div class="bar"><div class="fill" id="pf"></div></div><div class="nx" id="pn"></div></div>
  <div class="scene-wrap"><svg id="scene" viewBox="0 0 400 600" preserveAspectRatio="xMidYMax meet"></svg></div>
</section>

<!-- ミニゲーム -->
<section class="screen" id="game">
  <div class="ghead">
    <div class="who" id="gWho"></div>
    <div class="say" id="gSay"></div>
    <button class="icon-btn" id="gQuit" aria-label="back">↩️</button>
  </div>
  <div class="garea" id="gArea"></div>
</section>

<!-- しょうぞうがの へや -->
<section class="screen" id="gallery">
  <div class="ttl" data-t="galleryTitle"></div>
  <div class="wall" id="wall"></div>
  <div class="row">
    <button class="big sub" id="galBack" data-t="back"></button>
    <button class="big" id="galNew" data-t="paint"></button>
  </div>
</section>

<div class="ov" id="ov"><div class="card" id="ovCard"></div></div>
<div class="toast" id="toast"></div>
<input type="file" id="fileIn" accept="image/*" hidden>

<script src="../common/kakin.js"></script>
<script>

    menuTitle:"せってい", voiceOn:"🔊 こえ あり", voiceOff:"🔇 こえ なし", toTitle:"タイトルへ", theme:"🌙 あかるさ",

    decos:{flags:"はた", flowers:"おはなばたけ", fountain:"ふんすい", lanterns:"ちょうちん", tower:"たかい とう", rainbow:"にじ", balloon:"ききゅう", gate:"ひがしの もん", pond:"はくちょうの いけ", fireworks:"はなび"},
    kinds:{color:"ふくの いろ", hair:"かみがた", hairColor:"かみの いろ", acc:"かざり", pet:"なかま"},
    items:{
      long:"ロング", bob:"ボブ", short:"ショート", bun:"おだんご", twin:"ツイン", wavy:"ふわふわ",

/* ---------- こえ・おと ---------- */
function speak(txt){
  if(!S || !S.voice || !window.speechSynthesis) return;
  try{
    speechSynthesis.cancel();
    var u=new SpeechSynthesisUtterance(txt.replace(/[\u{1F000}-\u{1FFFF}☀-➿️]/gu,"").replace(/\n/g," "));
    u.lang = LANG==="ja"?"ja-JP":"en-US"; u.rate = LANG==="ja"?1.0:0.95; u.pitch=1.15;
    speechSynthesis.speak(u);
  }catch(e){}
}
/* AI の こえ（日本語）: voice/<キー>.mp3 を WebAudio で ならす。ないときや 英語は ブラウザの よみあげ */
var AC=null, VBUF={}, VSRC=null, VSEQ=0;
function actx(){ if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC && AC.state==="suspended") AC.resume(); return AC; }
function stopVoice(){ VSEQ++; if(VSRC){ try{ VSRC.stop(); }catch(e){} VSRC=null; } if(window.speechSynthesis) try{ speechSynthesis.cancel(); }catch(e){} }
function vbuf(key){
  if(!VBUF[key]) VBUF[key]=fetch("voice/"+key+".mp3?v=1").then(function(r){ if(!r.ok) throw 0; return r.arrayBuffer(); })
    .then(function(b){ return new Promise(function(res,rej){ actx().decodeAudioData(b,res,rej); }); })
    .catch(function(e){ delete VBUF[key]; throw e; });
  return VBUF[key];
}
function voice(key, text){
  if(!S || !S.voice) return;
  stopVoice();
  if(LANG!=="ja" || !actx()){ speak(text); return; }
  var my=VSEQ;
  vbuf(key).then(function(b){ if(my!==VSEQ) return; var src=AC.createBufferSource(); src.buffer=b; src.connect(AC.destination); src.start(); VSRC=src; })
    .catch(function(){ if(my===VSEQ) speak(text); });
}
function tone(f,d,type,when,vol){
  try{
    if(!actx()) return;
    var t=AC.currentTime+(when||0), o=AC.createOscillator(), g=AC.createGain();
    o.type=type||"sine"; o.frequency.value=f; g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol||0.18,t+0.02); g.gain.exponentialRampToValueAtTime(0.0001,t+d);
    o.connect(g); g.connect(AC.destination); o.start(t); o.stop(t+d+0.05);
  }catch(e){}
}
function sfx(k){
  if(k==="tap") tone(880,.12,"triangle");
  else if(k==="ok"){ tone(784,.15,"triangle"); tone(1175,.2,"triangle",.09); }
  else if(k==="no"){ tone(330,.18,"sine"); tone(262,.22,"sine",.12); }
  else if(k==="win"){ [523,659,784,1047].forEach(function(f,i){ tone(f,.25,"triangle",i*.11); }); }
  else if(k==="deco"){ [784,988,1175,1568,1319,1568].forEach(function(f,i){ tone(f,.3,"triangle",i*.1,.15); }); }
}

/* ---------- いろ ---------- */
function mix(hex,amt){ // amt<0 で くらく、>0 で あかるく
  var n=parseInt(hex.slice(1),16), r=n>>16, g=(n>>8)&255, b=n&255, t=amt<0?0:255, a=Math.abs(amt);
  r=Math.round(r+(t-r)*a); g=Math.round(g+(t-g)*a); b=Math.round(b+(t-b)*a);
  return "#"+((1<<24)|(r<<16)|(g<<8)|b).toString(16).slice(1);
}

function esc(s){ return String(s).replace(/[&<>"]/g,function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; }); }
function shuffle(a){ for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)), t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function toast(t){ var e=$("#toast"); e.textContent=t; e.style.display="block"; clearTimeout(toast.t); toast.t=setTimeout(function(){ e.style.display="none"; },2200); }

  for(var i=0;i<(n||14);i++){ (function(i){ setTimeout(function(){

$("#fileIn").onchange=function(){
  var f=this.files&&this.files[0]; if(!f) return;
  var url=URL.createObjectURL(f), img=new Image();
  img.onload=function(){ cropFace(img, function(){ URL.revokeObjectURL(url); }); };

};
function cropFace(img, done){
  var c=dialog('<button class="x">×</button><p class="note" style="margin-top:20px">'+esc(T().photoDrag)+'</p><div class="crop"><canvas id="cc" width="520" height="520"></canvas></div>'+
    '<div style="margin-bottom:12px">🔍 <input type="range" id="cz" min="1" max="4" step="0.01" value="1"></div><div class="btns"><button class="big" id="cOk">'+esc(T().photoUse)+'</button></div>', done);
  var cv=c.querySelector("#cc"), ctx=cv.getContext("2d"), z=c.querySelector("#cz");
  var base=Math.max(520/img.width, 520/img.height), sc=1, ox=0, oy=0;
  function draw(target, size){
    var k=size/520, s=base*sc*k, w=img.width*s, h=img.height*s;
    target.drawImage(img, size/2-w/2+ox*k, size/2-h/2+oy*k, w, h);
  }
  function paint(){
    ctx.clearRect(0,0,520,520); draw(ctx,520);
    ctx.save(); ctx.fillStyle="rgba(0,0,0,.5)"; ctx.beginPath(); ctx.rect(0,0,520,520); ctx.arc(260,260,200,0,Math.PI*2,true); ctx.fill("evenodd");
    ctx.strokeStyle="#fff"; ctx.lineWidth=5; ctx.beginPath(); ctx.arc(260,260,200,0,Math.PI*2); ctx.stroke(); ctx.restore();
  }
  var drag=null;
  cv.onpointerdown=function(e){ drag={x:e.clientX,y:e.clientY,ox:ox,oy:oy}; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove=function(e){ if(!drag) return; ox=drag.ox+(e.clientX-drag.x)*2; oy=drag.oy+(e.clientY-drag.y)*2; paint(); };
  cv.onpointerup=cv.onpointercancel=function(){ drag=null; };
  z.oninput=function(){ sc=+z.value; paint(); };
  c.querySelector("#cOk").onclick=function(){
    var o=document.createElement("canvas"); o.width=o.height=200; var x=o.getContext("2d");
    // まるの なか（はば 400/520）を 200px に
    x.translate(100,100); x.scale(520/400,520/400); x.translate(-100,-100); draw(x,200);
    FACE=o.toDataURL("image/jpeg",0.85);
    if(!lsSet(FACE_KEY,FACE)) toast(T().storeFull);
    closeDialog(); done&&done(); sfx("ok"); renderCloset();
  };
  paint();
}

    var c2=dialog('<p class="say">'+esc(T().delAsk)+'</p><div class="btns"><button class="big sub" id="dN">'+T().no+'</button><button class="big" id="dY">'+T().yes+'</button></div>');
    c2.querySelector("#dN").onclick=function(){ viewPortrait(idx); };
    c2.querySelector("#dY").onclick=function(){ var a=getPorts(); a.splice(idx,1); setPorts(a); if(!a.length) lsDel(PORT_KEY); closeDialog(); renderGallery(); };
  };
}
$("#galBack").onclick=function(){ sfx("tap"); enterKingdom(); };
var BGS=[["#ffd6e7","#ff9ec6"],["#d6ecff","#7cc4f2"],["#e7ffd6","#8fd38a"],["#efe1ff","#b48cf0"],["#fff1c9","#f5c142"],["#2d2b4a","#7b6bd6"]];
$("#galNew").onclick=function(){
  sfx("tap"); var sel=0;
  function bgBtns(){ return BGS.map(function(b,i){ return '<button data-bg="'+i+'" aria-pressed="'+(i===sel)+'" style="background:linear-gradient('+b[0]+','+b[1]+')"></button>'; }).join(""); }
  var c=dialog('<button class="x">×</button><p class="say">'+esc(T().paintTitle)+'</p><div class="bgs">'+bgBtns()+'</div><div class="btns"><button class="big" id="pGo">🎨 '+esc(T().paintGo)+'</button></div>');
  c.querySelector(".bgs").onclick=function(e){ var b=e.target.closest("[data-bg]"); if(!b) return; sel=+b.dataset.bg; c.querySelectorAll("[data-bg]").forEach(function(x){ x.setAttribute("aria-pressed",String(+x.dataset.bg===sel)); }); };
  c.querySelector("#pGo").onclick=function(){ this.disabled=true; paintPortrait(BGS[sel], function(img){
    closeDialog();
    if(!img) return;
    var a=getPorts(); a.push({img:img, d:Date.now()}); if(a.length>12) a.shift();
    if(!setPorts(a)) toast(T().storeFull);
    sfx("win"); confetti(16,["🎨","✨","💖","⭐"]); renderGallery(); viewPortrait(getPorts().length-1);
  }); };
};
function svgImg(svg){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){ res(i); }; i.onerror=rej; i.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(svg); }); }
function paintPortrait(bg, cb){
  var W=480, H=640, cv=document.createElement("canvas"); cv.width=W; cv.height=H; var x=cv.getContext("2d");
  // がくぶち
  var gd=x.createLinearGradient(0,0,W,H); gd.addColorStop(0,"#f7d774"); gd.addColorStop(.5,"#c9952a"); gd.addColorStop(1,"#f7d774");
  x.fillStyle=gd; x.fillRect(0,0,W,H);
  x.fillStyle="#a8781e"; x.fillRect(26,26,W-52,H-52);
  var bgG=x.createLinearGradient(0,34,0,H-34); bgG.addColorStop(0,bg[0]); bgG.addColorStop(1,bg[1]);
  x.fillStyle=bgG; x.fillRect(34,34,W-68,H-68);
  // ひかり
  x.save(); x.globalAlpha=.25; x.fillStyle="#fff"; for(var i=0;i<12;i++){ x.beginPath(); x.moveTo(W/2,250); var a1=i*Math.PI/6, a2=a1+.18; x.lineTo(W/2+500*Math.cos(a1),250+500*Math.sin(a1)); x.lineTo(W/2+500*Math.cos(a2),250+500*Math.sin(a2)); x.fill(); } x.restore();
  x.save(); x.beginPath(); x.rect(34,34,W-68,H-68); x.clip();
  var ax=60, ay=70, aw=360, ah=504, k=aw/200;
  var face=FACE;
  Promise.all([svgImg(avatarSVG(S.look,S.role,{layer:face?"base":"all", face:face})), face?svgImg(avatarSVG(S.look,S.role,{layer:"top", face:face})):null,
    face?new Promise(function(r){ var i=new Image(); i.onload=function(){ r(i); }; i.onerror=function(){ r(null); }; i.src=face; }):null])
  .then(function(L){
    x.drawImage(L[0],ax,ay,aw,ah);
    if(L[2]){ x.save(); x.beginPath(); x.arc(ax+100*k, ay+80*k, 38*k, 0, Math.PI*2); x.clip(); x.drawImage(L[2], ax+62*k, ay+42*k, 76*k, 76*k); x.restore(); }
    if(L[1]) x.drawImage(L[1],ax,ay,aw,ah);
    if(S.look.pet && S.look.pet!=="none"){ x.font="76px sans-serif"; x.textAlign="center"; x.fillText(PETS[S.look.pet], 390, 560); }
    x.restore();
    // なふだ
    x.fillStyle="#fff8e6"; x.strokeStyle="#c9952a"; x.lineWidth=4;
    var py=H-96; roundRect(x, 90, py, W-180, 52, 14); x.fill(); x.stroke();
    x.fillStyle="#6a4a1e"; x.textAlign="center"; x.font='bold 24px "Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif';
    x.fillText(titleOf(), W/2, py+26); x.font='14px "Hiragino Maru Gothic ProN","Noto Sans JP",sans-serif';
    var d=new Date(); x.fillText(d.getFullYear()+"."+(d.getMonth()+1)+"."+d.getDate()+"  "+T().title, W/2, py+44);
    try{ cb(cv.toDataURL("image/jpeg",0.82)); }catch(e){ cb(null); toast("⚠️"); }
  }).catch(function(){ x.restore(); cb(null); toast("⚠️"); });
}
function roundRect(x,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }

/* ---------- はじまり ---------- */
S=load();
renderTitle();
document.addEventListener("pointerdown",function(){ actx(); },{passive:true});
</script>
