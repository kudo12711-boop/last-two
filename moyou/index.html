<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>もよう・背景メーカー</title>
<meta name="description" content="AIを使わず、プログラムで描く背景と模様。無料で何枚でも作れて、保存した画像は自由に使えます。">
<style>
:root {
  --bg: #f6f4ef; --panel: #ffffff; --ink: #24262b; --sub: #6b6f78; --line: #e3dfd6;
  --accent: #3a6df0; --accent-ink: #ffffff; --chip: #f1eee7; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.05);
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #17181c; --panel: #212329; --ink: #eceef2; --sub: #9aa0ab; --line: #33363e; --accent: #7a9bff; --accent-ink: #10131a; --chip: #2a2d34; --shadow: none; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif; -webkit-text-size-adjust: 100%; }
body { padding: 0 16px 40px; }
header { max-width: 1180px; margin: 0 auto; display: flex; align-items: center; gap: 12px; padding: 14px 0 10px; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .02em; }
header .tag { font-size: 12px; color: var(--sub); }
header .sp { flex: 1; }
button, select, input { font: inherit; color: inherit; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 10px; padding: 8px 12px; cursor: pointer; min-height: 40px; }
.btn:hover { border-color: var(--sub); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }
.btn:disabled { opacity: .5; cursor: default; }
main { max-width: 1180px; margin: 0 auto; display: grid; grid-template-columns: minmax(0, 1fr) 360px; gap: 18px; align-items: start; }
@media (max-width: 860px) { main { grid-template-columns: minmax(0, 1fr); } }
.stage { position: sticky; top: 8px; background: var(--panel); border-radius: 16px; box-shadow: var(--shadow); border: 1px solid var(--line); padding: 12px; }
@media (max-width: 860px) { .stage { position: relative; top: 0; } }
.frame { display: flex; justify-content: center; align-items: center; min-height: 200px; background: repeating-conic-gradient(var(--chip) 0 25%, transparent 0 50%) 0 0 / 20px 20px; border-radius: 10px; overflow: hidden; }
#view { display: block; max-width: 100%; border-radius: 4px; box-shadow: 0 2px 10px rgba(0,0,0,.15); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.bar .grow { flex: 1; }
.info { font-size: 12px; color: var(--sub); }
.panel { background: var(--panel); border-radius: 16px; border: 1px solid var(--line); box-shadow: var(--shadow); padding: 14px; display: grid; gap: 16px; }
.sec h2 { font-size: 13px; color: var(--sub); margin: 0 0 8px; font-weight: 600; }
.types { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.type { border: 2px solid transparent; background: var(--chip); border-radius: 10px; padding: 4px; cursor: pointer; text-align: center; font-size: 12px; }
.type canvas { width: 100%; aspect-ratio: 3 / 2; display: block; border-radius: 6px; margin-bottom: 3px; }
.type[aria-pressed="true"] { border-color: var(--accent); }
.pals { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.pal { border: 2px solid transparent; background: var(--chip); border-radius: 9px; padding: 4px; cursor: pointer; font-size: 11px; }
.pal .sw { display: flex; height: 18px; border-radius: 5px; overflow: hidden; margin-bottom: 2px; }
.pal .sw i { flex: 1; }
.pal[aria-pressed="true"] { border-color: var(--accent); }
.colors { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
.colors input[type=color] { width: 40px; height: 40px; border: 1px solid var(--line); border-radius: 8px; padding: 2px; background: var(--panel); cursor: pointer; }
.row { display: grid; grid-template-columns: 96px 1fr 36px; gap: 8px; align-items: center; font-size: 13px; margin: 4px 0; }
.row output { font-size: 12px; color: var(--sub); text-align: right; }
input[type=range] { width: 100%; accent-color: var(--accent); }
.check { display: flex; gap: 8px; align-items: center; font-size: 13px; margin-top: 6px; }
.check input { width: 20px; height: 20px; accent-color: var(--accent); }
select { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px; width: 100%; min-height: 40px; }
.sizes { display: grid; grid-template-columns: 1fr auto 1fr; gap: 6px; align-items: center; margin-top: 6px; }
.sizes input { width: 100%; border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 8px; min-height: 40px; }
.hidden { display: none !important; }
.note { font-size: 12px; color: var(--sub); line-height: 1.6; max-width: 1180px; margin: 18px auto 0; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 999px; font-size: 14px; opacity: 0; transition: opacity .2s; pointer-events: none; z-index: 9; }
.toast.on { opacity: 1; }
.lang { white-space: nowrap; min-height: 34px; padding: 4px 10px; font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1 data-t="title">もよう・背景メーカー</h1>
    <div class="tag" data-t="tag">AIなし・画像ファイルなし。プログラムが その場で描きます</div>
  </div>
  <div class="sp"></div>
  <button class="btn lang" id="lang">English</button>
</header>

<main>
  <section class="stage">
    <div class="frame" id="frame"><canvas id="view" width="600" height="400" aria-label="preview"></canvas></div>
    <div class="bar">
      <button class="btn" id="prev" data-t="prev" title="">↶ もどる</button>
      <button class="btn" id="dice" data-t="dice">🎲 べつの形</button>
      <span class="grow"></span>
      <button class="btn" id="copy" data-t="copy">コピー</button>
      <button class="btn primary" id="save" data-t="save">画像を保存</button>
    </div>
    <div class="bar">
      <span class="info" id="info"></span>
      <span class="grow"></span>
      <button class="btn" id="link" data-t="link" style="min-height:32px;padding:4px 10px;font-size:12px">設定のリンクをコピー</button>
    </div>
  </section>

  <section class="panel">
    <div class="sec">
      <h2 data-t="h_type">しゅるい</h2>
      <div class="types" id="types"></div>
    </div>

    <div class="sec" id="secPal">
      <h2 data-t="h_pal">いろ</h2>
      <div class="pals" id="pals"></div>
      <div class="colors" id="colors"></div>
    </div>

    <div class="sec" id="secSky">
      <h2 data-t="h_sky">そらの せってい</h2>
      <div class="row"><span data-t="hour">時刻</span><input type="range" id="hour" min="0" max="23.75" step="0.25"><output id="hourOut"></output></div>
      <div class="row"><span data-t="weather">天気</span><select id="weather" style="grid-column: span 2"></select></div>
      <div class="row"><span data-t="land">けしき</span><select id="land" style="grid-column: span 2"></select></div>
    </div>

    <div class="sec" id="secAdj">
      <h2 data-t="h_adj">ちょうせい</h2>
      <div class="row"><span data-t="density">こさ・数</span><input type="range" id="density" min="0" max="100"><output></output></div>
      <div class="row"><span data-t="scale">大きさ</span><input type="range" id="scale" min="0" max="100"><output></output></div>
      <div class="row"><span data-t="soft">やわらかさ</span><input type="range" id="soft" min="0" max="100"><output></output></div>
      <div class="row"><span data-t="grain">ざらざら</span><input type="range" id="grain" min="0" max="100"><output></output></div>
      <label class="check" id="tileWrap"><input type="checkbox" id="tile"><span data-t="tile">つなぎ目なし（ならべても切れ目が出ない）</span></label>
      <label class="check" id="tileViewWrap"><input type="checkbox" id="tileView"><span data-t="tileView">4まい ならべて 見る</span></label>
    </div>

    <div class="sec">
      <h2 data-t="h_size">保存する大きさ</h2>
      <select id="size"></select>
      <div class="sizes" id="custom">
        <input type="number" id="cw" min="16" max="8000" inputmode="numeric" aria-label="width">
        <span>×</span>
        <input type="number" id="ch" min="16" max="8000" inputmode="numeric" aria-label="height">
      </div>
    </div>
  </section>
</main>

<p class="note" data-t="note">保存した画像は、SNS・チラシ・資料・商品など、商用でも自由に使えます。AI を使わずに描いているので、ほかの人の作品をまねた絵が まざる心配もありません。作業は すべてこの端末の中で行われ、どこにも送られません。</p>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
(function () {
  'use strict';
  var B = window.Backdrop;
  var T = {
    ja: {
      title: 'もよう・背景メーカー', tag: 'AIなし・画像ファイルなし。プログラムが その場で描きます', prev: '↶ もどる', dice: '🎲 べつの形',
      copy: 'コピー', save: '画像を保存', link: '設定のリンクをコピー', h_type: 'しゅるい', h_pal: 'いろ', h_sky: 'そらの せってい',
      hour: '時刻', weather: '天気', land: 'けしき', h_adj: 'ちょうせい', density: 'こさ・数', scale: '大きさ', soft: 'やわらかさ', grain: 'ざらざら',
      tile: 'つなぎ目なし（ならべても切れ目が出ない）', tileView: '4まい ならべて 見る', h_size: '保存する大きさ',
      note: '保存した画像は、SNS・チラシ・資料・商品など、商用でも自由に使えます。AI を使わずに描いているので、ほかの人の作品をまねた絵が まざる心配もありません。作業は すべてこの端末の中で行われ、どこにも送られません。',
      saved: '保存しました', copied: 'コピーしました。貼りつけて使えます', linkCopied: 'リンクをコピーしました', noCopy: 'この端末では画像のコピーが使えません。保存してください',
      making: 'つくっています…', w: { clear: 'はれ', cloudy: 'くもり', rain: 'あめ', snow: 'ゆき', fog: 'きり', storm: 'あらし' },
      l: { mountains: 'やま', sea: 'うみ', hills: 'おか', city: 'まち', none: 'そらだけ' },
      sizes: { insta: 'Instagram 正方形', story: 'ストーリー・リール', xhead: 'X（Twitter）ヘッダー', yt: 'YouTube サムネイル', pc: 'パソコンの壁紙（フルHD）', pc4k: 'パソコンの壁紙（4K）', phone: 'この画面の壁紙', a4: 'A4 印刷（よこ・300dpi）', a4p: 'A4 印刷（たて・300dpi）', slide: 'スライド 16:9', custom: '自分で決める' },
      lang: 'English'
    },
    en: {
      title: 'Backdrop Maker', tag: 'No AI, no image files. Drawn by code, right on your device', prev: '↶ Back', dice: '🎲 Shuffle',
      copy: 'Copy', save: 'Save image', link: 'Copy settings link', h_type: 'Style', h_pal: 'Colors', h_sky: 'Sky settings',
      hour: 'Time', weather: 'Weather', land: 'Scenery', h_adj: 'Adjust', density: 'Amount', scale: 'Size', soft: 'Softness', grain: 'Grain',
      tile: 'Seamless (tiles without visible edges)', tileView: 'Preview as 2×2 tiles', h_size: 'Export size',
      note: 'Images you save are free to use, including commercially: social posts, flyers, slides, products. They are drawn by code, not AI, so there is no risk of copied artwork slipping in. Everything happens on your device and nothing is uploaded.',
      saved: 'Saved', copied: 'Copied. Paste it anywhere', linkCopied: 'Link copied', noCopy: 'Image copy is not supported here. Please save instead.',
      making: 'Rendering…', w: { clear: 'Clear', cloudy: 'Cloudy', rain: 'Rain', snow: 'Snow', fog: 'Fog', storm: 'Storm' },
      l: { mountains: 'Mountains', sea: 'Sea', hills: 'Hills', city: 'City', none: 'Sky only' },
      sizes: { insta: 'Instagram square', story: 'Story / Reel', xhead: 'X (Twitter) header', yt: 'YouTube thumbnail', pc: 'Desktop wallpaper (Full HD)', pc4k: 'Desktop wallpaper (4K)', phone: 'Wallpaper for this screen', a4: 'A4 print (landscape, 300dpi)', a4p: 'A4 print (portrait, 300dpi)', slide: 'Slide 16:9', custom: 'Custom' },
      lang: '日本語'
    }
  };
  var q = new URLSearchParams(location.search);
  var lang = q.get('lang') || (/^ja/i.test(navigator.language || '') ? 'ja' : 'en');
  if (lang !== 'ja') lang = 'en';

  var dpr = Math.min(2, window.devicePixelRatio || 1);
  var SIZES = [
    ['insta', 1080, 1080], ['story', 1080, 1920], ['xhead', 1500, 500], ['yt', 1280, 720], ['slide', 1920, 1080],
    ['pc', 1920, 1080], ['pc4k', 3840, 2160], ['phone', Math.round(screen.width * (window.devicePixelRatio || 1)), Math.round(screen.height * (window.devicePixelRatio || 1))],
    ['a4', 3508, 2480], ['a4p', 2480, 3508], ['custom', 1600, 1000]
  ];

  var st = { type: 'waves', pal: 'umi', palette: B.PALETTES[1].c.slice(), seed: 20261112, density: 50, scale: 50, soft: 40, grain: 0, tile: false, tileView: false,
    size: 'insta', W: 1080, H: 1080, hour: new Date().getHours() + Math.floor(new Date().getMinutes() / 15) / 4, weather: 'clear', land: 'mountains' };
  var undo = [];

  // ---- URL に保存した設定を読む ----
  function readHash() {
    var h = new URLSearchParams(location.hash.slice(1));
    if (!h.get('t')) return;
    var get = function (k, d) { var v = h.get(k); return v == null ? d : v; };
    st.type = get('t', st.type);
    var p = get('p', ''); if (p) { st.palette = p.split('-').map(function (c) { return '#' + c; }); st.pal = ''; }
    st.seed = +get('s', st.seed); st.density = +get('d', st.density); st.scale = +get('z', st.scale); st.soft = +get('f', st.soft); st.grain = +get('g', st.grain);
    st.tile = get('tl', '0') === '1'; st.size = get('sz', st.size); st.W = +get('W', st.W); st.H = +get('H', st.H);
    st.hour = +get('hr', st.hour); st.weather = get('wx', st.weather); st.land = get('ld', st.land);
  }
  function hashOf() {
    var h = new URLSearchParams();
    h.set('t', st.type); h.set('p', st.palette.map(function (c) { return c.slice(1); }).join('-')); h.set('s', st.seed);
    h.set('d', st.density); h.set('z', st.scale); h.set('f', st.soft); h.set('g', st.grain); h.set('tl', st.tile ? 1 : 0);
    h.set('sz', st.size); h.set('W', st.W); h.set('H', st.H);
    if (st.type === 'sky') { h.set('hr', st.hour); h.set('wx', st.weather); h.set('ld', st.land); }
    return h.toString();
  }
  readHash();

  function opts(extra) {
    var o = { type: st.type, palette: st.palette, seed: st.seed, density: st.density / 100, scale: st.scale / 100, soft: st.soft / 100,
      grain: st.grain / 100, tile: st.tile, hour: st.hour, weather: st.weather, land: st.land };
    for (var k in extra) o[k] = extra[k];
    return o;
  }
  function typeDef(id) { return B.TYPES.filter(function (t) { return t.id === id; })[0]; }

  // ---- 画面 ----
  var $ = function (id) { return document.getElementById(id); };
  var view = $('view'), frame = $('frame');

  function texts() {
    var L = T[lang];
    document.documentElement.lang = lang;
    document.title = L.title;
    document.querySelectorAll('[data-t]').forEach(function (el) { var k = el.getAttribute('data-t'); if (L[k]) el.textContent = L[k]; });
    $('lang').textContent = L.lang;
    var sel = $('size'); sel.innerHTML = '';
    SIZES.forEach(function (s) { var op = document.createElement('option'); op.value = s[0]; op.textContent = L.sizes[s[0]] + (s[0] === 'custom' ? '' : '  ' + s[1] + '×' + s[2]); sel.appendChild(op); });
    sel.value = st.size;
    var ws = $('weather'); ws.innerHTML = '';
    Object.keys(L.w).forEach(function (k) { var op = document.createElement('option'); op.value = k; op.textContent = L.w[k]; ws.appendChild(op); });
    ws.value = st.weather;
    var ls = $('land'); ls.innerHTML = '';
    Object.keys(L.l).forEach(function (k) { var op = document.createElement('option'); op.value = k; op.textContent = L.l[k]; ls.appendChild(op); });
    ls.value = st.land;
    buildTypes(); buildPals();
  }

  var thumbs = [];
  function buildTypes() {
    var box = $('types'); box.innerHTML = ''; thumbs = [];
    B.TYPES.forEach(function (t) {
      var b = document.createElement('button'); b.className = 'type'; b.setAttribute('aria-pressed', t.id === st.type);
      var c = document.createElement('canvas'); c.width = 150; c.height = 100;
      b.appendChild(c); b.appendChild(document.createTextNode(t[lang]));
      b.onclick = function () {
        pushHistory();
        st.type = t.id;
        if (t.tile === '' ) st.tile = false;
        update(true);
      };
      box.appendChild(b); thumbs.push([t, c, b]);
    });
    drawThumbs();
  }
  var thumbTimer = 0;
  function drawThumbs() {
    clearTimeout(thumbTimer);
    thumbTimer = setTimeout(function () {
      thumbs.forEach(function (x) {
        x[2].setAttribute('aria-pressed', x[0].id === st.type);
        B.render(x[1], opts({ type: x[0].id, tile: false, grain: 0 }));
      });
    }, 60);
  }
  function buildPals() {
    var box = $('pals'); box.innerHTML = '';
    B.PALETTES.forEach(function (p) {
      var b = document.createElement('button'); b.className = 'pal'; b.setAttribute('aria-pressed', p.id === st.pal);
      var sw = document.createElement('div'); sw.className = 'sw';
      p.c.forEach(function (c) { var i = document.createElement('i'); i.style.background = c; sw.appendChild(i); });
      b.appendChild(sw); b.appendChild(document.createTextNode(p[lang]));
      b.onclick = function () { pushHistory(); st.pal = p.id; st.palette = p.c.slice(); update(true); };
      box.appendChild(b);
    });
    var cb = $('colors'); cb.innerHTML = '';
    st.palette.forEach(function (c, i) {
      var inp = document.createElement('input'); inp.type = 'color'; inp.value = c; inp.title = (lang === 'ja' ? '色 ' : 'Color ') + (i + 1);
      inp.oninput = function () { st.palette[i] = inp.value; st.pal = ''; markPals(); update(false); drawThumbs(); };
      cb.appendChild(inp);
    });
  }
  function markPals() {
    var bs = $('pals').children;
    B.PALETTES.forEach(function (p, i) { bs[i].setAttribute('aria-pressed', p.id === st.pal); });
  }

  function exportSize() {
    if (st.size === 'custom') return [clampN(st.W), clampN(st.H)];
    var s = SIZES.filter(function (x) { return x[0] === st.size; })[0] || SIZES[0];
    return [s[1], s[2]];
  }
  function clampN(v) { v = Math.round(+v || 0); return Math.max(16, Math.min(8000, v)); }

  var raf = 0;
  function update(full) {
    if (full) { buildPals(); drawThumbs(); }
    var td = typeDef(st.type);
    $('secSky').classList.toggle('hidden', st.type !== 'sky');
    $('secPal').classList.toggle('hidden', st.type === 'sky');
    $('tileWrap').classList.toggle('hidden', !td.tile);
    $('tileViewWrap').classList.toggle('hidden', !td.tile || !st.tile);
    $('tile').checked = st.tile; $('tileView').checked = st.tileView;
    ['density', 'scale', 'soft', 'grain'].forEach(function (k) { var el = $(k); el.value = st[k]; el.nextElementSibling.textContent = st[k]; });
    $('hour').value = st.hour; $('hourOut').textContent = fmtHour(st.hour);
    $('weather').value = st.weather; $('land').value = st.land;
    $('custom').classList.toggle('hidden', st.size !== 'custom');
    $('cw').value = st.W; $('ch').value = st.H;
    $('prev').disabled = !undo.length;
    cancelAnimationFrame(raf);
    raf = requestAnimationFrame(drawView);
    try { history.replaceState(null, '', '#' + hashOf()); } catch (e) {}
  }
  function fmtHour(h) { var m = Math.round((h % 1) * 60); return Math.floor(h) + ':' + (m < 10 ? '0' : '') + m; }

  var off = document.createElement('canvas');
  function drawView() {
    var sz = exportSize(), aw = sz[0], ah = sz[1];
    var maxW = frame.clientWidth - 2, maxH = Math.max(220, Math.min(window.innerHeight * (window.innerWidth < 860 ? 0.5 : 0.75), 900));
    var k = Math.min(maxW / aw, maxH / ah), cw = Math.max(40, Math.floor(aw * k)), ch = Math.max(40, Math.floor(ah * k));
    view.style.width = cw + 'px'; view.style.height = ch + 'px';
    view.width = Math.round(cw * dpr); view.height = Math.round(ch * dpr);
    var tv = st.tile && st.tileView && typeDef(st.type).tile;
    if (tv) {
      off.width = Math.round(view.width / 2); off.height = Math.round(view.height / 2);
      B.render(off, opts());
      var c = view.getContext('2d');
      for (var i = 0; i < 2; i++) for (var j = 0; j < 2; j++) c.drawImage(off, i * off.width, j * off.height);
    } else {
      B.render(view, opts());
    }
    $('info').textContent = aw + ' × ' + ah + ' px';
  }

  function pushHistory() {
    undo.push(JSON.stringify({ type: st.type, pal: st.pal, palette: st.palette, seed: st.seed, density: st.density, scale: st.scale, soft: st.soft, grain: st.grain, tile: st.tile }));
    if (undo.length > 50) undo.shift();
  }

  // ---- 入力 ----
  ['density', 'scale', 'soft', 'grain'].forEach(function (k) {
    $(k).addEventListener('input', function (e) { st[k] = +e.target.value; update(false); });
    $(k).addEventListener('change', drawThumbs);
  });
  $('tile').onchange = function (e) { st.tile = e.target.checked; update(false); };
  $('tileView').onchange = function (e) { st.tileView = e.target.checked; update(false); };
  $('hour').oninput = function (e) { st.hour = +e.target.value; update(false); };
  $('hour').onchange = drawThumbs;
  $('weather').onchange = function (e) { st.weather = e.target.value; update(false); drawThumbs(); };
  $('land').onchange = function (e) { st.land = e.target.value; update(false); drawThumbs(); };
  $('size').onchange = function (e) { st.size = e.target.value; update(false); };
  $('cw').onchange = function (e) { st.W = clampN(e.target.value); update(false); };
  $('ch').onchange = function (e) { st.H = clampN(e.target.value); update(false); };
  $('dice').onclick = function () { pushHistory(); st.seed = Math.floor(Math.random() * 1e9); update(false); drawThumbs(); };
  $('prev').onclick = function () {
    var s = undo.pop(); if (!s) return;
    var o = JSON.parse(s); for (var k in o) st[k] = o[k];
    update(true);
  };
  $('lang').onclick = function () { lang = lang === 'ja' ? 'en' : 'ja'; texts(); update(false); };
  window.addEventListener('resize', function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(drawView); });

  function toast(msg) { var t = $('toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toast.t); toast.t = setTimeout(function () { t.classList.remove('on'); }, 2200); }

  function renderFull(cb) {
    var sz = exportSize(), c = document.createElement('canvas');
    c.width = sz[0]; c.height = sz[1];
    toast(T[lang].making);
    setTimeout(function () { B.render(c, opts()); c.toBlob(function (b) { cb(b, c); }, 'image/png'); }, 30);
  }
  function fileName() {
    var sz = exportSize();
    return 'backdrop-' + st.type + '-' + st.seed + '-' + sz[0] + 'x' + sz[1] + '.png';
  }
  $('save').onclick = function () {
    renderFull(function (blob) {
      if (!blob) return;
      var url = URL.createObjectURL(blob), a = document.createElement('a');
      a.href = url; a.download = fileName(); document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(url); }, 4000);
      toast(T[lang].saved);
    });
  };
  $('copy').onclick = function () {
    if (!(navigator.clipboard && window.ClipboardItem)) { toast(T[lang].noCopy); return; }
    // Safari は クリックの その場で write を呼ぶ必要があるため、Promise を渡す
    var p = new Promise(function (res) { renderFull(function (b) { res(b); }); });
    navigator.clipboard.write([new ClipboardItem({ 'image/png': p })]).then(function () { toast(T[lang].copied); }, function () { toast(T[lang].noCopy); });
  };
  $('link').onclick = function () {
    var u = location.origin + location.pathname + (lang === 'en' ? '?lang=en' : '') + '#' + hashOf();
    (navigator.clipboard ? navigator.clipboard.writeText(u) : Promise.reject()).then(function () { toast(T[lang].linkCopied); }, function () { prompt('URL', u); });
  };

  texts();
  update(true);
})();
</script>
</body>
</html>
