<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6b4a33">
<title>キャンピングカー世界一周</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚐%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* キャンピングカーの車内：クリーム色の壁と木の窓わく。船の上では白い船の窓わくに変わる */
:root{
  --wall:#f4ead9; --wall2:#eadcc4; --wood:#8a5b3c; --wood2:#6b4a33; --ink:#3a2c22; --ink2:#7a6655;
  --accent:#e8743b; --accent2:#fff1e6; --sea:#2f7fb0; --card:#fffaf2; --line:#e2d3bc;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.018) 0 2px,transparent 2px 46px)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:grid;grid-template-columns:minmax(0,1fr);grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:flex-end;gap:10px;padding:10px 16px 4px}
header .l{flex:1;min-width:0;cursor:pointer}
#place::after{content:" ⓘ";font-size:.6em;color:var(--accent);vertical-align:middle}
#place{font-size:clamp(18px,5vw,26px);font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#addr{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
header .r{text-align:right;white-space:nowrap}
#clock{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
#wx{font-size:clamp(17px,4.6vw,22px);font-weight:900}
#wx small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
/* 窓 */
#winwrap{position:relative;min-height:0;padding:6px 12px 22px}
#winwrap{--fr:#8a5b3c;--fr2:#6b4a33;--bw:10px;--c1:#c9543e;--c2:#b2412f;--c3:#d8664c;--tie:#e8c27a;--rad:28px;--s1:#9a6a48;--s2:#7a5236}
/* 窓のデザイン */
#winwrap.f-white{--fr:#f6f3ec;--fr2:#cfc6b6;--c1:#f1e9da;--c2:#e2d6c0;--c3:#f8f2e6;--tie:#b9a37a;--s1:#f3efe6;--s2:#d6cdbd;--rad:20px}
#winwrap.f-retro{--fr:#e0782f;--fr2:#a8521c;--c1:#f2c14e;--c2:#e39a35;--c3:#f7d77a;--tie:#7a4a20;--s1:#e9a23b;--s2:#b8721c;--rad:56px}
#winwrap.f-log{--fr:#5a3b26;--fr2:#2f1e12;--bw:16px;--c1:#3f7a4f;--c2:#2a5236;--c3:#5a9a6a;--tie:#c8a060;--s1:#6a4a30;--s2:#4a3220;--rad:12px}
#winwrap.f-round{--fr:#c9a35a;--fr2:#7a5c22;--bw:14px;--rad:50%;--s1:#b08a44;--s2:#7a5c22}
#winwrap.f-shoji{--fr:#b88a5a;--fr2:#7a5634;--rad:4px;--s1:#b88a5a;--s2:#8a6440}
#win{position:relative;height:100%;border-radius:var(--rad);overflow:hidden;background:#89b;
  box-shadow:0 0 0 var(--bw) var(--fr),0 0 0 calc(var(--bw) + 3px) var(--fr2),0 10px 26px 12px rgba(60,40,20,.35);
  margin:calc(var(--bw) + 2px)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#win::after{content:"";position:absolute;inset:0;border-radius:var(--rad);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 8px 18px rgba(0,0,0,.25);pointer-events:none}
.curtain{position:absolute;top:0;bottom:0;width:11%;max-width:70px;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,var(--c1) 0 8px,var(--c2) 8px 12px,var(--c3) 12px 20px);
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25);clip-path:polygon(0 0,100% 0,60% 45%,85% 52%,100% 100%,0 100%)}
.f-retro .curtain{background:repeating-conic-gradient(var(--c1) 0 25%,var(--c3) 0 50%) 0 0/16px 16px}
.f-log .curtain{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 4px,transparent 4px 14px),repeating-linear-gradient(0deg,var(--c2) 0 5px,var(--c1) 5px 14px)}
.f-round .curtain{display:none}
.f-shoji .curtain{width:13%;max-width:80px;clip-path:none;box-shadow:inset -3px 0 6px rgba(0,0,0,.2),0 0 0 3px var(--fr);
  background:linear-gradient(90deg,var(--fr) 0 3px,transparent 3px) 0 0/33.3% 100%,linear-gradient(var(--fr) 0 3px,transparent 3px) 0 0/100% 18%,#f7f2e6}
.f-shoji .curtain::after{display:none}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1)}
.curtain::after{content:"";position:absolute;left:0;right:20%;top:46%;height:9px;background:var(--tie);border-radius:4px}
#sill{position:absolute;left:28px;right:28px;bottom:-4px;height:18px;background:linear-gradient(var(--s1),var(--s2));border-radius:6px;z-index:3;box-shadow:0 4px 8px rgba(0,0,0,.25)}
#sill span{position:absolute;bottom:10px;font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:pop .5s ease both}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
#winwrap.night #sill::before{content:"";position:absolute;left:-10%;right:-10%;bottom:4px;height:60px;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,110,.35),transparent 70%);pointer-events:none}
#win.sea{box-shadow:0 0 0 10px #f2f4f5,0 0 0 13px #9fb3bf,0 10px 26px 12px rgba(30,60,90,.3);border-radius:28px}
#win.sea::after{border-radius:28px}
#win.sea .curtain{display:none}

.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.frames button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.frames.two{grid-template-columns:1fr 1fr}
.frames button.on{border-color:var(--accent);background:var(--accent2)}
.frames i{display:block;width:46px;height:32px;border-radius:8px;background:linear-gradient(#8fc3ea,#cfe7f5 60%,#9cc87a 60%);box-shadow:0 0 0 4px #8a5b3c}
.fp-white{box-shadow:0 0 0 4px #e6e0d4!important}.fp-retro{border-radius:14px!important;box-shadow:0 0 0 4px #e0782f!important}.fp-log{box-shadow:0 0 0 5px #5a3b26!important}.fp-round{border-radius:50%!important;box-shadow:0 0 0 4px #c9a35a!important}.fp-shoji{border-radius:2px!important;box-shadow:0 0 0 4px #b88a5a!important;background:linear-gradient(90deg,#f7f2e6 22%,transparent 22% 78%,#f7f2e6 78%),linear-gradient(#8fc3ea,#cfe7f5 60%,#9cc87a 60%)!important}
#toasts{position:absolute;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none;padding:0 14%}
.toast{background:rgba(255,250,242,.94);color:var(--ink);border-radius:16px;padding:9px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center;max-width:420px;animation:tin .4s ease both}
.toast small{display:block;font-weight:500;font-size:12px;color:var(--ink2);margin-top:2px}
.toast.out{animation:tout .5s ease both}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
/* 下の操作パネル */
#panel{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 2px 0 rgba(90,60,30,.08)}
.route{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.route span{white-space:nowrap;max-width:30%;overflow:hidden;text-overflow:ellipsis}
#bar{position:relative;flex:1;height:8px;background:var(--wall2);border-radius:99px}
#bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
#bar b{position:absolute;top:50%;transform:translate(-50%,-58%) scaleX(-1);font-size:20px;line-height:1}
#next{font-size:14px;margin-top:6px;color:var(--ink2)}
#next b{color:var(--ink);font-size:16px}
#nextlm{font-size:13px;color:var(--ink2);margin-top:3px}
#nextlm b{color:var(--ink)}
#fork{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 14px;font-size:13px;text-align:left}
#fork b{font-size:14px;white-space:nowrap}
#park{display:flex;align-items:center;gap:8px;background:#2f7fb0;color:#fff;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 3px 0 #1f5a80}
.pk-msg{flex:1;min-width:0;font-weight:700;font-size:14px}.pk-msg small{display:block;font-weight:500;font-size:12px;opacity:.85}
.pk-b{border:0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:15px;background:#fff;color:#2f7fb0;white-space:nowrap}
.pk-b.sight{background:#ffd36b;color:#5a3a00}.pk-b.ghost{background:rgba(255,255,255,.2);color:#fff}
.mini{border:1px solid var(--line);background:var(--wall);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;margin-top:4px}
.shmulti{display:inline-flex;gap:6px;flex-wrap:wrap;justify-content:center}.mini.on{background:#e8f3e0;border-color:#9cc48a;color:#3d6b2c}
.mini:disabled{opacity:.6}
.modal textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 monospace;background:#fff;word-break:break-all;resize:vertical}
.filebtn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer}
#b-full{position:absolute;right:10px;bottom:10px;z-index:5;height:38px;padding:0 14px;border-radius:19px;font-weight:700;font-size:14px!important;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:20px;line-height:1;backdrop-filter:blur(4px)}
#fsinfo{display:none}
#b-gaze{position:absolute;right:10px;top:10px;z-index:5;height:34px;padding:0 12px;border-radius:17px;border:0;background:rgba(0,0,0,.35);color:#fff;font-weight:700;font-size:13px;backdrop-filter:blur(4px)}
.f-retro #b-gaze{right:20px;top:20px}.f-round #b-gaze{right:24%;top:9%}
body.full #b-gaze{display:none}
#gzcover,#gzclock,#gzbar{display:none}
#fshint{position:absolute;left:50%;top:18px;transform:translateX(-50%);z-index:10;background:rgba(0,0,0,.6);color:#fff;border-radius:99px;padding:8px 16px;font-size:14px;white-space:nowrap;pointer-events:none}
#fspark{display:none}
body.full.parked:not(.gaze) #toasts{bottom:calc(200px + env(safe-area-inset-bottom))}
body.full.parked:not(.gaze) #fspark{display:flex;flex-direction:column;align-items:center;gap:2px;position:absolute;left:50%;transform:translateX(-50%);bottom:calc(64px + env(safe-area-inset-bottom));z-index:6;background:rgba(255,250,240,.95);color:#3a2c22;border-radius:20px;padding:10px 14px 12px;box-shadow:0 6px 20px rgba(0,0,0,.35);text-align:center;max-width:calc(100% - 120px);animation:pop .5s ease both}
#fspark b{font-size:16px}#fspark small{font-size:12px;color:#6b5a4c}
#fspark span{display:flex;gap:8px;margin-top:6px}#fspark button{border:0;border-radius:99px;padding:10px 16px;font-weight:700;font-size:15px;background:#e8dcc8;color:#3a2c22;white-space:nowrap}
#fspark button.go1{background:var(--accent);color:#fff;font-size:16px;padding:12px 22px;animation:pkpulse2 1.6s ease-in-out infinite}
@keyframes pkpulse2{0%,100%{box-shadow:0 0 0 0 rgba(232,116,58,.6)}50%{box-shadow:0 0 0 9px rgba(232,116,58,0)}}
.ph{display:none}.ph.ok{display:block;position:relative;overflow:hidden;border-radius:14px;background:#e8dcc8;margin:0 0 8px}
.ph img{display:block;width:100%;height:100%;object-fit:cover}
.ph.wide{height:190px}.ph.card{height:110px;margin:-4px -4px 6px;border-radius:12px}.ph.thumb{float:right;width:84px;height:64px;margin:0 0 4px 8px;border-radius:10px}
.ph .cr{position:absolute;right:0;bottom:0;max-width:100%;font-size:10px;color:#fff;background:rgba(0,0,0,.45);padding:2px 6px;border-top-left-radius:8px;text-decoration:none;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ph.thumb .cr{display:none}.ph.tip{height:120px;margin:0 0 6px;border-radius:8px}.ph.tip .cr{display:none}
.card .ph.card{margin:0 0 6px}
.spl::after{content:"";display:block;clear:both}
.pk-b.pulse{animation:pkpulse 1.6s ease-in-out infinite}
@keyframes pkpulse{0%,100%{box-shadow:0 0 0 0 rgba(255,255,255,.7)}50%{box-shadow:0 0 0 7px rgba(255,255,255,0)}}
.pk-msg small{display:block;font-size:11px;opacity:.85;font-weight:500}
.arrive{text-align:center;margin:4px 0 6px}.arrive .big-em{font-size:46px}.arrive small{color:var(--ink2);font-size:13px}.arrive h2{margin:2px 0 6px}.arrive p{font-size:14px;line-height:1.7;background:#fff7e0;border-radius:14px;padding:10px 12px;text-align:left}
.pcard{display:block;width:100%;border-radius:10px;box-shadow:0 3px 10px rgba(0,0,0,.25);margin:6px 0 4px}
.langsw{display:flex;justify-content:flex-end;gap:6px;margin:-4px 0 4px}.langsw button{border:2px solid var(--line);background:#fff;border-radius:99px;padding:5px 12px;font-weight:700;font-size:13px;color:var(--ink2)}.langsw button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.ilinks{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}.ilinks a{font-size:12px;font-weight:700;color:#2f6f9f;background:#eef6fc;border-radius:99px;padding:4px 10px;text-decoration:none;white-space:nowrap}
.ilinks a:hover{background:#dcecf8}
.ph.ev{height:140px;margin:8px 0 6px}
.planb{margin-top:8px;background:var(--accent);color:#fff;border:0}.evc.plancur{background:#eef6fc}.evc.plancur .mini{margin-top:6px}ol.plan{margin:10px 0;padding-left:1.4em;line-height:1.7;font-size:14px}ol.plan li{margin:4px 0}
.spw{display:flex;flex-direction:column;gap:2px}.spw .sp{flex:1}.spw .ilinks{padding:0 4px}
.spl{display:block;margin-bottom:8px}.spl small{display:block}
.card .ilinks{justify-content:center}
#sill span{cursor:pointer}#sill.tipon{z-index:20}
#silltip{position:absolute;bottom:44px;width:230px;z-index:8;background:rgba(255,252,244,.97);color:#3a2c22;border-radius:12px;padding:9px 12px;box-shadow:0 4px 14px rgba(0,0,0,.28);font-size:13px;line-height:1.55;pointer-events:none}
#sill.pin #silltip{pointer-events:auto}#silltip .mini{margin:6px 6px 0 0}#silltip b{display:block;font-size:14px}#silltip small{display:block;color:#6b5a4c;font-size:12px;margin-top:2px}
body.gaze #gzcover{display:block;position:absolute;inset:0;z-index:7;background:transparent;transition:background 2s}
body.gaze.gz-dim #gzcover{background:rgba(0,0,0,.45)}
body.gaze #b-snd,body.gaze #b-full,body.gaze #b-info,body.gaze #fsinfo,body.gaze #fsmap,body.gaze #toasts{display:none!important}
body.gaze #gzclock:not([hidden]){display:block;position:absolute;left:6%;bottom:8%;z-index:8;color:#fff;pointer-events:none;text-shadow:0 2px 12px rgba(0,0,0,.55);transition:left 3s,bottom 3s}
#gzclock b{display:block;font-size:clamp(56px,16vmin,130px);font-weight:300;line-height:1;letter-spacing:.02em;font-variant-numeric:tabular-nums}
#gzclock span{display:block;font-size:clamp(14px,3.2vmin,22px);opacity:.9;margin-top:6px}#gzclock .gz-pl{font-size:clamp(12px,2.6vmin,17px);opacity:.75}
body.gaze.gz-dim #gzclock{opacity:.6}
body.gaze #gzbar:not([hidden]){display:flex;flex-wrap:wrap;justify-content:center;gap:8px;position:absolute;left:12px;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:9}
#gzbar button{border:0;border-radius:99px;padding:10px 14px;font-weight:700;font-size:14px;background:rgba(255,250,240,.92);color:#3a2c22;box-shadow:0 2px 8px rgba(0,0,0,.25)}
#gzbar button[data-gz=back]{background:var(--accent);color:#fff}
/* 角が丸い窓ではボタンが隠れないよう内側へ */
.f-retro #b-snd{left:20px;bottom:24px}.f-retro #b-full{right:20px;bottom:24px}
.f-round #b-snd{left:21%;bottom:11%}.f-round #b-full{right:21%;bottom:11%}
body.full #b-snd{left:14px}body.full #b-full{right:14px}
body.full{overflow:hidden}
body.full #winwrap{position:fixed;inset:0;z-index:15;padding:0;background:#000}
body.full #win{margin:0;border-radius:0;box-shadow:none}
body.full #win::after,body.full .curtain,body.full #sill{display:none}
#b-info{display:none}
#fsmap{display:none}
body.full #fsmap:not([hidden]){display:block;position:absolute;right:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;width:clamp(110px,30vmin,190px);aspect-ratio:1;border-radius:18px;overflow:hidden;
  border:2px solid rgba(255,255,255,.5);box-shadow:0 4px 14px rgba(0,0,0,.15);opacity:.4;cursor:pointer;transition:opacity .5s,box-shadow .5s}
body.full.calm #fsmap{opacity:.3}
body.full #fsmap.solid{opacity:.95;border-color:rgba(255,255,255,.8);box-shadow:0 4px 14px rgba(0,0,0,.3)}
#fsmap svg{width:100%;height:100%;display:block;background:#bfe0ef}
#fsmap .r-done{stroke-width:2.5}#fsmap .r-ahead{stroke-width:1.8}
body.full.hasmap #fsinfo{max-width:calc(100% - clamp(110px,30vmin,190px) - 44px)}
#fsmap text{font-size:1.3px;paint-order:stroke;stroke:#fff;stroke-width:.35px}
#fsmap #mm-me{animation:none}
body.full #b-info{display:block;position:absolute;left:62px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:17px;backdrop-filter:blur(4px);transition:opacity .6s}
body.full #fsinfo{cursor:pointer;display:block;position:absolute;left:12px;top:calc(12px + env(safe-area-inset-top));z-index:4;max-width:min(78%,360px);color:#fff;pointer-events:auto;
  background:rgba(20,24,32,.28);backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);border-radius:14px;padding:8px 12px;text-shadow:0 1px 4px rgba(0,0,0,.5);transition:opacity .8s}
body.full #fsinfo.m-off{display:none}
#fsinfo b{display:block;font-size:clamp(16px,4.2vw,24px);font-weight:900;line-height:1.25}
#fsinfo span{display:block;font-size:12.5px;line-height:1.5;opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#fsinfo .ad{opacity:.8}#fsinfo .sm{font-size:11.5px;opacity:.8}
#fsinfo .pb{display:block;height:4px;border-radius:4px;background:rgba(255,255,255,.3);margin:4px 0 3px;overflow:hidden}#fsinfo .pb i{display:block;height:100%;background:#ffd36b}
body.full #b-snd,body.full #b-full{bottom:calc(14px + env(safe-area-inset-bottom));transition:opacity .6s}
body.full #b-full{right:14px;width:38px;padding:0;font-size:18px!important}body.full #b-snd{left:14px}
body.full.calm #b-snd,body.full.calm #b-full,body.full.calm #b-info{opacity:0}
body.full.calm #fsinfo{opacity:.8}
body.full #toasts{top:auto;bottom:calc(70px + env(safe-area-inset-bottom))}

/* ----- 雨・雪・窓 ----- */
function drawWeather(dt, W8, sea) {
  const vf = S.vf;
  const want = Math.floor(W8.rain * 160 + W8.snow * 180);
  while (S.parts.length < want) S.parts.push({ x: Math.random() * W * 1.4, y: Math.random() * H, z: .4 + Math.random() * .6 });
  if (S.parts.length > want) S.parts.length = want;
  const snow = W8.snow > 0;
  c.strokeStyle = 'rgba(210,225,245,.55)'; c.fillStyle = 'rgba(255,255,255,.9)'; c.lineWidth = 1;
  c.beginPath();
  for (const p of S.parts) {
    if (snow) { p.x -= (60 * vf + 20) * p.z * dt; p.y += 50 * p.z * dt; p.x += Math.sin(S.t + p.z * 9) * .3; }
    else { p.x -= 260 * vf * p.z * dt; p.y += 700 * p.z * dt; }
    if (p.y > H || p.x < -20) { p.y = -10; p.x = Math.random() * W * 1.4; }
    if (snow) { c.moveTo(p.x + 2 * p.z, p.y); c.arc(p.x, p.y, 2 * p.z + .5, 0, 7); } else { c.moveTo(p.x, p.y); c.lineTo(p.x + 10 * p.z * vf * .4, p.y - 18 * p.z); }
  }
  snow ? c.fill() : c.stroke();
  // 窓ガラスの水滴
  if (!sea && W8.rain > 0) {
    if (S.drops.length < 70 * W8.rain && Math.random() < W8.rain * .6) S.drops.push({ x: Math.random() * W, y: Math.random() * H * .9, r: 1.5 + Math.random() * 3.5, v: 0 });
    for (const d of S.drops) {
      if (d.r > 3.2 && Math.random() < .02) d.v = 30 + Math.random() * 60; d.y += d.v * dt; d.x -= d.v * dt * .4 * vf; d.v *= .985;
      c.fillStyle = 'rgba(220,235,250,.35)'; c.beginPath(); c.arc(d.x, d.y, d.r, 0, 7); c.fill(); c.fillStyle = 'rgba(255,255,255,.6)'; c.fillRect(d.x - d.r * .3, d.y - d.r * .5, d.r * .4, d.r * .4);
    }
    S.drops = S.drops.filter(d => d.y < H + 10 && d.x > -10);
  } else if (S.drops.length) S.drops.length = Math.max(0, S.drops.length - 1);
  if (W8.thunder) { if (Math.random() < dt * .08) { S.flash = 1; auThunder(); } }
  if (S.flash > 0) { c.fillStyle = `rgba(255,255,255,${S.flash * .7})`; c.fillRect(0, 0, W, H); S.flash -= dt * 3; }
  if (!sea && W8.frost) { for (const [x, y] of [[0, 0], [W, 0], [0, H], [W, H]]) { const g = c.createRadialGradient(x, y, 0, x, y, Math.min(W, H) * .45); g.addColorStop(0, 'rgba(240,248,255,.75)'); g.addColorStop(1, 'rgba(240,248,255,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); } }
  if (!sea) { const g = c.createLinearGradient(0, 0, W, H); g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(.35, 'rgba(255,255,255,.06)'); g.addColorStop(.4, 'rgba(255,255,255,0)'); c.fillStyle = g; c.fillRect(0, 0, W, H); }
}

  }

    const R = {

      med: { dolphin: 3, turtle: 1.2, gull: 2, flyingfish: .8 }, atlantic: { dolphin: 3, whale: 1.6, flyingfish: 2, sperm: .5 }, azores: { sperm: 2.5, dolphin: 3, whale: 1.5 },

function ckGetAll() { const o = {}; document.cookie.split(/;\s*/).forEach(c => { const k = c.indexOf('='); if (k > 0) o[c.slice(0, k)] = c.slice(k + 1); }); return o; }
function ckSet(k, v) { document.cookie = k + '=' + v + ';path=' + CK_PATH + ';max-age=' + (v ? 315360000 : 0) + ';SameSite=Lax' + (location.protocol === 'https:' ? ';Secure' : ''); }
function ckRead() {
  const o = ckGetAll(), n = +o.camper_n || 0; if (!n) return null;
  let code = ''; for (let i = 0; i < n; i++) { if (o['camper_t' + i] == null) return null; code += o['camper_t' + i]; }
  return /^CAMPER[01]-[A-Za-z0-9_-]+$/.test(code) ? code : null;
}
let tvCkAt = 0;
async function tvCookie(force) {
  if (!st || st.preview || QS.has('km')) return; if (!force && Date.now() - tvCkAt < 60e3) return; tvCkAt = Date.now();
  try {
    tick(); const code = await tvCode(); const parts = code.match(/.{1,3800}/g) || [];
    if (parts.length > 24) return;
    const old = +ckGetAll().camper_n || 0;
    parts.forEach((p, i) => ckSet('camper_t' + i, p)); for (let i = parts.length; i < old; i++) ckSet('camper_t' + i, '');
    ckSet('camper_n', String(parts.length));
  } catch (e) { }
}
setInterval(() => { if (TV) tvCookie(); }, 15e3);
document.addEventListener('visibilitychange', () => { if (document.hidden && TV) tvCookie(true); });
window.addEventListener('pagehide', () => { if (TV) tvCookie(true); });

// 開いたときに、どこに旅が残っていたかを覚えておく（設定の画面に出す）
const TVDIAG = { ls: !!(st && !st.preview), hash: /trip=CAMPER/.test(location.hash), ck: !!ckRead(), idb: null };
(MIRROR_ON ? mirrorLoad() : Promise.resolve(null)).then(o => { TVDIAG.idb = !!o; });
(async () => { // 旅がなく、アドレスにも無いとき、クッキーから続ける
  if (!st || !st.preview || TVDIAG.hash) return; const code = ckRead(); if (!code) return;
  let o; try { o = await readCode(code); } catch (e) { return; }
  if (!st.preview || !o || !o.s) return;
  let ok = false; try { localStorage.setItem(KEY, JSON.stringify(o.s)); ok = localStorage.getItem(KEY) != null; for (const [k, v] of [['camper-frame', o.f], ['camper-poles', o.p], ['camper-sound', o.snd]]) if (v != null) localStorage.setItem(k, v); } catch (e) { }
  if (ok) { try { if (!sessionStorage.getItem('camper-restored')) { sessionStorage.setItem('camper-restored', 'ck'); st = null; location.reload(); return; } } catch (e) { } }
  closeModal(); st = o.s; P = curPos(); startTrip(); back();
  toast(J('💾 クッキーに入っていた旅から続けます', '💾 Continuing the trip saved in a cookie'), 5000);
})();
try { if (sessionStorage.getItem('camper-restored') === 'ck' && st && !st.preview) { sessionStorage.setItem('camper-restored', '2'); setTimeout(() => toast(J('💾 クッキーに入っていた旅から続けます', '💾 Continuing the trip saved in a cookie'), 5000), 1500); } } catch (e) { }

// ----- 下に続く画面を、カーソルでも動かせるように ▲▼ ボタンを出す -----
const tvScr = document.createElement('div'); tvScr.id = 'tvscroll'; tvScr.hidden = true;
tvScr.innerHTML = '<button id="tvs-up" aria-label="up">▲</button><button id="tvs-dn" aria-label="down">▼</button>';
$('#modal').appendChild(tvScr);
const tvSheetBy = d => { const sh = $('#sheet'); sh.scrollBy({ top: d * sh.clientHeight * .7, behavior: 'smooth' }); setTimeout(tvScrUpd, 450); };
tvScr.addEventListener('click', e => { e.stopPropagation(); const b = e.target.closest('button'); if (b) tvSheetBy(b.id === 'tvs-up' ? -1 : 1); });
function tvScrUpd() {
  const sh = $('#sheet'), on = TV && !$('#modal').hidden && sh.scrollHeight > sh.clientHeight + 8;
  tvScr.hidden = !on; if (!on) return;
  $('#tvs-up').disabled = sh.scrollTop < 4; $('#tvs-dn').disabled = sh.scrollTop + sh.clientHeight >= sh.scrollHeight - 4;
}
$('#sheet').addEventListener('scroll', tvScrUpd, { passive: true });
new MutationObserver(() => setTimeout(tvScrUpd, 80)).observe($('#modal'), { attributes: true, attributeFilter: ['hidden'], childList: true, subtree: true });
window.addEventListener('resize', tvScrUpd); setInterval(tvScrUpd, 1000); setTimeout(tvScrUpd, 300);


// リセットしたら、アドレスとクッキーの旅も消す
window.tvForget = function () {
  try { const o = ckGetAll(), n = Math.max(+o.camper_n || 0, 24); for (let i = 0; i < n; i++) if (o['camper_t' + i] != null) ckSet('camper_t' + i, ''); ckSet('camper_n', ''); } catch (e) { }
  try { history.replaceState(history.state, '', location.pathname + location.search); } catch (e) { }
};

// ----- 全画面の なめらかさを はかって、設定に出す。描くのが重すぎるときは、さらに粗くする -----
const TVPERF = { fps: null, draw: null, px: '', g: null, n: null, jg: null, jn: null };
// 引っかかり（1コマが60ms以上かかった回数）を、ふつうの全画面と ながら見で別々に1分あたりで数える
const tvJ = { n: [0, 0], g: [0, 0] }; let tvJLast = 0;
(function tvJank(ts) { requestAnimationFrame(tvJank); const iv = ts - tvJLast; tvJLast = ts;
  if (!TV || !document.body.classList.contains('full') || document.hidden || iv <= 0 || iv > 1000) return;
  const k = document.body.classList.contains('gaze') ? 'g' : 'n'; tvJ[k][1] += iv; if (iv > 60) tvJ[k][0]++;
  if (tvJ[k][1] > 20e3) TVPERF['j' + k] = Math.round(tvJ[k][0] / tvJ[k][1] * 60e3);
})(0);
let tvPerfN = 0, tvPerfF = 0;
setInterval(() => {
  if (!TV || !document.body.classList.contains('full') || document.hidden) { tvPerfN = 0; return; }
  const fps = 1000 / ivAvg / (HALF ? 2 : 1);
  tvPerfN++; tvPerfF += fps;
  TVPERF[document.body.classList.contains('gaze') ? 'g' : 'n'] = Math.round(1000 / ivAvg);
  if (tvPerfN >= 3) { TVPERF.fps = Math.round(tvPerfF / tvPerfN); TVPERF.draw = Math.round(drawAvg); TVPERF.px = cv.width + '×' + cv.height; }
  if (tvPerfN >= 10) { tvPerfN = 0; tvPerfF = 0; }
  if (drawAvg > 26 && PXMAX > PXMIN) { PXMAX = Math.max(PXMIN, PXMAX * .85); resize(); }
}, 2000);

// ----- テレビ：空（空の色・星・天の川・星座・月）は描き置きして、4コマに1回だけ描きなおす -----
const _drawSky = drawSky; let skyC = null, skyX = null, skyN = 0, skyKey = '';
drawSky = function (hz, W8, alt) {
  if (!S.tvLite) return _drawSky(hz, W8, alt);
  if (!skyC) { skyC = document.createElement('canvas'); skyX = skyC.getContext('2d'); }
  if (skyC.width !== cv.width || skyC.height !== cv.height) { skyC.width = cv.width; skyC.height = cv.height; skyN = 0; }
  const key = Math.round(hz) + ',' + W + ',' + H;
  if (skyN-- <= 0 || key !== skyKey) {
    skyKey = key; skyN = 3;
    const m = c.getTransform(), main = c;
    skyX.setTransform(1, 0, 0, 1, 0, 0); skyX.globalAlpha = 1; skyX.clearRect(0, 0, skyC.width, skyC.height); skyX.setTransform(m);
    c = skyX; try { _drawSky(hz, W8, alt); } finally { c = main; skyX.globalAlpha = 1; }
  }
  c.save(); c.setTransform(1, 0, 0, 1, 0, 0); c.globalAlpha = 1; c.drawImage(skyC, 0, 0); c.restore();
};

// ----- 音のテスト：1＝アプリと同じしくみ（Web Audio）、2＝ふつうの音声ファイル -----
var tvVidOff = false;
function tvBeep1() {
  try { auStart(); const ac = AU.ac || new (window.AudioContext || window.webkitAudioContext)(); if (ac.state !== 'running') ac.resume();
    const o = ac.createOscillator(), g = ac.createGain(); o.frequency.value = 660; g.gain.value = .5; o.connect(g); g.connect(ac.destination); o.start(); o.stop(ac.currentTime + .7);
  } catch (e) { toast('🔔 1: ' + e.message, 4000); }
}
function tvBeep2() {
  const sr = 22050, n = sr * .7 | 0, buf = new ArrayBuffer(44 + n * 2), v = new DataView(buf);
  const w = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
  for (let i = 0; i < n; i++) v.setInt16(44 + i * 2, Math.sin(i / sr * 2 * Math.PI * 880) * 16000 * Math.min(1, (n - i) / 2000), true);
  const a = new Audio(URL.createObjectURL(new Blob([buf], { type: 'audio/wav' }))); a.play().catch(e => toast('🔔 2: ' + e.message, 4000));
}
