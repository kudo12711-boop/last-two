<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#6b4a33">
<title>キャンピングカー世界一周</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🚐%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* キャンピングカーの車内：クリーム色の壁と木の窓わく。船の上では白い船の窓わくに変わる */
:root{
  --wall:#f4ead9; --wall2:#eadcc4; --wood:#8a5b3c; --wood2:#6b4a33; --ink:#3a2c22; --ink2:#7a6655;
  --accent:#e8743b; --accent2:#fff1e6; --sea:#2f7fb0; --card:#fffaf2; --line:#e2d3bc;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--wall);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:repeating-linear-gradient(90deg,rgba(0,0,0,.018) 0 2px,transparent 2px 46px)}
button{font-family:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
#app{height:100%;display:grid;grid-template-rows:auto 1fr auto;
  padding:env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0)}
header{display:flex;align-items:flex-end;gap:10px;padding:10px 16px 4px}
header .l{flex:1;min-width:0}
#place{font-size:clamp(18px,5vw,26px);font-weight:900;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#addr{font-size:13px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
header .r{text-align:right;white-space:nowrap}
#clock{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
#wx{font-size:clamp(17px,4.6vw,22px);font-weight:900}
#wx small{display:block;font-size:12px;font-weight:700;color:var(--ink2)}
/* 窓 */
#winwrap{position:relative;min-height:0;padding:6px 12px 22px}
#winwrap{--fr:#8a5b3c;--fr2:#6b4a33;--bw:10px;--c1:#c9543e;--c2:#b2412f;--c3:#d8664c;--tie:#e8c27a;--rad:28px;--s1:#9a6a48;--s2:#7a5236}
/* 窓のデザイン */
#winwrap.f-white{--fr:#f6f3ec;--fr2:#cfc6b6;--c1:#f1e9da;--c2:#e2d6c0;--c3:#f8f2e6;--tie:#b9a37a;--s1:#f3efe6;--s2:#d6cdbd;--rad:20px}
#winwrap.f-retro{--fr:#e0782f;--fr2:#a8521c;--c1:#f2c14e;--c2:#e39a35;--c3:#f7d77a;--tie:#7a4a20;--s1:#e9a23b;--s2:#b8721c;--rad:56px}
#winwrap.f-log{--fr:#5a3b26;--fr2:#2f1e12;--bw:16px;--c1:#3f7a4f;--c2:#2a5236;--c3:#5a9a6a;--tie:#c8a060;--s1:#6a4a30;--s2:#4a3220;--rad:12px}
#winwrap.f-round{--fr:#c9a35a;--fr2:#7a5c22;--bw:14px;--rad:50%;--s1:#b08a44;--s2:#7a5c22}
#winwrap.f-shoji{--fr:#b88a5a;--fr2:#7a5634;--rad:4px;--s1:#b88a5a;--s2:#8a6440}
#win{position:relative;height:100%;border-radius:var(--rad);overflow:hidden;background:#89b;
  box-shadow:0 0 0 var(--bw) var(--fr),0 0 0 calc(var(--bw) + 3px) var(--fr2),0 10px 26px 12px rgba(60,40,20,.35);
  margin:calc(var(--bw) + 2px)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block}
#win::after{content:"";position:absolute;inset:0;border-radius:var(--rad);box-shadow:inset 0 0 0 3px rgba(0,0,0,.25),inset 0 8px 18px rgba(0,0,0,.25);pointer-events:none}
.curtain{position:absolute;top:0;bottom:0;width:11%;max-width:70px;pointer-events:none;z-index:2;
  background:repeating-linear-gradient(90deg,var(--c1) 0 8px,var(--c2) 8px 12px,var(--c3) 12px 20px);
  box-shadow:inset -6px 0 10px rgba(0,0,0,.25);clip-path:polygon(0 0,100% 0,60% 45%,85% 52%,100% 100%,0 100%)}
.f-retro .curtain{background:repeating-conic-gradient(var(--c1) 0 25%,var(--c3) 0 50%) 0 0/16px 16px}
.f-log .curtain{background:repeating-linear-gradient(90deg,rgba(0,0,0,.18) 0 4px,transparent 4px 14px),repeating-linear-gradient(0deg,var(--c2) 0 5px,var(--c1) 5px 14px)}
.f-round .curtain{display:none}
.f-shoji .curtain{width:13%;max-width:80px;clip-path:none;box-shadow:inset -3px 0 6px rgba(0,0,0,.2),0 0 0 3px var(--fr);
  background:linear-gradient(90deg,var(--fr) 0 3px,transparent 3px) 0 0/33.3% 100%,linear-gradient(var(--fr) 0 3px,transparent 3px) 0 0/100% 18%,#f7f2e6}
.f-shoji .curtain::after{display:none}
.curtain.l{left:0}
.curtain.r{right:0;transform:scaleX(-1)}
.curtain::after{content:"";position:absolute;left:0;right:20%;top:46%;height:9px;background:var(--tie);border-radius:4px}
#sill{position:absolute;left:28px;right:28px;bottom:-4px;height:18px;background:linear-gradient(var(--s1),var(--s2));border-radius:6px;z-index:3;box-shadow:0 4px 8px rgba(0,0,0,.25)}
#sill span{position:absolute;bottom:10px;font-size:26px;line-height:1;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));animation:pop .5s ease both}
@keyframes pop{from{transform:translateY(6px);opacity:0}}
#winwrap.night #sill::before{content:"";position:absolute;left:-10%;right:-10%;bottom:4px;height:60px;background:radial-gradient(ellipse at 50% 100%,rgba(255,200,110,.35),transparent 70%);pointer-events:none}
#win.sea{box-shadow:0 0 0 10px #f2f4f5,0 0 0 13px #9fb3bf,0 10px 26px 12px rgba(30,60,90,.3);border-radius:28px}
#win.sea::after{border-radius:28px}
#win.sea .curtain{display:none}
#winwrap.sea #sill{display:none}
.frames{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.frames button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:700;font-size:13px}
.frames.two{grid-template-columns:1fr 1fr}
.frames button.on{border-color:var(--accent);background:var(--accent2)}
.frames i{display:block;width:46px;height:32px;border-radius:8px;background:linear-gradient(#8fc3ea,#cfe7f5 60%,#9cc87a 60%);box-shadow:0 0 0 4px #8a5b3c}
.fp-white{box-shadow:0 0 0 4px #e6e0d4!important}.fp-retro{border-radius:14px!important;box-shadow:0 0 0 4px #e0782f!important}.fp-log{box-shadow:0 0 0 5px #5a3b26!important}.fp-round{border-radius:50%!important;box-shadow:0 0 0 4px #c9a35a!important}.fp-shoji{border-radius:2px!important;box-shadow:0 0 0 4px #b88a5a!important;background:linear-gradient(90deg,#f7f2e6 22%,transparent 22% 78%,#f7f2e6 78%),linear-gradient(#8fc3ea,#cfe7f5 60%,#9cc87a 60%)!important}
#toasts{position:absolute;left:0;right:0;top:12px;display:flex;flex-direction:column;align-items:center;gap:8px;z-index:5;pointer-events:none;padding:0 14%}
.toast{background:rgba(255,250,242,.94);color:var(--ink);border-radius:16px;padding:9px 14px;font-weight:700;font-size:15px;box-shadow:0 6px 18px rgba(0,0,0,.25);text-align:center;max-width:420px;animation:tin .4s ease both}
.toast small{display:block;font-weight:500;font-size:12px;color:var(--ink2);margin-top:2px}
.toast.out{animation:tout .5s ease both}
@keyframes tin{from{opacity:0;transform:translateY(-10px)}}
@keyframes tout{to{opacity:0;transform:translateY(-10px)}}
/* 下の操作パネル */
#panel{padding:0 14px 12px;display:flex;flex-direction:column;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:10px 14px;box-shadow:0 2px 0 rgba(90,60,30,.08)}
.route{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px}
.route span{white-space:nowrap;max-width:30%;overflow:hidden;text-overflow:ellipsis}
#bar{position:relative;flex:1;height:8px;background:var(--wall2);border-radius:99px}
#bar i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:99px}
#bar b{position:absolute;top:50%;transform:translate(-50%,-58%) scaleX(-1);font-size:20px;line-height:1}
#next{font-size:14px;margin-top:6px;color:var(--ink2)}
#next b{color:var(--ink);font-size:16px}
#nextlm{font-size:13px;color:var(--ink2);margin-top:3px}
#nextlm b{color:var(--ink)}
#fork{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:9px 14px;font-size:13px;text-align:left}
#fork b{font-size:14px;white-space:nowrap}
#park{display:flex;align-items:center;gap:8px;background:#2f7fb0;color:#fff;border-radius:16px;padding:8px 8px 8px 14px;box-shadow:0 3px 0 #1f5a80}
.pk-msg{flex:1;min-width:0;font-weight:700;font-size:14px}.pk-msg small{display:block;font-weight:500;font-size:12px;opacity:.85}
.pk-b{border:0;border-radius:12px;padding:10px 12px;font-weight:900;font-size:15px;background:#fff;color:#2f7fb0;white-space:nowrap}
.pk-b.sight{background:#ffd36b;color:#5a3a00}.pk-b.ghost{background:rgba(255,255,255,.2);color:#fff}
.mini{border:1px solid var(--line);background:var(--wall);border-radius:99px;padding:4px 10px;font-size:12px;font-weight:700;margin-top:4px}
.mini:disabled{opacity:.6}
.modal textarea{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:12px;padding:10px;font:12px/1.4 monospace;background:#fff;word-break:break-all;resize:vertical}
.filebtn{display:inline-flex;align-items:center;justify-content:center;border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 12px;font-weight:700;font-size:14px;cursor:pointer}
#b-snd{position:absolute;left:10px;bottom:10px;z-index:5;width:38px;height:38px;border-radius:50%;border:0;background:rgba(0,0,0,.35);color:#fff;font-size:18px;backdrop-filter:blur(4px)}
#s-vol{width:100%;margin:6px 0;accent-color:var(--accent)}
.sps{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.sp{border:2px solid var(--line);background:#fff;border-radius:16px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.sp.wide{width:100%}
.sp .em{font-size:30px}.sp b{font-size:15px}.sp small{font-size:12px;color:var(--ink2);line-height:1.45}.sp i{font-style:normal;font-size:12px;color:var(--accent);font-weight:700;margin-top:2px}
.sp.done{background:#f4fbf2;border-color:#bfe0b5}.sp:disabled{opacity:.5}
.busy{background:#e8f3fb;border-radius:12px;padding:10px 12px;font-size:14px;font-weight:700;color:#1f5a80}
.lodges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lodges button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:2px}
.lodges span{font-size:26px}.lodges b{font-size:14px}.lodges small{font-size:10px;color:var(--ink2);text-align:center}
.lodges button.on{border-color:var(--accent);background:var(--accent2)}
.sight-card{text-align:center;background:linear-gradient(#fff7e6,#fffaf2);border-radius:20px;padding:18px 14px;border:1px solid var(--line)}
.big-em{font-size:84px;line-height:1.1;filter:drop-shadow(0 6px 8px rgba(0,0,0,.15));animation:pop .6s ease both}
.phrase{background:var(--wall);border-radius:14px;padding:12px 14px;margin:8px 0}.phrase small{display:block;font-size:12px;color:var(--ink2)}
.phrase b{display:block;font-size:24px}.phrase span{display:block;font-size:14px;color:var(--accent);font-weight:700}
.phrase{position:relative}.phrase>.say{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:var(--accent);color:#fff;font-size:20px}
.phrase.sm .say{position:static;transform:none;width:30px;height:30px;font-size:14px;margin-right:4px;vertical-align:middle}
.phrase.sm b{font-size:17px;display:inline}.phrase.sm span{display:inline;margin:0 12px 0 6px;font-size:13px}
#fork.todo{background:var(--accent);color:#fff;border-color:var(--accent);animation:pulse 2.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.015)}}
.stats{display:flex;gap:6px;justify-content:space-between;font-size:12px;color:var(--ink2)}
.stats b{display:block;color:var(--ink);font-size:15px;font-variant-numeric:tabular-nums}
.stats>div{flex:1;text-align:center}
nav{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
nav button{border:0;background:var(--wood2);color:#fff7ea;border-radius:16px;padding:9px 4px 8px;font-size:12px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:2px;box-shadow:0 3px 0 #4b3423}
nav button span{font-size:22px;line-height:1}
nav button:active{transform:translateY(2px);box-shadow:0 1px 0 #4b3423}
/* 横向き（iPad・スマホ横）では、パネルを右側に */
@media (min-aspect-ratio:5/4){
  #app{grid-template-columns:1fr minmax(280px,30%);grid-template-rows:auto 1fr}
  header{grid-column:1/3}
  #winwrap{grid-row:2}
  #panel{grid-row:2;grid-column:2;overflow:auto;padding:16px 16px 16px 0;justify-content:center}
}
@media (min-aspect-ratio:5/4) and (max-height:500px){
  header{padding:6px 16px 0}#addr{display:none}
  #panel{gap:6px;padding-top:6px}.stats{display:none}#nextlm{display:none}
}
/* ダイアログ */
.modal{position:fixed;inset:0;background:rgba(40,28,18,.45);display:flex;align-items:flex-end;justify-content:center;z-index:20;animation:fade .2s}
@keyframes fade{from{opacity:0}}
#sheet{background:var(--card);width:100%;max-width:640px;max-height:88%;overflow:auto;border-radius:24px 24px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom,0px));animation:up .25s ease}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
@media (min-width:700px) and (min-height:600px){.modal{align-items:center}#sheet{border-radius:24px}}
#sheet h2{margin:0 0 10px;font-size:22px}
#sheet h3{margin:16px 0 8px;font-size:16px}
#sheet p{line-height:1.7;margin:8px 0}
.note{color:var(--ink2);font-size:13px}
.dots{padding-left:20px;line-height:1.75;margin:8px 0}
.big{display:block;width:100%;margin-top:14px;border:0;background:var(--accent);color:#fff;border-radius:16px;padding:14px;font-size:17px;font-weight:900;box-shadow:0 3px 0 #b8541f}
.big.ghost{background:var(--wall2);color:var(--ink);box-shadow:none}
.big.danger{color:#b23a2a}
.big-num{font-size:16px}.big-num b{font-size:22px;color:var(--accent)}
.speeds{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.speeds button{border:2px solid var(--line);background:#fff;border-radius:14px;padding:10px 2px;display:flex;flex-direction:column;align-items:center;gap:1px}
.speeds b{font-size:15px}.speeds span{font-size:12px}.speeds small{font-size:10px;color:var(--ink2)}
.speeds button.on{border-color:var(--accent);background:var(--accent2)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--wall);border-radius:99px;padding:5px 10px;font-size:13px;font-weight:700}
button.chip{border:2px solid transparent;font-size:14px;padding:6px 12px}button.chip.on{border-color:var(--accent);background:var(--accent2)}
.sgroup{margin:6px 0}.sgroup small{display:block;font-size:11px;color:var(--ink2);margin-bottom:3px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
@media (max-width:420px){.opts{grid-template-columns:1fr}}
.opt{border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;text-align:left;display:flex;flex-direction:column;gap:4px}
.opt.locked{background:#f6f2ea;border-style:dashed}.opt.locked .oi,.opt.locked b{opacity:.75}
.tag.lock{background:#5a4a3a;color:#fff}
.shop{border:2px solid var(--line);background:#fff;border-radius:18px;padding:12px;margin:10px 0;display:flex;flex-direction:column;gap:4px}.shop.focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent2)}
.shop .oi{font-size:28px;letter-spacing:2px}.shop b{font-size:18px}.shop p{font-size:13px;margin:0!important;line-height:1.55!important}.shop .meta{font-size:12px;color:var(--ink2)}
.opt.on{border-color:var(--accent);background:var(--accent2)}
.opt .oi{font-size:28px;letter-spacing:2px}
.opt b{font-size:18px}
.opt p{font-size:13px;margin:0!important;line-height:1.55!important}
.meta{font-size:12px;color:var(--ink2)}.meta.wx{color:var(--ink);font-weight:700;font-size:13px}
.tag{align-self:flex-start;background:#ffe2a8;border-radius:99px;padding:3px 9px;font-size:12px;font-weight:700}
.tag.soft{background:var(--wall)}.tag.pick{background:var(--accent);color:#fff}
.maptabs,.tabs{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.maptabs button,.tabs button{border:0;background:var(--wall);border-radius:99px;padding:7px 14px;font-weight:700;font-size:14px}
.maptabs button.on,.tabs button.on{background:var(--wood2);color:#fff}
svg.map{width:100%;aspect-ratio:2.4/1;border-radius:14px;display:block;background:#bfe0ef}
.map .sea{fill:#bfe0ef}.map .land{fill:#f3ead6;stroke:#d8c9a8;stroke-width:.4;vector-effect:non-scaling-stroke}
.map path[class^=r-]{fill:none;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}
.map .r-all{stroke:#b9a88a;stroke-width:1;stroke-dasharray:2 3;opacity:.6}
.map .r-alt{stroke:#9a8e7a;stroke-width:1.5;stroke-dasharray:3 3}
.map .r-ahead{stroke:#e8743b;stroke-width:2;stroke-dasharray:5 3;opacity:.8}
.map .r-done{stroke:#d2491c;stroke-width:3}
.map circle.v{fill:#d2491c}.map circle.u{fill:#fff;stroke:#a89a80;stroke-width:.3;vector-effect:non-scaling-stroke}
.map text{font-size:2px;fill:#3a2c22;font-family:var(--font);font-weight:700}
.map .me{fill:#2f7fb0;stroke:#fff;stroke-width:2;vector-effect:non-scaling-stroke}
.map .me2{fill:none;stroke:#2f7fb0;stroke-width:2;vector-effect:non-scaling-stroke;animation:ping 1.8s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes ping{to{transform:scale(3);opacity:0}}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:18px;height:0;border-top:3px solid #d2491c;vertical-align:middle;margin-right:4px}
.legend .l-ahead{border-top:2px dashed #e8743b}.legend .l-alt{border-top:2px dashed #9a8e7a}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.grid .card{display:flex;flex-direction:column;gap:2px;padding:10px}
.grid .em{font-size:30px}.grid b{font-size:14px}.grid small{font-size:11px;color:var(--ink2);line-height:1.4}
.grid .card.no{opacity:.5;align-items:center;justify-content:center;min-height:90px}
.grid small.m{color:var(--accent)}
.list{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:4px 12px;font-size:14px}
.list div{padding:6px 0;border-bottom:1px dashed var(--line)}.list small{display:block;color:var(--ink2);font-size:11px;padding-left:26px}
.list .no{color:var(--ink2)}
.stamps{display:flex;flex-wrap:wrap;gap:6px}
.stamp{border:2px solid #d2491c;color:#b23a1a;border-radius:10px;padding:5px 9px;font-weight:900;font-size:13px;transform:rotate(-2deg);background:#fff;cursor:pointer}
.stamp:nth-child(2n){transform:rotate(2deg)}
.stamp small{font-size:10px;margin-left:3px}
.stamp.no{border-color:var(--line);color:var(--line);cursor:default}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.kv div{background:var(--wall);border-radius:14px;padding:10px 12px}.kv span{display:block;font-size:12px;color:var(--ink2)}.kv b{font-size:20px}

/* ----- 陸の景色 ----- */
function drawLand(dt, W8, alt, ctx) {
  const hz = H * .56;
  drawSky(hz, W8, alt); drawSkyEvents(hz);
  drawClouds(hz, W8);
  const B = S.rp, sc = Math.max(.7, Math.min(H, W * 1.6) / 360);
  // 海が見える海岸
  const seaH = H * .07 * B.sea;
  if (B.sea > .02) { c.fillStyle = shc([70, 130, 175], .5); c.fillRect(0, hz, W, seaH + 2); c.fillStyle = shc([255, 255, 255], .4, .25 * B.sea); for (let k = 0; k < 18; k++) c.fillRect((h2(k, 1) * W * 1.3 - S.off.far * 2) % (W * 1.3) - 20, hz + h2(k, 2) * seaH, 14, 1); }
  const gtop = hz + seaH;
  drawRidge(S.off.far, hz + 1, H * B.farAmp, B, B.far, .62, 3, .004, B.jag > .6 ? .62 : null);
  drawLandmarks(gtop, sc, false);
  drawRidge(S.off.hill, gtop + H * .03, H * B.hillAmp, B, B.hill, .32, 9, .007, null);
  // 地面（畑のすじ）
  const gy0 = gtop + H * .03;
  c.fillStyle = shc(B.ground, .12); c.fillRect(0, gy0, W, H - gy0);
  if (ctx.biome === 'farm' && !W8.snowCover) { for (let k = 0; k < 6; k++) { const y = gy0 + (H * .82 - gy0) * (k / 6) ** 1.2; c.fillStyle = shc(mix(B.ground, k % 2 ? [150, 180, 70] : [100, 150, 60], .3), .1); c.fillRect(0, y, W, (H * .82 - gy0) / 9); } }
  // 中景
  const mg = gy0 + (H - gy0) * .32, tw = 100, o = S.off.mid;
  for (let i = Math.floor(o / tw) - 1; i <= Math.floor((o + W) / tw) + 1; i++) {
    let t = S.tiles.get(i); if (!t) { t = tileProps(i, ctx.biome, P); S.tiles.set(i, t); }
    for (const p of t) drawProp(p, i * tw - o + p.x, mg + (p.z - .5) * 10 * sc, sc * (0.9 + p.z * .2), ctx);
  }
  if (S.tiles.size > 60) for (const k of S.tiles.keys()) if (k < Math.floor(o / tw) - 3) S.tiles.delete(k);
  drawGroundEvents(mg, sc);
  if (L.fog > 0) { c.fillStyle = css(mix(L.haze, [230, 232, 236], .3), L.fog * .75); c.fillRect(0, 0, W, H); }
  // 近景：電柱や柵、道ばた
  const ny = H * .86;
  c.fillStyle = shc(mix(B.ground, [60, 90, 50], ctx.biome === 'desert' || W8.snowCover ? 0 : .3), 0); c.fillRect(0, ny, W, H - ny);
  const asia = POLES && P.ll[1] > 60 && (ctx.biome === 'farm' || ctx.biome === 'city' || ctx.biome === 'coast');
  const no = S.off.near;
  if (asia) {
    const gap = 520; for (let k = Math.floor(no / gap) - 1; k <= Math.floor((no + W) / gap) + 1; k++) {
      const x = k * gap - no; c.fillStyle = shc([96, 92, 88], 0); c.fillRect(x - 5, -10, 10, ny + 20);
      c.fillRect(x - 22, H * .1, 44, 4);
      c.strokeStyle = shc([40, 40, 40], 0, .8); c.lineWidth = 1.2; c.beginPath(); c.moveTo(x - 20, H * .1); c.quadraticCurveTo(x - gap / 2, H * .18, x - gap + 20, H * .1); c.moveTo(x + 20, H * .1 + 2); c.quadraticCurveTo(x + gap / 2, H * .19, x + gap - 20, H * .1 + 2); c.stroke();
    }
  } else if (ctx.biome !== 'city') {
    const gap = 70; c.fillStyle = shc([120, 96, 72], 0);
    for (let k = Math.floor(no / gap) - 1; k <= Math.floor((no + W) / gap) + 1; k++) { const x = k * gap - no; c.fillRect(x - 2, ny - 22, 4, 26); }
    c.fillRect(0, ny - 18, W, 2); c.fillRect(0, ny - 9, W, 2);
  } else {
    const gap = 300; for (let k = Math.floor(no / gap) - 1; k <= Math.floor((no + W) / gap) + 1; k++) {
      const x = k * gap - no; c.fillStyle = shc([90, 96, 104], 0); c.fillRect(x - 3, H * .2, 6, ny - H * .2 + 10); c.fillRect(x, H * .2, 40, 4);
      if (L.night > .5) { const gl = c.createRadialGradient(x + 38, H * .2 + 8, 2, x + 38, H * .2 + 8, 60); gl.addColorStop(0, 'rgba(255,220,150,.7)'); gl.addColorStop(1, 'rgba(255,220,150,0)'); c.fillStyle = gl; c.fillRect(x - 30, H * .2 - 50, 140, 120); }
    }
  }
  // 草のすじ（速さが伝わる）
  c.fillStyle = shc(mix(B.ground, [40, 60, 30], .35), 0, .6);
  for (let k = 0; k < 40; k++) { const x = ((h2(k, 3) * W * 2 - no * 1.1) % (W * 2) + W * 2) % (W * 2) - W * .2; c.fillRect(x, ny + h2(k, 4) * (H - ny) * .5, 30 + h2(k, 5) * 30, 1.5); }
  // 道路のはし
  c.fillStyle = shc([70, 72, 76], 0); c.fillRect(0, H * .95, W, H * .05); c.fillStyle = shc([236, 236, 230], 0); c.fillRect(0, H * .953, W, 2);
}

/* ----- 海の景色 ----- */
function drawSea(dt, W8, alt, ctx) {
  const roll = Math.sin(S.t * .55) * (0.4 + clamp(W8.wind / 50) * 3.2) * D2R, bob = Math.sin(S.t * .8) * (2 + clamp(W8.wind / 50) * 10);
  const hz = H * .47 + bob;
  c.save(); c.translate(W / 2, H * .7); c.rotate(roll); c.translate(-W / 2, -H * .7);
  drawSky(hz, W8, alt); drawSkyEvents(hz); drawClouds(hz, W8);
  const sc = Math.max(.7, Math.min(H, W * 1.6) / 360);
  // 遠くの島と船
  const tw = 500, o = S.off.far;
  for (let i = Math.floor(o / tw) - 1; i <= Math.floor((o + W) / tw) + 1; i++) {
    const r = h2(i, 41), x = i * tw - o + h2(i, 42) * 200;
    if (r < .06) { c.fillStyle = shc([90, 120, 110], .7); c.beginPath(); c.moveTo(x - 80 * sc, hz + 1); c.quadraticCurveTo(x, hz - (10 + h2(i, 43) * 22) * sc, x + 80 * sc, hz + 1); c.fill(); }
    else if (r < .14) { const big = h2(i, 44) < .5; c.fillStyle = shc(big ? [70, 80, 96] : [240, 240, 240], .55); if (big) { c.fillRect(x - 30 * sc, hz - 6 * sc, 60 * sc, 6 * sc); for (let k = 0; k < 6; k++) { c.fillStyle = shc([[200, 80, 60], [60, 120, 170], [220, 180, 60]][k % 3], .55); c.fillRect(x - 24 * sc + k * 7 * sc, hz - 11 * sc, 6 * sc, 5 * sc); } c.fillStyle = shc([240, 240, 240], .55); c.fillRect(x + 20 * sc, hz - 15 * sc, 8 * sc, 9 * sc); } else { c.beginPath(); c.moveTo(x, hz - 20 * sc); c.lineTo(x, hz - 3 * sc); c.lineTo(x + 12 * sc, hz - 3 * sc); c.fill(); c.fillRect(x - 8 * sc, hz - 3 * sc, 24 * sc, 3 * sc); } }
  }
  // 海
  const reg = ctx.region;
  let far = [96, 146, 186], near = [24, 74, 124];
  if (reg === 'hawaii' || reg === 'tropic') { far = [90, 180, 200]; near = [20, 110, 150]; }
  if (reg === 'north') { far = [100, 130, 150]; near = [30, 60, 80]; }
  const g = c.createLinearGradient(0, hz, 0, H); g.addColorStop(0, css(mix(sh(far, .3), L.haze, .35))); g.addColorStop(1, css(sh(near, 0)));
  c.fillStyle = g; c.fillRect(-W, hz, W * 3, H * 2);
  drawLandmarks(hz, sc, true);
  // 太陽・月の光の道
  const sunUp = alt > -1, mx = sunUp ? W * .74 : W * .24, ga = sunUp ? clamp(1 - L.k * 1.1) * (L.tw * .6 + .5) : clamp(1 - L.dl / .7) * clamp(1 - L.k) * .5;
  if (ga > .03) for (let k = 0; k < 70; k++) { const y = hz + (h2(k, 1) ** 1.6) * (H * .8 - hz), sp = (y - hz) / (H - hz); if (h2(k, Math.floor(S.t * 4 + k)) < .5) { c.fillStyle = sunUp ? css(mix([255, 250, 220], [255, 160, 90], L.tw), ga) : `rgba(255,250,220,${ga})`; c.fillRect(mx + (h2(k, 2) - .5) * (20 + sp * 140), y, 6 + sp * 20, 1 + sp * 2); } }
  // 波
  const rows = 26, wv = 1 + clamp(W8.wind / 40) * 1.5;
  for (let r = 0; r < rows; r++) {
    const t = (r + 1) / rows, y = hz + (t ** 1.9) * (H - hz), sp = .05 + t * 1.6, len = (8 + t * 60) * wv, gap = 30 + t * 120;
    const ox = (S.off.sea * sp + h2(r, 9) * 500) % gap;
    for (let x = -ox - gap; x < W + gap; x += gap) {
      const jx = x + h2(r * 100 + Math.floor((x + S.off.sea * sp) / gap), 2) * gap * .5;
      c.fillStyle = shc(r % 2 ? [190, 220, 240] : [10, 50, 90], .2 * (1 - t), .35 + t * .2); c.fillRect(jx, y, len, 1 + t * 2.4);
      if (W8.wind > 22 && h2(r, Math.floor((x + S.off.sea * sp) / gap)) < (W8.wind - 20) / 80) { c.fillStyle = shc([250, 252, 255], .2 * (1 - t), .8); c.fillRect(jx + len * .2, y - t * 2, len * .5, 1 + t * 1.6); }
    }
  }
  drawSeaEvents(hz, sc);
  if (L.fog > 0) { c.fillStyle = css(mix(L.haze, [230, 232, 236], .3), L.fog * .75); c.fillRect(-W, -H, W * 3, H * 3); }
  // 船のつくる白い波
  for (let k = 0; k < 26; k++) { const x = ((h2(k, 6) * W * 2 - S.off.near * 1.2) % (W * 2) + W * 2) % (W * 2) - W * .3; c.fillStyle = `rgba(255,255,255,${.25 + h2(k, 7) * .4})`; c.fillRect(x, H * (.74 + h2(k, 8) * .06), 40 + h2(k, 9) * 60, 2); }
  c.restore();
  // デッキの手すり（船といっしょに動くので回転しない）
  const ry = H * .8;
  c.fillStyle = shc([226, 230, 232], 0);
  c.fillRect(0, ry, W, 5); c.fillRect(0, ry + H * .06, W, 4);
  for (let x = 20; x < W; x += 90) c.fillRect(x, ry, 5, H * .14);
  c.fillStyle = shc([60, 92, 86], 0); c.fillRect(0, H * .93, W, H * .07);
  c.fillStyle = shc([255, 255, 255], 0, .25); c.fillRect(0, H * .93, W, 2);
  // 浮き輪
  const lx = Math.min(W * .14, 90), ly = ry + H * .055, lr = Math.max(14, H * .045);
  c.lineWidth = lr * .45; c.strokeStyle = shc([240, 110, 50], 0); c.beginPath(); c.arc(lx, ly, lr, 0, 7); c.stroke();
  c.strokeStyle = shc([250, 250, 250], 0); for (let k = 0; k < 4; k++) { c.beginPath(); c.arc(lx, ly, lr, k * Math.PI / 2 + .3, k * Math.PI / 2 + .75); c.stroke(); }
  if (L.night > .5) { const gl = c.createRadialGradient(W * .8, ry, 4, W * .8, ry, 90); gl.addColorStop(0, 'rgba(255,214,140,.3)'); gl.addColorStop(1, 'rgba(255,214,140,0)'); c.fillStyle = gl; c.fillRect(W * .8 - 90, ry - 90, 180, 180); c.fillStyle = 'rgba(255,230,170,.95)'; c.fillRect(W * .8 - 4, ry - 6, 8, 6); }

function pathFor(segList) {
  let d = '', last = null;
  for (const [a, b, t0, t1] of segList) {
    const n = Math.max(2, Math.ceil(hav(a, b) / 150 * (t1 - t0)));
    for (let k = 0; k <= n; k++) {
      const p = prj(slerp(a, b, lerp(t0, t1, k / n)));
      if (!last || Math.abs(p[0] - last[0]) > 360) d += `M${p[0].toFixed(1)} ${p[1].toFixed(1)}`; else d += `L${p[0].toFixed(1)} ${p[1].toFixed(1)}`;
      last = p;
    }
  }
  return d;
}
// 区間の中の from〜to km の部分だけを線にする
function legSegs(id, from = 0, to = Infinity) {
  const out = [];
  for (const sg of LEG[id].segs) {
    const a = Math.max(from, sg.start), b = Math.min(to, sg.start + sg.len);
    if (b > a) out.push([sg.a.ll, sg.b.ll, (a - sg.start) / sg.len, (b - sg.start) / sg.len]);
  }
  return out;
}
function showMap(zoom) {
  const done = [], ahead = [], alt = [];
  const d0 = Math.max(st.startKm || 0, st.km - roughLap());
  walk(L => {
    if (L.start > st.km + roughLap()) return false;
    if (L.fork && L.start > st.km) {
      const ch = st.choices[L.key];
      for (const o of L.options) (ch === o ? ahead : alt).push(...legSegs(o));
      if (!ch) return false;
      return;
    }
    if (!L.id) return false;
    done.push(...legSegs(L.id, d0 - L.start, st.km - L.start));
    if (L.start + LEG[L.id].len > st.km) ahead.push(...legSegs(L.id, st.km - L.start));
  });
  // 一度も通っていない道も薄く
  const all = []; for (const id in LEG) all.push(...legSegs(id));
  const me = prj(P.ll);
  const vb = zoom ? `${me[0] - 45} ${me[1] - 25} 90 50` : '0 0 720 300';
  const cities = new Map(); for (const id in LEG) for (const s of LEG[id].segs) cities.set(s.b.name, s.b.ll);
  const dots = [...cities].map(([n, ll]) => { const p = prj(ll); return `<circle cx="${p[0]}" cy="${p[1]}" r="${zoom ? .7 : 1.6}" class="${st.stamps[n] ? 'v' : 'u'}"/>` + (zoom ? `<text x="${p[0] + 1}" y="${p[1] - 1}">${n}</text>` : ''); }).join('');
  modal(`<h2>🗺 旅の地図</h2><div class="maptabs"><button data-z="0" class="${zoom ? '' : 'on'}">世界</button><button data-z="1" class="${zoom ? 'on' : ''}">ちかく</button></div>
  <svg class="map" viewBox="${vb}" preserveAspectRatio="xMidYMid meet"><rect x="-400" y="-400" width="1600" height="1200" class="sea"/><path d="${LAND}" class="land"/>
  <path d="${pathFor(all)}" class="r-all"/><path d="${pathFor(alt)}" class="r-alt"/><path d="${pathFor(ahead)}" class="r-ahead"/><path d="${pathFor(done)}" class="r-done"/>
  ${dots}<circle cx="${me[0]}" cy="${me[1]}" r="${zoom ? 1.6 : 5}" class="me"/><circle cx="${me[0]}" cy="${me[1]}" r="${zoom ? 1.6 : 5}" class="me2"/></svg>
  <div class="legend"><span><i class="l-done"></i>通ってきた道</span><span><i class="l-ahead"></i>これから</span><span><i class="l-alt"></i>えらばなかった道</span></div>
  <button class="big ghost" data-close>とじる</button>`, 'mapm');

if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });

/* ===== 観光モード ===== */
const CITY_COUNTRY = {}; for (const c in CITY_C) for (const n of CITY_C[c].split(' ')) CITY_COUNTRY[n] = c;
const FAST = QS.has('fast') ? 600 : 1; // テスト用：観光の時間を早送り
function parkedStop() { return P && P.seg ? P.seg.b : null; }
function sightOf(name) {
  const stop = parkedStop(); const c = CITY_COUNTRY[name] || 'JP', C = COUNTRY[c], X = CITY[name] || {};
  let biome = stop && stop.name === name ? stop.town : 'city';
  let spots = X.spots;

    if (c === 'JP' && (biome === 'mount' || biome === 'farm' || biome === 'forest')) spots = [spots[0], spots[1], ONSEN];

function ensureStay() { if (st.parked && (!st.stay || st.stay.city !== st.parked)) st.stay = { city: st.parked, done: {}, lodge: null }; return st.stay; }

  toast(`👣 ${it[0]} ${it[1]}へ出かけました<small>${durText(hours)}ほどでもどります。アプリを閉じても大丈夫</small>`, 5000);
}
function finishAct(quiet) {

// あいさつの読み上げ（スマホの読み上げ機能。その国の声がなければカタカナを日本語の声で）

const sayBtn = (t, r, c) => `<button class="say" data-say='${JSON.stringify([t, r, c]).replace(/'/g, '&#39;')}'>🔊</button>`;

  st.words[S0.wkey] = { w, city: st.parked, country: S0.C.name, c: S0.c }; save();

function showSight() {

/* ===== 時間の進み ===== */
let lastFrame = 0, lastSave = 0, lastHud = 0, prevBiome = '';
function tick() {

}
// 停車中は、着いた町の手前（来た道の終わり）を現在地にする
const curPos = () => posAt(st.parked ? Math.max(0, st.km - 0.05) : st.km);

cv.addEventListener('click', e => {
