<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>そらタブ</title>
<link rel="stylesheet" href="newtab.css">
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="fx"></canvas>

<main id="center">
  <div id="greet"></div>
  <div id="clock">--:--</div>
  <div id="date"></div>
  <div id="wx"></div>
  <form id="search" autocomplete="off">
    <input id="q" type="search" placeholder="" aria-label="search">
  </form>
</main>

<button id="gear" class="icon" title="">⚙︎</button>

<div id="panel" class="hidden" role="dialog" aria-modal="true">
  <div class="card">
    <h2 data-t="settings">せってい</h2>

    <h3 data-t="place">天気の場所</h3>
    <p class="now" id="placeNow"></p>
    <div class="line">
      <button class="btn" id="geo" data-t="useHere">いまの場所を使う</button>
      <button class="btn" id="noWx" data-t="noWeather">天気を使わない</button>
    </div>
    <form class="line" id="cityForm">
      <input id="city" type="text" data-ph="cityPh" placeholder="">
      <button class="btn" data-t="find">さがす</button>
    </form>
    <div id="cities"></div>

    <h3 data-t="scenery">けしき</h3>
    <select id="land"></select>

    <h3 data-t="display">表示</h3>
    <label class="chk"><input type="checkbox" id="h12"><span data-t="h12">12時間表示（午前・午後）</span></label>
    <label class="chk"><input type="checkbox" id="showSearch"><span data-t="showSearch">検索ボックスを出す</span></label>
    <label class="chk"><input type="checkbox" id="anim"><span data-t="anim">雨や雪を動かす</span></label>
    <div class="line">
      <span data-t="language">ことば</span>
      <select id="langSel"><option value="auto">Auto</option><option value="ja">日本語</option><option value="en">English</option></select>
    </div>

    <p class="small" data-t="privacy">天気を使うときだけ、場所（緯度・経度）を Open-Meteo（無料の天気サービス）に送ります。それ以外は、この端末の中だけで動きます。</p>
    <div class="line end"><button class="btn primary" id="close" data-t="close">とじる</button></div>
  </div>
</div>

<script src="engine.js"></script>
<script src="newtab.js"></script>
</body>
</html>
