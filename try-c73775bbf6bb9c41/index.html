<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<!-- hikkoshi --><script src="../common/hikkoshi.js"></script><!-- /hikkoshi -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>ひらがな あそび</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one toy-box screen. Home = 4 big play cards; each play fills the screen with a back button on top. */
:root{
  --bg:#eaf4f7; --card:#ffffff; --ink:#22343c; --muted:#5e7480;
  --sky:#bfe3f0; --accent:#ff7a59; --leaf:#4cb38a; --sun:#ffc93c; --line:#cfe1e8; --plum:#8f7ae0;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#142229; --card:#1d3039; --ink:#eef6f8; --muted:#9fb6bf;
  --sky:#1f4352; --accent:#ff8d70; --leaf:#5cc79c; --sun:#ffd25e; --line:#2e4955; --plum:#a08ff0; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.screen{max-width:900px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:10px;padding-block:12px 18px}
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.top .grow{flex:1}
.rb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer}
.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line)}
.btn{border:0;border-radius:999px;padding:10px 20px;background:var(--leaf);color:#fff;font-weight:700;cursor:pointer;font-size:1.05rem}
.btn.sub{background:var(--card);color:var(--ink);border:2px solid var(--line)}
.btn.big{font-size:1.35rem;padding:14px 30px}
/* home */
.logo{text-align:center;font-weight:900;font-size:2.1rem;letter-spacing:.06em;margin:6px 0 0}
.logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span:nth-child(2n){animation-delay:.3s;color:var(--accent)}
.logo span:nth-child(3n){color:var(--leaf)}
@keyframes bob{50%{transform:translateY(-5px)}}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.mode{position:relative;border:0;border-radius:24px;padding:16px 10px;cursor:pointer;color:#fff;font-weight:900;font-size:1.2rem;line-height:1.25;
  display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 6px 0 rgba(0,0,0,.12);min-height:150px;justify-content:center}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.12)}
.mode .ic{font-size:3.2rem;line-height:1}
.mode small{font-weight:700;font-size:.8rem;opacity:.95}
.m1{background:#4aa8d8}.m2{background:#ef8a5c}.m3{background:#53b37f}.m4{background:#b57ad6}
.lock{position:absolute;top:8px;right:10px;font-size:1.2rem}
.homebar{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* stage */
.stage{position:relative;flex:1;min-height:440px;background:var(--card);border-radius:24px;border:2px solid var(--line);overflow:hidden;display:flex;flex-direction:column}
.ask{font-size:1.15rem;font-weight:700;text-align:center;padding:10px 8px 4px;min-height:2.6em}
.ask .k{font-size:2.1rem;color:var(--accent);vertical-align:-.15em}
#sky{position:relative;flex:1;background:linear-gradient(var(--sky),var(--card));overflow:hidden;touch-action:none}
.bub{position:absolute;left:0;top:0;width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;
  font-size:3.4rem;font-weight:900;color:var(--ink);cursor:pointer;will-change:transform;
  background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.95) 0 10%,rgba(255,255,255,.25) 11% 45%,rgba(160,220,255,.25) 70%,rgba(255,180,230,.35) 100%);
  box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 4px 14px rgba(0,60,90,.15);transition:opacity .25s}
.bub.no{animation:no .4s}
@keyframes no{25%{translate:-10px 0}75%{translate:10px 0}}
.spark{position:absolute;font-size:1.6rem;pointer-events:none;animation:spark .8s forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}}
.tiles{display:flex;justify-content:center;gap:14px;flex-wrap:wrap;padding:12px}
.tile{font-weight:900;font-size:3rem;width:96px;height:96px;border-radius:22px;border:3px solid var(--line);background:var(--card);cursor:pointer;box-shadow:0 5px 0 var(--line)}
.tile:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.tile.no{animation:no .4s;border-color:var(--accent)}
.slots{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;padding:8px}
.slot{width:76px;height:76px;border-radius:18px;border:3px dashed var(--line);display:flex;align-items:center;justify-content:center;font-size:2.6rem;font-weight:900;color:var(--muted)}
.slot.now{border-color:var(--accent);border-style:solid;animation:glow 1s infinite alternate}
.slot.done{border-style:solid;border-color:var(--leaf);background:var(--leaf);color:#fff}
.slot.fix{border-style:solid;color:var(--ink)}
@keyframes glow{to{box-shadow:0 0 0 6px rgba(255,122,89,.3)}}
.center{flex:1;display:flex;flex-direction:column;justify-content:center;gap:6px;padding-block:8px}
.who{font-size:4rem;text-align:center;line-height:1}
.silh{font-size:7.5rem;text-align:center;line-height:1.1;transition:filter .6s,transform .6s}
.silh.dark{filter:brightness(0) opacity(.22)}
.silh.show{transform:scale(1.15) rotate(-4deg)}
.namebox{display:flex;flex-direction:column;align-items:center;gap:12px;padding:20px;text-align:center}
.namebox input{font:inherit;font-size:1.5rem;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:11em;text-align:center}
.namebox p{margin:0;color:var(--muted);line-height:1.6}
/* karuta */
.kgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;padding:12px;flex:1;align-content:center;position:relative}
.kcard{aspect-ratio:3/4;max-width:100%;border-radius:12px;border:3px solid #d9b98a;background:#fffaf0;color:#2a2a2a;cursor:pointer;
  display:flex;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 0 #d9b98a;padding:0}
.kcard .e{font-size:2.3rem;line-height:1}
.kcard .l{position:absolute;top:4px;left:5px;width:1.6em;height:1.6em;line-height:1.6em;border-radius:50%;background:#c0392b;color:#fff;font-size:1.2rem;font-weight:900;text-align:center}
.kcard.taken{visibility:hidden}
.kcard.no{animation:no .4s}
.hand{position:absolute;left:0;top:0;font-size:3rem;z-index:3;pointer-events:none}
.scores{display:flex;justify-content:space-around;padding:8px;border-top:2px solid var(--line);font-weight:700}
.scores b{font-size:1.6rem;font-variant-numeric:tabular-nums;margin-left:6px}
.seg{display:flex;gap:4px;background:var(--bg);border-radius:999px;padding:3px}
.seg button{border:0;background:transparent;border-radius:999px;padding:6px 12px;cursor:pointer;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.seg small{font-size:.65rem;margin-left:2px}
#courses button{padding:6px 10px}
.segrow{display:flex;justify-content:center;padding:10px 8px 0}
#btnAgain{font-size:1.2rem;padding:5px 14px}
.yomi{font-size:1.2rem;font-weight:700;text-align:center;min-height:1.7em;padding:6px 8px 0}
.choose{position:absolute;inset:0;background:rgba(255,255,255,.82);display:flex;align-items:center;justify-content:center;gap:16px;z-index:4;flex-wrap:wrap;padding:16px}
@media (prefers-color-scheme:dark){.choose{background:rgba(20,34,41,.85)}}
.cheer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:2.2rem;font-weight:900;color:var(--accent);pointer-events:none;z-index:5;text-align:center;padding:16px;animation:cheer 1.6s forwards}
@keyframes cheer{0%{transform:scale(.4);opacity:0}25%{transform:scale(1.1);opacity:1}80%{opacity:1}100%{opacity:0}}
/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;padding:10px}
.zk{aspect-ratio:1;border-radius:16px;border:2px solid var(--line);background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:1.9rem;font-weight:900;cursor:pointer;padding:0}
.zk small{font-size:.7rem;letter-spacing:-.05em;color:var(--sun);min-height:1em}
.zk.got{background:#fff6d6;border-color:var(--sun);color:#3a2d00}
.zk.blank{visibility:hidden}
.zani{display:flex;flex-wrap:wrap;gap:8px;padding:12px;justify-content:center}
.zani button{width:64px;height:64px;font-size:2.2rem;border-radius:16px;border:2px solid var(--line);background:var(--card);cursor:pointer;padding:0;position:relative}
.zani button.dark span{filter:brightness(0) opacity(.2)}
.zani .lock{font-size:.9rem;top:2px;right:4px}
h2{margin:6px 12px 0;font-size:1.1rem}
/* parent */
.panel{background:var(--card);border-radius:20px;border:2px solid var(--line);padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0;font-size:1.05rem}
.panel p{margin:0;color:var(--muted);font-size:.88rem;line-height:1.6}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
select,.panel input{font:inherit;font-size:1rem;padding:8px 10px;border-radius:10px;border:2px solid var(--line);background:var(--bg);color:var(--ink)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-weight:700;z-index:50;animation:cheer 2.6s forwards;white-space:nowrap}
.bub.two{font-size:2.5rem;letter-spacing:-.04em}
.tile.two{font-size:2.1rem;letter-spacing:-.04em}
.slot.two{font-size:1.8rem;letter-spacing:-.06em}
.zk.two{font-size:1.35rem;letter-spacing:-.06em}
#sets{align-self:center}
#sets button{padding:6px 12px;font-size:1.05rem;white-space:nowrap}
#sets .lk{font-size:.65rem;margin-left:1px;vertical-align:.15em}
.prog{display:flex;flex-direction:column;gap:8px}
.pbar{display:flex;align-items:center;gap:8px;font-weight:700}
.pbar .nm{min-width:4.2em}
.pbar .bar{flex:1;height:12px;border-radius:999px;background:var(--bg);border:1px solid var(--line);overflow:hidden}
.pbar .bar i{display:block;height:100%;background:var(--leaf);border-radius:999px}
.pbar .n{font-variant-numeric:tabular-nums;min-width:4.5em;text-align:right;font-size:.9rem}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips span{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:3px 9px;font-weight:900;font-size:1.15rem}
.chips em{font-style:normal;font-size:.75rem;color:var(--muted);margin-left:3px;font-weight:700}
.recdot{display:inline-block;width:.8em;height:.8em;border-radius:50%;background:#e23;margin-right:6px;animation:glow .6s infinite alternate}
@media (max-width:520px){
  .bub.two{font-size:2rem}.tile.two{font-size:1.75rem}.slot.two{font-size:1.35rem}
  .bub{width:88px;height:88px;font-size:2.7rem}
  .tile{width:78px;height:78px;font-size:2.5rem}
  .slot{width:58px;height:58px;font-size:2rem}
  .kgrid{grid-template-columns:repeat(3,1fr);gap:8px}
  .silh{font-size:5.8rem}
  .mode{min-height:130px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app/icon-192.png">
<link rel="apple-touch-icon" href="app/icon-192.png">
<script src="../common/app.js" defer></script>
<!-- /app -->
</head>
<body>

<!-- home -->
<section class="screen" id="home">
  <div class="top"><div class="seg" id="courses" role="group" aria-label="course"><button data-c="hira">あいう</button><button data-c="abcja">ABC<small>にほんご</small></button><button data-c="abcen">ABC<small>English</small></button></div><span class="grow"></span><button class="rb" id="btnSnd"></button></div>
  <h1 class="logo" id="logo"></h1>
  <div class="seg" id="sets" role="group" aria-label="letters"></div>
  <div class="modes">
    <button class="mode m1" data-mode="shabon"><span class="ic">🫧</span><span data-t="m1"></span><small data-t="m1s"></small></button>
    <button class="mode m2" data-mode="namae"><span class="ic">🧒</span><span data-t="m2"></span><small data-t="m2s"></small></button>
    <button class="mode m3" data-mode="doubutsu"><span class="ic">🐾</span><span data-t="m3"></span><small data-t="m3s"></small></button>
    <button class="mode m4" data-mode="karuta"><span class="ic">🎴</span><span data-t="m4"></span><small data-t="m4s"></small></button>
  </div>
  <div class="homebar">
    <button class="btn sub" id="btnZukan" data-t="zukan"></button>
    <button class="btn sub" id="btnParent" data-t="parent"></button>
  </div>
</section>

<!-- play -->
<section class="screen" id="play" hidden>
  <div class="top">
    <button class="rb" id="btnHome" data-t="back"></button>
    <span class="pill" id="score"></span>
    <span class="grow"></span>
    <span id="extra"></span>
    <button class="rb" id="btnAgain" data-t="again"></button>
  </div>
  <div class="stage" id="stage"></div>
</section>

<!-- zukan -->
<section class="screen" id="zukan" hidden>
  <div class="top"><button class="rb" id="zBack" data-t="back"></button><span class="grow"></span><span class="pill" id="zCount"></span></div>
  <div class="stage" style="overflow:auto">
    <h2 data-t="zLetters"></h2>
    <div class="zgrid" id="zLetters"></div>
    <h2 data-t="zAnimals"></h2>
    <div class="zani" id="zAnimals"></div>
  </div>
</section>

<!-- parent -->
<section class="screen" id="parent" hidden>
  <div class="top"><button class="rb" id="pBack" data-t="back"></button></div>
  <div class="panel">
    <h3 data-t="pProg"></h3>
    <div class="prog" id="pProg"></div>
  </div>
  <div class="panel">
    <h3 data-t="pName"></h3>
    <p data-t="pNameNote"></p>
    <div class="row"><input id="pNameIn" maxlength="8" aria-label="name"><button class="btn" id="pNameSave" data-t="save"></button></div>
    <p data-t="pRecNote"></p>
    <div class="row"><button class="btn sub" id="pRec"></button><button class="btn sub" id="pRecPlay" data-t="recPlay"></button><button class="btn sub" id="pRecDel" data-t="recDel"></button><span id="pRecMsg"></span></div>
  </div>
  <div class="panel">
    <h3 data-t="pVoice"></h3>
    <div class="row"><select id="pVoice" aria-label="voice"></select><button class="btn sub" id="pVoiceTest" data-t="test"></button></div>
    <p data-t="pVoiceNote"></p>
  </div>
  <div class="panel">
    <h3 data-t="pHow"></h3>
    <p id="pHowText"></p>
  </div>
  <div class="panel">
    <h3 data-t="pShop"></h3>
    <div class="row" id="kkSlot"></div>
  </div>
  <div class="panel">
    <h3 data-t="pReset"></h3>
    <div class="row"><button class="btn sub" id="pReset" data-t="pResetBtn"></button><span id="pResetMsg"></span></div>
  </div>
</section>

<script src="../common/kakin.js"></script>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id);
const rnd=n=>Math.floor(Math.random()*n);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// ================= data =================
const KANA='あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'.split('');
const ABC='ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
const SCRIPT={
  ja:{letters:KANA,key:i=>'k'+i,
    // 形がわかりやすい字から。似ている字（ぬ・め、わ・れ・ね など）は後のほう
    order:'あいうえおかくこしつてとのへもらんまやゆよすそたなにはひふみむりろきけさせちねるをほわれぬめ'.split(''),
    similar:['ぬめ','われね','はほま','さち','るろ','いり','あおめ','きさ','しつ','くへ','まも','こい','ゆよ','たな','そろ'],
    norm:s=>s.replace(/[ァ-ン]/g,c=>String.fromCharCode(c.charCodeAt(0)-96)),
    valid:/^[ぁ-んー]+$/},
  en:{letters:ABC,key:i=>'a'+i,
    order:'AOSXHTUKZBMLCDEFGIJNPQRVWY'.split(''),
    similar:['MWN','EF','OQCG','PRB','IL','UV','DO','KX','VW'],
    norm:s=>s.toUpperCase(),valid:/^[A-Z]+$/},
};
// ---- もじの なかま（v0.4）: ひらがな → がぎぐ（濁音・半濁音）→ きゃ（ねじれる音）→ カタカナ／ABC → abc（小文字）
const DAKU='がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ'.split('');
const YOUON='きゃ きゅ きょ しゃ しゅ しょ ちゃ ちゅ ちょ にゃ にゅ にょ ひゃ ひゅ ひょ みゃ みゅ みょ りゃ りゅ りょ ぎゃ ぎゅ ぎょ じゃ じゅ じょ びゃ びゅ びょ ぴゃ ぴゅ ぴょ'.split(' ');
const h2k=w=>w.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
const KATA=KANA.map(h2k);
const abc=ABC.map(c=>c.toLowerCase());
const SETS={
  ja:[
    {id:'sei',letters:KANA,key:i=>'k'+i,order:SCRIPT.ja.order,similar:SCRIPT.ja.similar,form:w=>w},
    {id:'daku',letters:DAKU,key:i=>'d'+i,form:w=>w,
      order:'がござぞどばぶぼぐげじずだでびべぎぜぱぽぴぷぺぢづ'.split(''),
      similar:['ばぱ','びぴ','ぶぷ','べぺ','ぼぽ','じぢ','ずづ','ぎざ','ぐぺ','ぶぷふ']},
    {id:'you',letters:YOUON,key:i=>'j'+i,form:w=>w,
      order:'きゃ きゅ きょ しゃ しゅ しょ にゃ にゅ にょ みゃ みゅ みょ ちゃ ちゅ ちょ りゃ りゅ りょ ひゃ ひゅ ひょ じゃ じゅ じょ ぎゃ ぎゅ ぎょ びゃ びゅ びょ ぴゃ ぴゅ ぴょ'.split(' '),
      similar:['きゃぎゃ','きゅぎゅ','きょぎょ','しゃじゃちゃ','しゅじゅちゅ','しょじょちょ','ひゃびゃぴゃ','ひゅびゅぴゅ','ひょびょぴょ']},
    {id:'kata',letters:KATA,key:i=>'k'+i,form:h2k,  // 声は ひらがなと 同じ（カ＝か）
      order:'アイウエオカクコシツテトノヘモランマヤユヨスソタナニハヒフミムリロキケサセチヌネルヲホワレメ'.split(''),
      similar:['シツ','ソンリ','ウワ','クタケ','コユ','ナメ','ヌスフ','ルレ','チテ','マム','ヲラ','ノメ','シミ','ハへ','カヤ','エユ','ホオ','サセ','トヒ']},
  ],
  en:[
    {id:'upper',letters:ABC,key:i=>'a'+i,order:SCRIPT.en.order,similar:SCRIPT.en.similar,form:w=>w},
    {id:'lower',letters:abc,key:i=>'a'+i,form:w=>w.toLowerCase(),  // 声は 大文字と 同じ（a＝A）
      order:'oxszcuvwkmtaeilhrnfjydbpqg'.split(''),
      similar:['bdpq','mnh','ilj','uvwy','ceo','ao','nr','gq','ft','hn','ij']},
  ],
};
const setsOf=L=>SETS[L];
const allSets=()=>SETS.ja.concat(SETS.en);
function setOf(ch){for(const st of allSets())if(st.letters.includes(ch))return st;return null}
// ことばを 字の まとまりに わける（きゃ は 1つ）
function tok(w){const out=[],a=[...w];for(let i=0;i<a.length;i++){const two=a[i]+(a[i+1]||'');if(a[i+1]&&YOUON.includes(two)){out.push(two);i++}else out.push(a[i])}return out}

// 1つのアプリに 3つのコース。ui = 案内の ことば／声、scr = おぼえる 文字
const COURSES={
  hira:{ui:'ja',scr:'ja',game:'hiragana'},
  abcja:{ui:'ja',scr:'en',game:'abc'},   // 日本の子どもが ABC（案内は日本語、ABC と ことばは 英語の発音）
  abcen:{ui:'en',scr:'en',game:'abc'},   // 英語圏の子ども（すべて英語）
};
// ================= store =================
const KEY='hiragana-v1';
let S={course:null,voice:'ai:1',snd:true,name:{},got:{},zukan:{},unlock:{},set:{},unl:{},miss:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null');if(s){S=Object.assign(S,s);
  // v0.1 の きろく（ja / en）を コースへ うつす
  for(const f of ['name','got','zukan','unlock']){const o=S[f]||{};if('ja' in o){o.hira=o.hira??o.ja;delete o.ja}if('en' in o){o.abcen=o.abcen??o.en;delete o.en}S[f]=o}
  if(!S.course&&S.lang)S.course=S.lang==='en'?'abcen':'hira';delete S.lang}}catch(e){}
for(const c in COURSES){S.name[c]=S.name[c]||'';S.got[c]=S.got[c]||{};S.zukan[c]=S.zukan[c]||[];S.unlock[c]=S.unlock[c]||6;S.miss[c]=S.miss[c]||{};
  const L=COURSES[c].scr;S.unl[c]=S.unl[c]||{};S.unl[c][SETS[L][0].id]=S.unl[c][SETS[L][0].id]||S.unlock[c];  // v0.3 までの unlock は さいしょの なかま
  if(!SETS[L].some(st=>st.id===S.set[c]))S.set[c]=SETS[L][0].id}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function pickCourse(){const q=new URLSearchParams(location.search);const c=q.get('course');if(COURSES[c])return c;
  if(q.get('lang')==='en')return 'abcen';if(q.get('lang')==='ja')return 'hira';
  if(S.course&&COURSES[S.course])return S.course;
  try{const g=localStorage.getItem('games-lang');if(g==='en')return 'abcen';if(g==='ja')return 'hira'}catch(e){}

let curSrc=null,gen=0;

  const n=innerWidth<520?9:12;const picked=[];
  for(const f of shuffle(FUDA[SCR].map((f,i)=>[...f,i]))){if(picked.length>=n)break;if(picked.some(p=>sim(p[0],f[0])))continue;picked.push(f)}
  S4.cards=picked.map(f=>({f,taken:false}));
  const g=$('grid');g.appendChild(hand);
  S4.cards.forEach(c=>{const b=document.createElement('button');b.className='kcard';c.lb=(SC().id==='kata'||SC().id==='lower')?SC().form(c.f[0]):c.f[0];b.innerHTML=`<span class="l">${c.lb}</span><span class="e">${c.f[1]}</span>`;b.setAttribute('aria-label',c.lb);
    b.onpointerdown=e=>{e.preventDefault();tap4(c,b)};c.el=b;g.appendChild(b)});
  prep(['ready','took0','took1','robo_took','par_took','kid_win','par_win','robo_win','draw','again']);
  const r=run;say('ready').then(()=>next4(r))}
async function next4(r){if(r!==run)return;const left=S4.cards.filter(c=>!c.taken);
  if(!left.length){const robo=S4.mode==='robo';const res=S4.sc>S4.so?'kid':S4.sc<S4.so?(robo?'robo':'par'):'draw';
    $('yomi').textContent=T().win[res];cheer(T().win[res]);sfx.ok();
    await say({kid:'kid_win',par:'par_win',robo:'robo_win',draw:'draw'}[res],'again');await wait(1500);if(r===run)startMode('karuta');return}
  const c=left[rnd(left.length)];S4.target=c;S4.lock=false;$('yomi').textContent='';
  prep(['y'+c.f[3]]);again=()=>say('y'+c.f[3]);
  await say('y'+c.f[3]);if(r!==run||S4.target!==c)return;
  $('yomi').textContent=SCR==='ja'?'「'+c.f[2]+'」':'“'+c.f[2]+'”'+mean(c.f[0]);
  if(S4.mode==='robo')startHand(c,r)}
function tap4(c,b){audio();if(S4.lock||c.taken||!S4.target)return;
  if(c!==S4.target){sfx.ng();shake(b);missLetter(S4.target.lb);if(!speaking())say('sore',letterKey(c.lb));return}
  S4.lock=true;
  if(S4.mode==='oya'){const d=document.createElement('div');d.className='choose';
    d.innerHTML=`<button class="btn big" id="wKid">${T().kidGot}</button><button class="btn big sub" id="wPar">${T().parGot}</button>`;
    $('stage').appendChild(d);$('wKid').onclick=()=>{d.remove();take4(c,'kid')};$('wPar').onclick=()=>{d.remove();take4(c,'opp')}}
  else take4(c,'kid')}
async function take4(c,who){const r=run;stopHand();S4.lock=true;c.taken=true;c.el.classList.add('taken');S4.target=null;
  if(who==='kid'){S4.sc++;$('sc').textContent=S4.sc;sfx.pop();gotLetter(c.lb);await say(rnd(2)?'took0':'took1',letterKey(c.lb))}
  else{S4.so++;$('so').textContent=S4.so;tone(400,.15,'triangle');await say(S4.mode==='robo'?'robo_took':'par_took')}
  await wait(500);next4(r)}
function startHand(c,r){stopHand();const g=$('grid');const G=g.getBoundingClientRect(),R=c.el.getBoundingClientRect();
  hand.hidden=false;const from=`translate(${G.width/2-24}px,${G.height-20}px)`,to=`translate(${R.left-G.left+R.width/2-24}px,${R.top-G.top+R.height/2-24}px)`;
  hand.style.transform=from;
  const dur=6500+rnd(2500); // おさない子でも まにあう はやさ
  S4.t1=setTimeout(()=>{if(r!==run)return;try{hand.animate([{transform:from},{transform:to}],{duration:dur,fill:'forwards'})}catch(e){hand.style.transform=to}
    S4.t2=setTimeout(()=>{if(r===run&&S4.target===c&&!S4.lock){S4.lock=true;take4(c,'opp')}},dur)},1200)}

// ================= ずかん =================
// ずかんの ならべかた（なかまごと）
const GOJU=['あいうえお','かきくけこ','さしすせそ','たちつてと','なにぬねの','はひふへほ','まみむめも','や ゆ よ','らりるれろ','わ を ん'];
function zCells(st){if(st.id==='sei'||st.id==='kata'){const c=[];GOJU.forEach(r=>[...r.padEnd(5,' ')].slice(0,5).forEach(x=>c.push(x===' '?' ':st.form(x))));return {cols:5,cells:c}}
  if(st.id==='daku')return {cols:5,cells:DAKU};if(st.id==='you')return {cols:3,cells:YOUON};return {cols:6,cells:st.letters}}
function openZukan(){run++;hush();show('zukan');const t=T();const st=SC();
  $('zCount').textContent=t.zCount(learnedCount(),st.letters.length);
  $('zLetters').innerHTML=SETS[SCR].map(x=>{const {cols,cells}=zCells(x);const open=setOpen(x);
    return `<h2 style="margin:10px 2px 2px">${t.setName[x.id]}${open?'':' 🔒'}</h2><div class="zgrid" style="grid-template-columns:repeat(${cols},minmax(0,1fr));padding:4px 0">`+
    cells.map(c=>{if(c===' ')return '<div class="zk blank"></div>';const n=Math.min(3,S.got[COURSE][c]||0);
      return `<button class="zk${two(c)}${n>=3?' got':''}" data-k="${c}">${c}<small>${'⭐'.repeat(n)}</small></button>`}).join('')+'</div>'}).join('');
  $('zLetters').style.display='block';
  $('zLetters').onclick=e=>{const b=e.target.closest('.zk');if(!b||!b.dataset.k)return;audio();if(!setOpen(setOf(b.dataset.k))){Kakin.ask();return}if(!speaking()){const k=letterKey(b.dataset.k);prep([k]);say(k)}};
  const z=S.zukan[COURSE];
  $('zAnimals').innerHTML=ANIMALS[SCR].map((a,i)=>{const got=z.includes(a[0]);return `<button class="${got?'':'dark'}" data-i="${i}" aria-label="${got?a[1]:'?'}"><span>${a[2]}</span>${animalOpen(i)?'':'<span class="lock">🔒</span>'}</button>`}).join('');
  $('zAnimals').onclick=e=>{const b=e.target.closest('button');if(!b)return;audio();const i=+b.dataset.i;if(!animalOpen(i)){Kakin.ask();return}
    const a=ANIMALS[SCR][i];if(z.includes(a[0])&&!speaking()){prep(['an_'+a[0]]);say('an_'+a[0])}}}
$('btnZukan').onclick=()=>{audio();sfx.tap();openZukan()};

// ================= おうちのかた =================
let resetArm=false;
function openParent(){run++;hush();show('parent');renderHome();const t=T();
  $('pNameIn').value=S.name[COURSE]||'';
  $('pVoice').innerHTML=[1,2,3,4].map(n=>`<option value="ai:${n}">${t.aiVoice(n)}</option>`).join('')+`<option value="dev">${t.devVoice}</option><option value="off">${t.noVoice}</option>`;
  $('pVoice').value=S.voice;$('pHowText').textContent=t.how;$('pResetMsg').textContent='';resetArm=false;
  renderProg();renderRec()}
// すすみぐあい（おうちのかた）
function renderProg(){const t=T(),g=S.got[COURSE],m=S.miss[COURSE];
  const bars=SETS[SCR].map(st=>{const n=st.letters.filter(k=>(g[k]||0)>=3).length,N=st.letters.length;
    return `<div class="pbar"><span class="nm">${t.setName[st.id]}</span><span class="bar"><i style="width:${Math.round(n/N*100)}%"></i></span><span class="n">${t.progN(n,N)}</span></div>`}).join('');
  const all=SETS[SCR].flatMap(st=>st.letters);
  const near=all.filter(k=>(g[k]||0)>0&&(g[k]||0)<3);
  const hard=all.filter(k=>(m[k]||0)>=2).sort((a,b)=>(m[b]/(1+(g[b]||0)))-(m[a]/(1+(g[a]||0)))).slice(0,10);
  const chips=(a,f)=>a.length?`<div class="chips">${a.map(k=>`<span>${k}${f?`<em>${f(k)}</em>`:''}</span>`).join('')}</div>`:`<p>${t.progNone}</p>`;
  $('pProg').innerHTML=bars+`<p><b>${t.progNear}</b></p>`+chips(near,k=>'⭐'.repeat(g[k]))+`<p><b>${t.progHard}</b></p>`+chips(hard,k=>t.missN(m[k]))+`<p>${t.progNote}</p>`}

// ---- おうちの人の声で なまえを よぶ（録音は この端末の中 IndexedDB だけ）
const REC_DB='hiragana-rec';
function recDb(){return new Promise((res,rej)=>{const r=indexedDB.open(REC_DB,1);r.onupgradeneeded=()=>r.result.createObjectStore('rec');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function getRec(){try{const d=await recDb();return await new Promise(res=>{const q=d.transaction('rec').objectStore('rec').get('name-'+COURSE);q.onsuccess=()=>res(q.result||null);q.onerror=()=>res(null)})}catch(e){return null}}
async function putRec(b){const d=await recDb();await new Promise((res,rej)=>{const tx=d.transaction('rec','readwrite');b?tx.objectStore('rec').put(b,'name-'+COURSE):tx.objectStore('rec').delete('name-'+COURSE);tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
let recBuf={};
async function playRec(g){const b=await getRec();if(!b||g!==gen)return;const a=audio();if(!a)return;
  try{const id=COURSE+':'+b.size;if(!recBuf[id])recBuf[id]=await new Promise((res,rej)=>b.arrayBuffer().then(x=>a.decodeAudioData(x,res,rej)));
    if(g!==gen)return;await new Promise(res=>{const s=a.createBufferSource();s.buffer=recBuf[id];s.connect(a.destination);curSrc=s;let done=false;const fin=()=>{if(!done){done=true;curSrc=null;res()}};s.onended=fin;setTimeout(fin,recBuf[id].duration*1000+400);s.start()})}catch(e){}}
let recState=null;
async function renderRec(){const t=T();const b=await getRec();
  $('pRec').innerHTML=recState?`<span class="recdot"></span>${t.recStop}`:(b?t.recAgain:t.recStart);
  $('pRecPlay').hidden=!b||!!recState;$('pRecDel').hidden=!b||!!recState}
$('pRec').onclick=async()=>{const t=T();audio();
  if(recState){recState.stop();return}
  if(!navigator.mediaDevices||!window.MediaRecorder){$('pRecMsg').textContent=t.recNo;return}
  let stream;try{stream=await navigator.mediaDevices.getUserMedia({audio:true})}catch(e){$('pRecMsg').textContent=t.recDenied;return}
  const mr=new MediaRecorder(stream),chunks=[];mr.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  const tm=setTimeout(()=>{try{mr.stop()}catch(e){}},4000);
  mr.onstop=async()=>{clearTimeout(tm);stream.getTracks().forEach(x=>x.stop());recState=null;
    const blob=new Blob(chunks,{type:mr.mimeType||'audio/webm'});
    if(blob.size>800){await putRec(blob);recBuf={};$('pRecMsg').textContent=t.recSaved;hush();say('@rec')}else $('pRecMsg').textContent=t.recShort;
    renderRec()};
  recState={stop:()=>{try{mr.stop()}catch(e){}}};mr.start();$('pRecMsg').textContent=t.recHint;renderRec()};
$('pRecPlay').onclick=()=>{audio();hush();say('@rec')};
$('pRecDel').onclick=async()=>{await putRec(null);recBuf={};$('pRecMsg').textContent=T().recDeleted;renderRec()};
$('btnParent').onclick=()=>{audio();sfx.tap();openParent()};
$('pNameSave').onclick=()=>{const v=SC().norm($('pNameIn').value.trim());if(v&&!SC().valid.test(v)){shake($('pNameIn'));return}S.name[COURSE]=v;save();toast(T().saved)};
$('pVoice').onchange=e=>{S.voice=e.target.value;save()};
$('pVoiceTest').onclick=()=>{audio();hush();prep(['hello']);say('hello')};
$('pReset').onclick=()=>{if(!resetArm){resetArm=true;$('pResetMsg').textContent=T().pResetSure;return}
  S.got[COURSE]={};S.zukan[COURSE]=[];S.unlock[COURSE]=6;S.unl[COURSE]={};S.miss[COURSE]={};save();resetArm=false;$('pResetMsg').textContent=T().pResetDone};

// ================= 課金（おためし版） =================
// ひらがな と ABC は べつの「ぜんぶ版」（ABC は にほんご／English の 2コース で 共通）。ファミリーパスなら ぜんぶ。
function setupKakin(){if(!window.Kakin||!Kakin.setup)return;const g=COURSES[COURSE].game;
  Kakin.setup({game:g,lang:()=>UI,onChange:()=>{if(!$('parent').hidden)openParent();else if(!$('home').hidden)renderHome()},
    name:g==='abc'?{ja:'ABC あそび',en:'ABC Play'}:{ja:'ひらがな あそび',en:'Hiragana Play'},
    free:{ja:(g==='abc'?TEXT.abcja:TEXT.ja).kkFree,en:TEXT.en.kkFree},full:{ja:(g==='abc'?TEXT.abcja:TEXT.ja).kkFull,en:TEXT.en.kkFull}});
  $('kkSlot').innerHTML='';$('kkSlot').appendChild(Kakin.parentButton())}
if(window.Kakin)setupKakin();else window.Kakin={full:()=>false,ask:()=>{},open:()=>{}};

document.addEventListener('visibilitychange',()=>{if(document.hidden)hush()});
renderHome();
})();
