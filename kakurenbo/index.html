<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#d9f2c4">
<title>もういいかい？ かくれんぼ</title>
<style>
:root{
  --bg:#eaf7dc; --ink:#3f3a2a; --card:#ffffff; --accent:#ff8a3d; --accent2:#5aa9e6; --ok:#2fbf71; --soft:#ffe9c7;
  --line:#e2d4b0; --shadow:0 4px 0 rgba(90,70,20,.18);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Hiragino Maru Gothic ProN","Rounded Mplus 1c","Kosugi Maru","Hiragino Sans","Noto Sans JP",sans-serif;
  overscroll-behavior:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
.screen{position:fixed;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom)}
.screen.on{display:flex}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;line-height:1}

/* タイトル */
#title,#where,#photo{align-items:center;gap:14px;overflow:auto;padding-top:calc(env(safe-area-inset-top) + 20px);padding-bottom:24px}
h1{margin:0;font-size:clamp(30px,8.4vw,52px);text-align:center;line-height:1.2;letter-spacing:.03em}
h1 .q{color:var(--accent);display:inline-block;animation:bob 2.2s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
.peekers{font-size:42px;display:flex;gap:6px;margin:-4px 0 -6px}
.peekers span{display:inline-block;animation:peekT 3s ease-in-out infinite}
.peekers span:nth-child(2){animation-delay:.5s}.peekers span:nth-child(3){animation-delay:1s}
@keyframes peekT{0%,60%,100%{transform:translateY(0)}75%{transform:translateY(-12px) rotate(-8deg)}}
.big{display:flex;align-items:center;gap:14px;width:min(440px,100%);padding:14px 18px;border-radius:24px;background:var(--card);
  box-shadow:var(--shadow);font-size:21px;font-weight:700;text-align:left;flex:none}
.big .emo{font-size:40px}
.big small{display:block;font-size:13px;font-weight:400;opacity:.75;margin-top:2px}
.big:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(90,70,20,.18)}
.lvl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;align-items:center;font-size:15px;width:min(440px,100%)}
.lvl button{padding:8px 12px;border-radius:16px;background:var(--soft);font-weight:700;line-height:1.25;min-width:80px}
.lvl button small{display:block;font-size:11px;font-weight:400;opacity:.8}
.lvl button.sel{background:var(--accent);color:#fff}
.box{width:min(440px,100%);background:var(--card);border-radius:20px;padding:12px 14px;box-shadow:var(--shadow);flex:none}
.box b{font-size:15px}
.book{display:flex;flex-wrap:wrap;gap:2px;margin-top:6px;font-size:28px}
.book span{width:36px;text-align:center}
.book span.no{filter:brightness(0);opacity:.13}
.foot{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 12px;font-size:14px}
.foot button{background:none;text-decoration:underline;opacity:.75;padding:6px}
.back{align-self:flex-start;background:none;font-size:16px;padding:6px 0;opacity:.8}
#scenes{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(440px,100%)}
#scenes button{border-radius:22px;padding:16px 6px 12px;box-shadow:var(--shadow);font-size:17px;font-weight:700;display:flex;flex-direction:column;align-items:center;gap:6px}
#scenes button .emo{font-size:48px}

/* ゲーム */
#game{padding:0;touch-action:none}
#eyes,#spots{touch-action:none}
.bar{display:flex;align-items:center;gap:8px;height:64px;flex:none;padding:env(safe-area-inset-top) 10px 0;box-sizing:content-box;position:relative;z-index:4}
.round{width:50px;height:50px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);font-size:24px;display:grid;place-items:center;flex:none}
.round:active{transform:translateY(3px);box-shadow:none}
#slots{flex:1;display:flex;justify-content:center;gap:4px;min-width:0;flex-wrap:wrap}
#slots i{font-style:normal;font-size:30px;width:40px;height:40px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.6)}
#slots i.no>*{filter:brightness(0);opacity:.22}
#slots i.got{animation:pop .5s;background:#fff}
#slots img{width:34px;height:34px;border-radius:50%;object-fit:cover}
#barMsg{flex:1;text-align:center;font-weight:700;font-size:17px;min-width:0}
@keyframes pop{40%{transform:scale(1.5)}}
#stage{flex:1;position:relative;min-height:0;overflow:hidden;--u:4px;touch-action:none;margin-top:calc(-64px - env(safe-area-inset-top));}
#stage.photo{background:#222}
.deco{position:absolute;transform:translate(-50%,-50%);pointer-events:none;opacity:.9}
.spot{position:absolute;transform:translate(-50%,-50%);}
.spot .cov{position:absolute;inset:0;font-size:calc(var(--u)*var(--s));display:grid;place-items:center;z-index:2;transition:transform .5s cubic-bezier(.3,1.4,.5,1);transform-origin:50% 90%}
.spot .cov.wob{animation:wob .5s}
@keyframes wob{20%{transform:rotate(-8deg)}45%{transform:rotate(7deg)}70%{transform:rotate(-4deg)}}
.hid{position:absolute;font-size:calc(var(--u)*var(--h));width:calc(var(--u)*var(--h));height:calc(var(--u)*var(--h));display:grid;place-items:center;z-index:1;
  transition:transform .55s cubic-bezier(.3,1.6,.5,1)}
.hid img,.intro img,.face{width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.25);display:block}
.hid .in{display:block;transform:rotate(var(--tilt,0deg))}
.hid.peek .in{animation:peekA 1.3s ease-in-out}
@keyframes peekA{40%,60%{transform:translateY(calc(var(--u)*var(--h)*var(--pk,-.3))) rotate(calc(var(--tilt,0deg) * -1))}}
.spot.found .cov{transform:translateX(42%) rotate(14deg)}
.spot.found .hid{z-index:3;transform:translateY(calc(var(--u)*var(--h)*-.55)) scale(1.3)}
.spot.glow .cov{filter:drop-shadow(0 0 10px #fff36b) drop-shadow(0 0 18px #ffd23f);animation:wob .6s 2}
.spot.me .cov{filter:drop-shadow(0 0 8px rgba(255,255,255,.95))}
.crit{position:absolute;pointer-events:none;z-index:5;transform:translate(-50%,-50%);animation:fly 1.6s ease-out forwards}
@keyframes fly{0%{transform:translate(-50%,-30%) scale(.4);opacity:0}20%{opacity:1;transform:translate(-50%,-90%) scale(1)}100%{transform:translate(-10%,-320%) scale(.9);opacity:0}}
.kusu{position:absolute;pointer-events:none;z-index:5;font-weight:900;color:#fff;-webkit-text-stroke:1.5px #c46a1b;font-size:calc(var(--u)*4.5);
  transform:translate(-50%,-50%);animation:kusu 1.4s ease-out forwards;white-space:nowrap}
@keyframes kusu{0%{opacity:0;transform:translate(-50%,-20%)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-160%)}}
.intro{position:absolute;left:50%;top:52%;transform:translate(-50%,-50%);display:flex;gap:calc(var(--u)*2);z-index:6;pointer-events:none}
.intro>span{display:block;font-size:calc(var(--u)*14);width:calc(var(--u)*14);height:calc(var(--u)*14);animation:hop .6s ease-in-out infinite alternate}
.intro>span:nth-child(2n){animation-delay:.3s}
@keyframes hop{to{transform:translateY(calc(var(--u)*-3))}}
.flyer{position:fixed;z-index:20;pointer-events:none;transition:all .7s cubic-bezier(.5,-.3,.6,1);display:grid;place-items:center}

/* しゃしんで かくれる */
#stage .pimg{position:absolute;pointer-events:none}
.ph{position:absolute}
.ph .hid{left:0;top:0}
.ph .pc{position:absolute;z-index:2;pointer-events:none;background-repeat:no-repeat;-webkit-mask-image:linear-gradient(to bottom,transparent 0,#000 5px);mask-image:linear-gradient(to bottom,transparent 0,#000 5px)}
.ph.found .pc{opacity:0;transition:opacity .3s}
.ph.found .hid{z-index:3;transform:translateY(-35%) scale(1.35)}
.ph.glow::after{content:"";position:absolute;left:-30%;top:-30%;right:-30%;bottom:-30%;border-radius:50%;box-shadow:0 0 0 4px #ffd23f,0 0 24px 8px rgba(255,210,63,.8);animation:ring 1s 3}
@keyframes ring{50%{transform:scale(.8)}}
.ripple{position:absolute;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid rgba(255,255,255,.9);pointer-events:none;animation:rip .6s ease-out forwards;z-index:5}
@keyframes rip{from{transform:scale(.2);opacity:1}to{transform:scale(1.4);opacity:0}}

/* めを つぶる */
#eyes{position:fixed;inset:0;z-index:12;display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;
  background:radial-gradient(circle at 50% 40%,#5b4a8a,#2d2550);color:#fff;text-align:center;padding:16px}
#eyes.on{display:flex}
#eyes.fade{animation:fadeO .5s forwards}
@keyframes fadeO{to{opacity:0}}
#eyes .monkey{font-size:110px;animation:bob 1.2s ease-in-out infinite}
@media (max-height:520px){#eyes{gap:6px}#eyes .monkey{font-size:64px}#eyes .num{font-size:64px;height:72px;line-height:72px}#eyes .msg{font-size:18px}.ask{font-size:22px;padding:12px 24px}.reply{font-size:26px}}
#eyes .msg{font-size:22px;font-weight:700;opacity:.9;min-height:1.4em}
#eyes .num{font-size:96px;font-weight:900;height:110px;line-height:110px;color:#ffd23f}
#eyes .num.pop{animation:numP .5s}
@keyframes numP{0%{transform:scale(.3)}60%{transform:scale(1.2)}}
.ask{font-size:28px;font-weight:900;padding:18px 30px;border-radius:999px;background:#ffd23f;color:#5b3b00;box-shadow:0 6px 0 #c79a12;animation:breath 1.4s ease-in-out infinite}
.ask:active{transform:translateY(4px);box-shadow:0 2px 0 #c79a12}
@keyframes breath{50%{transform:scale(1.07)}}
.reply{font-size:34px;font-weight:900;color:#fff;-webkit-text-stroke:2px #ff8a3d;min-height:1.3em}

/* こんどは きみが かくれる */
#oni{position:absolute;z-index:6;transform:translate(-50%,-50%);transition:left 1s ease-in-out,top 1s ease-in-out;pointer-events:none;
  font-size:calc(var(--u)*16);width:calc(var(--u)*16);height:calc(var(--u)*16);display:grid;place-items:center}
#oni .in{display:block;width:100%;height:100%;text-align:center}
#oni.walk .in{animation:walk .35s ease-in-out infinite alternate}
@keyframes walk{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(calc(var(--u)*-1.5))}}
#bubble{position:absolute;z-index:7;transform:translate(-50%,-100%);background:#fff;border-radius:18px;padding:6px 12px;font-weight:900;font-size:clamp(16px,calc(var(--u)*5),26px);
  box-shadow:0 3px 0 rgba(0,0,0,.15);white-space:nowrap;pointer-events:none;display:none}
#bubble.on{display:block;animation:pop .4s}
#cbtns{position:absolute;left:0;right:0;bottom:calc(16px + env(safe-area-inset-bottom));display:none;justify-content:center;gap:12px;z-index:8;padding:0 12px}
#cbtns.on{display:flex}
#cbtns button{font-size:22px;font-weight:900;padding:14px 20px;border-radius:999px;box-shadow:0 5px 0 rgba(0,0,0,.2)}
#cbtns .mada{background:#fff;color:#7a5a20}
#cbtns .ready{background:#ffd23f;color:#5b3b00;animation:breath 1.4s ease-in-out infinite}
#doki{position:absolute;left:50%;top:22%;transform:translate(-50%,-50%);font-size:clamp(30px,calc(var(--u)*10),60px);font-weight:900;color:#ff5d7a;-webkit-text-stroke:2px #fff;
  z-index:8;pointer-events:none;display:none}
#doki.on{display:block;animation:doki .5s ease-in-out infinite}
@keyframes doki{50%{transform:translate(-50%,-50%) scale(1.15)}}

#say{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);font-size:clamp(38px,11vw,72px);font-weight:900;color:#fff;
  -webkit-text-stroke:3px var(--accent);text-shadow:0 5px 0 rgba(0,0,0,.12);pointer-events:none;opacity:0;white-space:nowrap;z-index:9}
#say.on{animation:sayA 1.5s ease-out forwards}
@keyframes sayA{0%{opacity:0;transform:translate(-50%,-50%) scale(.3)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}40%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-60%)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:15}

.modal{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(40,40,20,.35);z-index:14;padding:16px}
.modal.on{display:flex}
.panel{background:var(--card);border-radius:28px;padding:20px 18px;width:min(400px,100%);text-align:center;box-shadow:0 8px 0 rgba(90,70,20,.18);animation:panelIn .45s cubic-bezier(.3,1.5,.5,1);max-height:calc(100dvh - 32px);overflow:auto}
@keyframes panelIn{from{transform:scale(.6);opacity:0}}
.panel h2{margin:0;font-size:28px;color:var(--accent)}
.panel p{margin:6px 0 10px}
.panel .big{width:100%;justify-content:center;margin-top:10px;background:var(--soft)}
#rewardRow{display:flex;justify-content:center;flex-wrap:wrap;gap:6px;font-size:56px;margin:10px 0;min-height:60px}
#rewardRow>span{display:block;width:60px;height:60px;animation:hop .5s ease-in-out infinite alternate}
#rewardRow>span:nth-child(2n){animation-delay:.25s}
.pick{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;margin:6px 0 12px}
.pick button{width:64px;height:64px;border-radius:18px;background:var(--soft);font-size:40px;display:grid;place-items:center;padding:6px}
.pick button.sel{background:var(--accent);box-shadow:0 0 0 3px #fff inset}
.pick button img{width:50px;height:50px}

#help .panel{text-align:left;font-size:15px;line-height:1.7}
#help h3{margin:16px 0 4px;font-size:18px}
.note{font-size:13px;opacity:.75;line-height:1.6;margin:4px 0 8px}
.opt{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0}
.opt button{padding:8px 12px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px}
.opt button.sel{background:var(--accent);color:#fff}
.vrow{display:flex;gap:6px;margin-top:6px;align-items:center}
.vrow select{flex:1;min-width:0;font:inherit;font-size:14px;padding:8px;border-radius:12px;border:2px solid var(--line);background:#fff;color:var(--ink)}
.rb{padding:8px 10px;border-radius:12px;background:var(--soft);font-weight:700;font-size:14px;flex:none}
.rb.rec{background:#ff5d5d;color:#fff;animation:breath 1s infinite}
.rb:disabled{opacity:.35}
.recrow{display:flex;align-items:center;gap:6px;padding:6px 0;border-bottom:1px dashed var(--line)}
.recrow span{flex:1;font-weight:700;font-size:14px}

/* しゃしん がめん */
.thumbs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.thumbs .t{position:relative;aspect-ratio:4/3;border-radius:14px;overflow:hidden;background:#ddd;box-shadow:var(--shadow)}
.thumbs .t img{width:100%;height:100%;object-fit:cover;display:block}
.thumbs .x{position:absolute;right:4px;top:4px;width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.55);color:#fff;font-size:15px;display:grid;place-items:center}
.faces{display:flex;flex-wrap:wrap;gap:10px;margin-top:8px}
.faces .t{position:relative;width:64px;height:64px}
.faces .t .x{right:-4px;top:-4px}
.row2{display:flex;gap:8px;margin-top:8px}
.row2 .rb{flex:1;padding:12px 8px;font-size:15px}
.empty{font-size:13px;opacity:.6;margin-top:6px}
input[type=file]{display:none}
#crop .panel{text-align:center}
#cropBox{position:relative;width:min(280px,70vw);height:min(280px,70vw);margin:10px auto;overflow:hidden;border-radius:16px;background:#333;touch-action:none}
#cropBox img{position:absolute;left:50%;top:50%;transform-origin:0 0;max-width:none;pointer-events:none}
#cropBox .ring{position:absolute;inset:8%;border-radius:50%;box-shadow:0 0 0 999px rgba(0,0,0,.55);border:3px dashed #fff;pointer-events:none}
#cropZoom{width:100%}

#spots .bar{background:rgba(255,255,255,.9);height:auto;min-height:64px;padding:calc(env(safe-area-inset-top) + 6px) 10px 6px}
#spotsNote{flex:1;font-size:14px;font-weight:700;line-height:1.4}
#spotStage{flex:1;position:relative;background:#222;touch-action:none;overflow:hidden}
#spotStage img{position:absolute}
.mk{position:absolute;width:44px;height:44px;margin:-22px 0 0 -22px;border-radius:50%;background:rgba(255,138,61,.85);border:3px solid #fff;color:#fff;font-weight:900;display:grid;place-items:center;font-size:18px;pointer-events:none}
#spots .foot2{display:flex;gap:10px;padding:10px 10px calc(10px + env(safe-area-inset-bottom));background:rgba(255,255,255,.9)}
#spots .foot2 button{flex:1;padding:14px;border-radius:16px;font-weight:900;font-size:17px;background:var(--soft)}
#spots .foot2 .go{background:var(--accent);color:#fff}
#spots{padding:0}
</style>
</head>
<body>

<!-- タイトル -->
<section class="screen on" id="title">
  <div class="peekers emo"><span>🐰</span><span>🦊</span><span>🐻</span></div>
  <h1 id="tTitle"></h1>
  <button class="big" id="mA"><span class="emo">🌳</span><span><span data-t="modeA"></span><small data-t="modeAsub"></small></span></button>
  <button class="big" id="mB"><span class="emo">📷</span><span><span data-t="modeB"></span><small data-t="modeBsub"></small></span></button>
  <button class="big" id="mC"><span class="emo">🙈</span><span><span data-t="modeC"></span><small data-t="modeCsub"></small></span></button>
  <div class="lvl" id="lvl"></div>
  <div class="box"><b data-t="book"></b> <span id="bookCount"></span><div class="book emo" id="book"></div></div>
  <div class="foot">
    <button id="btnHelp" data-t="help"></button>
    <button id="btnSnd"></button>
    <button id="btnLang">English</button>
    <button id="btnGames" data-t="games"></button>
  </div>
</section>

<!-- ばしょ えらび -->
<section class="screen" id="where">
  <button class="back" id="whereBack" data-t="backTxt"></button>
  <h1 style="font-size:30px" data-t="whereTitle"></h1>
  <div id="scenes"></div>
</section>

<!-- しゃしんで あそぶ -->
<section class="screen" id="photo">
  <button class="back" id="photoBack" data-t="backTxt"></button>
  <h1 style="font-size:28px" data-t="modeB"></h1>
  <div class="box">
    <b data-t="rooms"></b>
    <div class="note" data-t="roomsNote"></div>
    <div class="row2"><button class="rb" id="roomCam" data-t="takePhoto"></button><button class="rb" id="roomPick" data-t="pickPhoto"></button></div>
    <div class="thumbs" id="roomList"></div>
  </div>
  <div class="box">
    <b data-t="faces"></b>
    <div class="note" data-t="facesNote"></div>
    <div class="row2"><button class="rb" id="faceCam" data-t="faceCam"></button><button class="rb" id="facePick" data-t="pickPhoto"></button></div>
    <div class="faces" id="faceList"></div>
  </div>
  <div class="note" style="width:min(440px,100%)" data-t="privacy"></div>
  <input type="file" accept="image/*" capture="environment" id="fRoomCam">
  <input type="file" accept="image/*" id="fRoomPick">
  <input type="file" accept="image/*" capture="user" id="fFaceCam">
  <input type="file" accept="image/*" id="fFacePick">
</section>

<!-- かくれる ばしょを えらぶ（おうちのかた） -->
<section class="screen" id="spots">
  <div class="bar"><button class="round" id="spotsBack">←</button><div id="spotsNote"></div></div>
  <div id="spotStage"></div>
  <div class="foot2"><button id="spotsClear" data-t="spotsClear"></button><button class="go" id="spotsGo" data-t="play"></button></div>
</section>

<!-- ゲーム -->
<section class="screen" id="game">
  <div class="bar">
    <button class="round" id="btnHome">🏠</button>
    <div id="slots"></div><div id="barMsg"></div>
    <button class="round" id="btnHint">💡</button>
  </div>
  <div id="stage"></div>
</section>

<div id="eyes">
  <div class="monkey emo">🙈</div>
  <div class="msg" id="eyesMsg"></div>
  <div class="num" id="eyesNum"></div>
  <div class="reply" id="eyesReply"></div>
  <button class="ask" id="btnAsk" style="visibility:hidden"></button>
</div>

<div class="modal" id="clear"><div class="panel">
  <h2 id="clearH"></h2>
  <div id="rewardRow" class="emo"></div>
  <p id="clearP"></p>
  <button class="big" id="btnAgain"><span class="emo">🔁</span><span data-t="again"></span></button>
  <button class="big" id="btnOther"><span class="emo">🗺️</span><span data-t="other"></span></button>
  <button class="big" id="btnBackHome"><span class="emo">🏠</span><span data-t="home"></span></button>
</div></div>

<div class="modal" id="cpick"><div class="panel">
  <h2 data-t="whoHide"></h2>
  <div class="pick emo" id="pickMe"></div>
  <h2 style="font-size:22px" data-t="whoSeek"></h2>

let dbP = null;
function db() {

    r.onupgradeneeded = () => { for (const s of ['voice', 'room', 'face']) r.result.createObjectStore(s); };
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function dbOp(st, mode, fn) {
  const d = await db();
  return new Promise((res, rej) => { const tx = d.transaction(st, mode); const q = fn(tx.objectStore(st)); tx.oncomplete = () => res(q && q.result); tx.onerror = () => rej(tx.error); });
}
const dbGet = (st, k) => dbOp(st, 'readonly', s => s.get(k));

const dbDel = (st, k) => dbOp(st, 'readwrite', s => s.delete(k));

  const d = await db();
  return new Promise((res, rej) => {
    const out = []; const tx = d.transaction(st, 'readonly'); const c = tx.objectStore(st).openCursor();
    c.onsuccess = () => { const cur = c.result; if (cur) { out.push({ key: cur.key, val: cur.value }); cur.continue(); } };
    tx.oncomplete = () => res(out); tx.onerror = () => rej(tx.error);
  });
}

async function loadRecs() {

    for (const { key, val } of await dbAll('voice')) {

}

function layoutCovers(scene, K) {
  const r = stage.getBoundingClientRect();
  const W = r.width, H = r.height, top = H * (W > H * 1.15 ? scene.zone * .8 : scene.zone), bot = H * .97, u = Math.min(W, H - 64) / 100;
  const land = W > H * 1.15;
  const cols = land ? 4 : 3, rows = land ? 2 : 3;
  const cw = W / cols, ch = (bot - top) / rows;
  const S = Math.min(cw * .9, ch) * .84 / u;
  const cells = shuffle([...Array(cols * rows).keys()]).slice(0, K);
  const pool = shuffle([...scene.covers]);
  return cells.map((c, i) => {
    const col = c % cols, row = Math.floor(c / cols);
    const jx = (cw - S * u) / 2 * .6, jy = (ch - S * u) / 2 * .4;
    const half = S * u / 2 + 10;
    const x = Math.min(W - half, Math.max(half, (col + .5) * cw + rnd(-jx, jx))), y = Math.min(bot - half * .9, top + (row + .5) * ch + rnd(-jy, jy));
    return { x: x / W * 100, y: y / H * 100, S, e: pool[i % pool.length] };
  });
}
function buildScene(scene) {

  const side = WIDE.has(c.e) && Math.random() < .5 ? pick(['l', 'r']) : 't';
  const d = document.createElement('div'); d.className = 'hid emo';
  let left, top, tilt, pk;
  if (side === 't') { left = (c.S - H) / 2 + rnd(-.15, .15) * c.S; top = .1 * c.S - .06 * H - vis * H; tilt = rnd(-10, 10); pk = '-.35'; }
  else {
    const dir = side === 'l' ? -1 : 1;
    left = side === 'l' ? .08 * c.S - vis * H * 1.1 : c.S - .08 * c.S - H + vis * H * 1.1;
    top = c.S * .62 - H * .5; tilt = dir * 18; pk = '0'; d.style.setProperty('--px', dir);
  }
  d.style.cssText += `--h:${H};left:calc(var(--u)*${left});top:calc(var(--u)*${top});--tilt:${tilt}deg;--pk:${pk}`;
  d.innerHTML = `<span class="in">${hiderHTML(h)}</span>`;

}

{

function fitRect(boxW, boxH, w, h) { const s = Math.min(boxW / w, boxH / h); return { s, w: w * s, h: h * s, x: (boxW - w * s) / 2, y: (boxH - h * s) / 2 }; }

$('#spotStage').addEventListener('pointerdown', e => {

  const sp = spotEdit.room.spots;
  const near = sp.findIndex(p => Math.hypot((p[0] - px) * R.w, (p[1] - py) * R.h) < 28);
  if (near >= 0) sp.splice(near, 1); else if (sp.length < 10) sp.push([+px.toFixed(4), +py.toFixed(4)]);

function startB(key, room) {
  mode = 'B'; curRoom = { key, room }; const L = LEVELS[level];
  show('game'); setTheme('#222222'); fitStage(); prepVoice();
  stage.innerHTML = ''; stage.className = 'photo'; stage.style.background = '';
  $('#btnHint').style.visibility = 'visible';
  const img = document.createElement('img'); img.className = 'pimg'; img.src = room.img; stage.appendChild(img);
  // かくれる ひと: かお → どうぶつ
  const animals = shuffle([...SCENES.ouchi.hiders, ...SCENES.mori.hiders]);
  const faces = shuffle([...FACES]);
  const hs = [];
  for (let i = 0; i < L.n; i++) hs.push(i < faces.length && (i === 0 || Math.random() < .6) ? { face: faces[i].url, fkey: 1 } : { e: animals[i] });
  if (Math.random() < .18) { const i = irnd(0, hs.length - 1); if (!hs[i].face) hs[i] = { e: pick(RARE), rare: true }; }
  // ばしょ: おうちのかたが えらんだ ところ → たりなければ ランダム
  let pts = shuffle([...room.spots]).slice(0, hs.length);
  while (pts.length < hs.length) {
    const p = [rnd(.12, .88), rnd(.3, .9)];
    if (pts.every(q => Math.hypot((q[0] - p[0]) * room.w, (q[1] - p[1]) * room.h) > Math.min(room.w, room.h) * .2)) pts.push(p);
    else if (Math.random() < .05) pts.push(p);
  }
  hs.forEach((h, i) => { h.p = pts[i]; h.photo = true; });

  renderSlots(); layoutPhoto();
  run(() => hideSequence());
}
function layoutPhoto() {
  const r = stage.getBoundingClientRect();
  const R = fitRect(r.width, r.height - 64, G.room.w, G.room.h); R.y += 64;
  G.R = R;
  Object.assign(G.img.style, { left: R.x + 'px', top: R.y + 'px', width: R.w + 'px', height: R.h + 'px' });
  for (const h of G.hs) if (h.el) placeOnePhoto(h);
}
function placePhotoHiders() { for (const h of G.hs) placeOnePhoto(h); }
function placeOnePhoto(h) {
  const R = G.R, L = G.L;
  const size = Math.min(R.w, R.h) * (L.n === 1 ? .2 : L.n === 3 ? .16 : .13);
  const vis = Math.min(.55, L.vis + .1); // しゃしんは ごちゃごちゃ しているので すこし おおめに みせる
  const cx = R.x + h.p[0] * R.w, line = R.y + h.p[1] * R.h; // line: ここから したは しゃしんで かくす
  let box = h.box;
  if (!box) {

    box.innerHTML = `<div class="hid emo"><span class="in">${hiderHTML(h)}</span></div><div class="pc"></div>`;
    stage.appendChild(box); h.box = box; h.el = box.querySelector('.hid');
  }
  const top = line - size * vis;
  Object.assign(box.style, { left: (cx - size / 2) + 'px', top: top + 'px', width: size + 'px', height: size + 'px' });
  const hd = h.el; hd.style.cssText = `--h:${size};font-size:${size}px;width:${size}px;height:${size}px;--tilt:${(h.tilt ??= rnd(-10, 10))}deg;--pk:-.3`;
  hd.style.setProperty('--u', '1px');
  const pc = box.querySelector('.pc');
  const padX = size * .15, ph = size * (1 - vis) + 6;
  Object.assign(pc.style, {
    left: -padX + 'px', top: (size * vis - 5) + 'px', width: (size + padX * 2) + 'px', height: ph + 'px',
    backgroundImage: `url(${G.room.img})`, backgroundSize: `${R.w}px ${R.h}px`,
    backgroundPosition: `${R.x - (cx - size / 2 - padX)}px ${R.y - (top + size * vis - 5)}px`
  });
  h.cx = cx; h.cy = line - size * vis / 2; h.size = size;
}
function onPhotoTap(e) {
  const b = stage.getBoundingClientRect(), x = e.clientX - b.left, y = e.clientY - b.top;
  const rp = document.createElement('div'); rp.className = 'ripple'; rp.style.left = x + 'px'; rp.style.top = y + 'px'; stage.appendChild(rp); setTimeout(() => rp.remove(), 650);
  let best = null, bd = 1e9;
  for (const h of G.hs) if (!h.found) { const d = Math.hypot(h.cx - x, h.cy - y); if (d < bd) { bd = d; best = h; } }
  if (best && bd < Math.max(48, best.size * .85)) foundPhoto(best);
  else { sfx.wob(); if (Math.random() < .35) speak('miss'); }
}

function moveOni(o, x, y, dx, dy) {

function oniSay(txt, ms = 1400) {

function hideMe(c) {

  putHider(c, G.me, .42); c.el.classList.add('me'); G.mySpot = c; sfx.pop();
}
function onCTap(e) {
  const spotEl = e.target.closest('.spot'); if (!spotEl) return;
  const c = G.covers.find(c => c.el === spotEl); if (!c) return;
  if (G.phase === 'hide' || G.phase === 'count' || G.phase === 'ask') {
    hideMe(c);
    if (G.phase === 'hide') { G.phase = 'count'; run(() => oniCount(5)); }
  } else if (G.phase === 'tell') {
    if (c === G.mySpot) { G.phase = 'end'; run(() => cWin()); }
    else { c.el.querySelector('.cov').classList.remove('wob'); void c.el.offsetWidth; c.el.querySelector('.cov').classList.add('wob'); sfx.wob(); }

async function oniCount(n) {
  $('#barMsg').textContent = T('counting');
  for (let i = 0; i < n; i++) { oniSay(lang === 'ja' ? ['いーち', 'にーい', 'さーん', 'しーい', 'ごー'][i] : ['One', 'Two', 'Three', 'Four', 'Five'][i], 900); sfx.tick(); speak('num', i); await wait(1000); }
  G.phase = 'ask'; oniSay(T('ask'), 0); speak('ask');
  $('#barMsg').textContent = '';
  const btns = $('#cbtns'); btns.classList.add('on');
  const r = await new Promise(res => { btns.querySelector('.mada').onclick = () => res('mada'); btns.querySelector('.ready').onclick = () => res('ready'); });
  btns.classList.remove('on'); audio();
  if (r === 'mada') { speak('mada'); await wait(1300); return oniCount(3); }
  speak('ready'); G.phase = 'seek'; await wait(1300); await oniSeek();

async function oniSeek() {
  $('#barMsg').textContent = T('seeking');
  const o = G.oni, others = shuffle(G.covers.filter(c => c !== G.mySpot));
  const found = Math.random() < (level === 0 ? .4 : .5);
  const checks = found ? others.slice(0, irnd(1, 3)) : others.slice(0, irnd(3, 4));
  if (found) checks.push(G.mySpot);
  for (const c of checks) {
    const mine = c === G.mySpot;
    // ちかくに いく
    o.classList.add('walk');
    moveOni(o, c.x, c.y, (c.x < 35 ? -1 : 1) * c.S * .62, c.S * .1); // はしの ときは はんたいがわに たつ
    $('#bubble').classList.remove('on');
    if (mine || Math.hypot(c.x - G.mySpot.x, c.y - G.mySpot.y) < 30) { $('#doki').classList.add('on'); sfx.heart(); setTimeout(sfx.heart, 600); }
    for (let k = 0; k < 3; k++) { sfx.step(); await wait(330); }
    o.classList.remove('walk');
    oniSay(T('koko'), 0); speak('koko'); await wait(1100);
    if (mine) {
      $('#doki').classList.remove('on');
      c.el.classList.add('found'); sfx.found(); sayBig(T('found')); speak('found', 0); oniSay('😆', 0);
      await wait(1600); speak('lose'); await wait(500);

    }
    c.el.querySelector('.cov').classList.remove('wob'); void c.el.offsetWidth; c.el.querySelector('.cov').classList.add('wob'); sfx.wob();
    await wait(500);
    oniSay(T('inai'), 0); speak('inai'); await wait(1200);
    $('#doki').classList.remove('on');
  }
  // みつからなかった
  moveOni(o, 50, SCENES[sceneId].zone * 100, 0, 10); o.classList.add('walk');
  await wait(1000); o.classList.remove('walk');
  oniSay(T('maitta'), 0); speak('maitta');
  await wait(1800);
  G.phase = 'tell'; $('#barMsg').textContent = T('tellMe');
  await wait(5000);

let recState = null;
async function startRec(k, btn) {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const mr = new MediaRecorder(stream); const chunks = [];
    mr.ondataavailable = e => chunks.push(e.data);
    mr.onstop = async () => {
      stream.getTracks().forEach(t => t.stop());
      const blob = new Blob(chunks, { type: mr.mimeType }); const ab = await blob.arrayBuffer();
      try { await dbPut('voice', k, ab.slice(0)); } catch (e) {}
      try { const a = audio(); recBuf[k] = await new Promise((res, rej) => a.decodeAudioData(ab, res, rej)); playBuf(recBuf[k]); } catch (e) {}
      recState = null; renderHelp();
    };
    mr.start(); recState = { mr, k, t: setTimeout(stopRec, 3000) };
    btn.textContent = T('stop'); btn.classList.add('rec');
  } catch (e) { alert(lang === 'ja' ? 'マイクが つかえませんでした' : 'Microphone not available'); }
}
function stopRec() { if (recState) { clearTimeout(recState.t); try { recState.mr.stop(); } catch (e) {} } }
$('#recList').onclick = async e => {
  const b = e.target.closest('button'); if (!b) return; const k = b.closest('.recrow').dataset.k; audio();
  if (b.dataset.a === 'rec') { if (recState) stopRec(); else startRec(k, b); }
  else if (b.dataset.a === 'play' && recBuf[k]) playBuf(recBuf[k]);
  else if (b.dataset.a === 'del') { delete recBuf[k]; try { await dbDel('voice', k); } catch (e) {} renderHelp(); }
};

  c.width = innerWidth; c.height = innerHeight;
  const cols = ['#ff8a3d', '#ffd23f', '#2fbf71', '#4b9be0', '#ff6fa3', '#a77bff'];
  const ps = Array.from({ length: 120 }, () => ({ x: rnd(0, c.width), y: rnd(-c.height * .5, 0), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), r: rnd(0, 6), vr: rnd(-.2, .2), c: pick(cols), s: rnd(6, 12) }));
  const t0 = performance.now();
  (function f(now) {
    x.clearRect(0, 0, c.width, c.height);
    for (const p of ps) { p.x += p.vx; p.y += p.vy; p.r += p.vr; x.save(); x.translate(p.x, p.y); x.rotate(p.r); x.fillStyle = p.c; x.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); x.restore(); }
    if (now - t0 < 3200) requestAnimationFrame(f); else x.clearRect(0, 0, c.width, c.height);
  })(t0);
}

// はじめの タップで おとと ろくおんを よみこむ
document.addEventListener('pointerdown', function once() { document.removeEventListener('pointerdown', once); audio(); loadRecs(); prepVoice(); }, { once: true });
loadFaces();
renderTitle();
</script>
