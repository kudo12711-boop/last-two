<!doctype html>
<html lang="ja">
<head>

<title>ころころ ゆきだま</title>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: home = 3 big cards. Play = top bar + one line of words + one canvas + (palette when decorating) + a row of big buttons. */
:root{
  --bg:#eef6ff; --card:#ffffff; --ink:#2f3a4a; --muted:#6c7a8c; --line:#d6e4f2;
  --accent:#ff7a59; --leaf:#4cb38a; --sun:#ffc93c; --sky:#5aa6e6; --plum:#8a72d8;
  --font:"Zen Maru Gothic","Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141c28; --card:#1f2a3a; --ink:#eef3fa; --muted:#a9b6c6; --line:#33425a;
  --accent:#ff8d70; --leaf:#5cc79c; --sun:#ffd25e; --sky:#74b6f0; --plum:#a690f0; color-scheme:dark}}
[hidden]{display:none!important}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;
  padding:env(safe-area-inset-top,0px) max(14px,env(safe-area-inset-right,0px)) env(safe-area-inset-bottom,0px) max(14px,env(safe-area-inset-left,0px));
  -webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;overflow:hidden}
button{font:inherit;color:inherit}
button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.screen{max-width:760px;margin:0 auto;height:100%;display:flex;flex-direction:column;gap:8px;padding-block:10px 14px;position:relative}
.top{display:flex;align-items:center;gap:8px}
.top .grow{flex:1;text-align:center;font-weight:900;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rb{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:700;cursor:pointer;white-space:nowrap}
.pill{background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-variant-numeric:tabular-nums;border:2px solid var(--line);white-space:nowrap}
.btn{border:0;border-radius:999px;padding:11px 18px;background:var(--leaf);color:#fff;font-weight:900;cursor:pointer;font-size:1.1rem;box-shadow:0 4px 0 rgba(0,0,0,.14)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.14)}
.btn.sub{background:var(--card);color:var(--ink);border:2px solid var(--line);box-shadow:none}
.btn.go{background:var(--accent)}
.btn.night{background:#3b4f9a}
.btn:disabled{opacity:.45}
/* home */
.logo{text-align:center;font-weight:900;font-size:2.1rem;letter-spacing:.04em;margin:10px 0 0;line-height:1.2}
.logo .s{display:block;font-size:.95rem;color:var(--muted);font-weight:700;letter-spacing:0;margin-top:6px}
.logo span.b{display:inline-block;animation:bob 2.4s ease-in-out infinite}
.logo span.b:nth-child(2n){animation-delay:.3s;color:var(--sky)}
.logo span.b:nth-child(3n){color:var(--plum)}
@keyframes bob{50%{transform:translateY(-5px)}}
.hero{font-size:4.2rem;text-align:center;line-height:1;margin:4px 0 2px;animation:sway 3s ease-in-out infinite;transform-origin:50% 90%}
@keyframes sway{25%{transform:rotate(-6deg)}75%{transform:rotate(6deg)}}
.modes{display:grid;grid-template-columns:1fr;gap:12px}
.mode{position:relative;border:0;border-radius:24px;padding:14px 16px;cursor:pointer;color:#fff;font-weight:900;font-size:1.3rem;line-height:1.25;
  display:flex;align-items:center;gap:14px;text-align:left;box-shadow:0 6px 0 rgba(0,0,0,.13);min-height:92px}
.mode:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(0,0,0,.13)}
.mode .ic{font-size:2.6rem;line-height:1;flex:none}
.mode small{display:block;font-weight:700;font-size:.82rem;opacity:.95;margin-top:3px}
.m1{background:#4aa8d8}.m2{background:#ef8a5c}.m3{background:linear-gradient(135deg,#283c7c,#5a4aa8)}
.homebar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:auto}
.flake{position:fixed;top:-20px;color:#bcd7f0;pointer-events:none;animation:fall linear infinite;z-index:0;font-size:14px}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
#home>*{position:relative;z-index:1}
/* play */
.ask{font-size:1.08rem;font-weight:700;text-align:center;min-height:2.7em;display:flex;align-items:center;justify-content:center;line-height:1.35;padding:0 4px}
.wrap{position:relative;flex:1;min-height:250px;background:#eaf5ff;border-radius:24px;border:2px solid var(--line);overflow:hidden}
canvas#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.ctl .btn{padding:10px 15px;font-size:1.02rem}
.ctl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;min-height:50px;align-items:center}
.cheer{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);font-size:2.1rem;font-weight:900;color:var(--accent);
  background:var(--card);border-radius:20px;padding:10px 22px;box-shadow:0 6px 20px rgba(0,0,0,.18);animation:pop .4s ease-out;pointer-events:none;white-space:nowrap}
@keyframes pop{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
/* palette */
.pal{display:flex;flex-direction:column;gap:6px}
.tabs,.items{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.tabs::-webkit-scrollbar,.items::-webkit-scrollbar{display:none}
.tab{flex:none;border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 11px;font-weight:700;cursor:pointer;white-space:nowrap;font-size:.92rem}
.tab.on{background:var(--sky);border-color:var(--sky);color:#fff}
.it{flex:none;position:relative;width:66px;height:66px;border-radius:18px;border:3px solid var(--line);background:#f4f9ff;padding:0;cursor:pointer}
.it.on{border-color:var(--accent);background:#fff1ea}
.it canvas{width:60px;height:60px;display:block;margin:auto}
.it .lk{position:absolute;top:-2px;right:0;font-size:.9rem}
/* zukan */
.zgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px;overflow:auto;padding:2px 2px 8px}
.zc{border:2px solid var(--line);background:var(--card);border-radius:18px;padding:6px 4px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.zc canvas{width:96px;height:118px}
.zc small{font-size:.75rem;color:var(--muted);font-weight:700}
.zempty{text-align:center;color:var(--muted);font-weight:700;padding:30px 10px;line-height:1.8}
/* parent */
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;z-index:50;padding:16px}
.sheet{background:var(--card);border-radius:22px;padding:16px;max-width:460px;width:100%;max-height:92vh;overflow:auto;display:flex;flex-direction:column;gap:12px}
.sheet h2{margin:0;font-size:1.2rem}
.sheet label{font-weight:700}
.sheet select{font:inherit;padding:8px;border-radius:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);width:100%}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;font-weight:700;cursor:pointer}
.note{font-size:.85rem;color:var(--muted);line-height:1.6}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
<!-- app -->
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="app/icon-192.png">

<div class="ov" id="parent" hidden><div class="sheet">

  <div class="row"><button class="chip" id="pSnd"></button><button class="chip" id="pMusic"></button><button class="chip" id="pVoiceTest"></button></div>
  <div id="kkSlot"></div>
  <div class="note" id="pAbout"></div>
  <div class="row"><button class="chip" id="pReset"></button><span class="note" id="pResetMsg"></span></div>
  <button class="btn" id="pClose"></button>
</div></div>

// ================= state =================
const KEY='yukidama-v1';
const S=Object.assign({lang:null,voice:'ai:1',snd:true,music:true,men:[],no:1},(()=>{try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}})());
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const qs=new URLSearchParams(location.search);
let LANG=qs.get('lang')==='en'?'en':qs.get('lang')==='ja'?'ja':(S.lang||((navigator.language||'ja').slice(0,2)==='ja'?'ja':'en'));
const T=()=>TEXT[LANG];
function setLang(l){LANG=l;S.lang=l;save();document.documentElement.lang=l;document.title=T().title}
setLang(LANG);
const FREE_MAX=6,FULL_MAX=60;
const cap=()=>Kakin.full()?FULL_MAX:FREE_MAX;

// ================= sound =================
let ac=null,noiseBuf=null;
function audio(){if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return null}}if(ac.state==='suspended')ac.resume().catch(()=>{});return ac}
function tone(f,d=.12,type='sine',when=0,vol=.13,dest){if(!S.snd)return;const a=audio();if(!a)return;try{const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;o.connect(g);g.connect(dest||a.destination);const t=(when>50?when:a.currentTime+when);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.start(t);o.stop(t+d+.02)}catch(e){}}
function noise(d=.06,freq=1500,vol=.08,when=0,q=1.2){if(!S.snd)return;const a=audio();if(!a)return;try{
  if(!noiseBuf){noiseBuf=a.createBuffer(1,a.sampleRate*.5,a.sampleRate);const ch=noiseBuf.getChannelData(0);for(let i=0;i<ch.length;i++)ch[i]=Math.random()*2-1}
  const s=a.createBufferSource(),f=a.createBiquadFilter(),g=a.createGain();s.buffer=noiseBuf;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  s.connect(f);f.connect(g);g.connect(a.destination);const t=(when>50?when:a.currentTime+when);g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.001,t+d);s.start(t);s.stop(t+d+.02)}catch(e){}}
const sfx={pop:()=>{tone(880,.08,'triangle');tone(1320,.1,'triangle',.05)},ok:()=>[523,659,784,1047].forEach((f,i)=>tone(f,.18,'triangle',i*.09)),

const AI_VOICES={ja:['vv_himari','vv_metan','vv_zunda','vv_hau'],en:['af_heart','af_bella','bf_emma','am_michael']};
const aiId=()=>AI_VOICES[LANG][(+S.voice.slice(3)||1)-1]||AI_VOICES[LANG][0];
const buf={};
function load(k){const a=audio();const id=aiId()+'/'+k;if(!a)return Promise.resolve(null);
  if(!buf[id])buf[id]=fetch(`voice/${id}.mp3?v=1`).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer()}).then(b=>new Promise((res,rej)=>a.decodeAudioData(b,res,rej))).catch(()=>null);

function musicStart(){const a=audio();if(!a||M.on||!S.snd||!S.music)return;M.on=true;M.gain=a.createGain();M.gain.gain.value=.9;M.gain.connect(a.destination);

  if(s===0||s===4)tone(mtof(BASS[bar]),.35,'triangle',t,.13,M.gain);if(s===6)tone(mtof(BASS[bar]+7),.25,'triangle',t,.09,M.gain);

    const tip=v==='a2'?[R*.62,-R*.82]:[R*.9,-R*.32];c.strokeStyle='#6b4a2b';c.lineWidth=Math.max(2,R*.055);c.beginPath();c.moveTo(0,0);c.lineTo(tip[0],tip[1]);c.stroke();

    if(v==='a3'){c.fillStyle='#e2504a';c.beginPath();c.arc(tip[0],tip[1],R*.13,0,TAU);c.fill();c.beginPath();c.ellipse(tip[0]-R*.1,tip[1]-R*.08,R*.05,R*.08,-.6,0,TAU);c.fill();c.fillStyle='#fff';c.fillRect(tip[0]-R*.18,tip[1]+R*.06,R*.2,R*.06)}

// where a part sits on screen (for touching). returns [{x,y,r,side}]
const HIT={eyes:.24,nose:.28,mouth:.3,cheek:.2,hat:.62,scarf:.0,arms:.0,btn:.16};
function partSpots(m,g,p){const h=HEAD[p.k];const R=h?g.rh:g.rb,cx0=h?g.hx:g.bx,cy0=h?g.hy:g.by;const out=[];
  const sides=PAIR[p.k]?[1,-1]:[1];
  for(const s of sides){let x=cx0+s*p.x*R,y=cy0+p.y*R,r=HIT[p.k]*R;
    if(p.k==='hat'){y-=R*.4}
    if(p.k==='scarf'){r=g.rh*.75}
    if(p.k==='arms'){x+=s*R*.42;y-=R*.18;r=R*.42}
    out.push({x,y,r,side:s})}
  return out}

// draw a whole snowman. pose: dy (px up/down), tilt (rad), yaw (turn around, rad), sq (squash), hdx/hdy (head shift, head radii), ht (head tilt), arm (rad), blink, back
function drawMan(c,m,x,gy,U,pose={},shadow=true){const g=geom(m,0,0,U,pose);
  if(shadow){const k=clamp(1-(-(pose.dy||0))/(g.rb*3),.4,1);c.fillStyle='rgba(60,80,120,.16)';c.beginPath();c.ellipse(x,gy,g.rb*1.05*k,g.rb*.18*k,0,0,TAU);c.fill()}
  c.save();c.translate(x,gy+(pose.dy||0));c.rotate(pose.tilt||0);const sq=pose.sq||0;c.scale(1+sq*.5,1-sq);
  // turning (yaw): the snow balls stay round; only the things on them travel around the ball and hide behind it
  const parts=m.parts||[];const yaw=pose.yaw||0;
  const place=(p,s)=>{let x=s*p.x;if(!yaw)return{nx:x,z:1,a:null};const r=Math.max(1,Math.abs(x));const ph=Math.asin(clamp(x/r,-1,1))+(p.k==='arms'&&Math.abs(x)<1?0:0);const a=ph+yaw;return{nx:r*Math.sin(a),z:Math.cos(a),a}};
  const draw=(p,layer)=>{const h=HEAD[p.k];const R=h?g.rh:g.rb;const ox=h?g.hx:g.bx,oy=h?g.hy:g.by;
    const sides=PAIR[p.k]?[1,-1]:[1];
    for(const s of sides){const q=p.k==='hat'||p.k==='scarf'?{nx:s*p.x,z:1,a:null}:place(p,s);
      if(p.k==='arms'){const front=q.z>=0;if(layer!==(front?'front':'back'))continue}
      else if(q.z<.05)continue;
      c.save();c.translate(ox,oy);if(h)c.rotate(pose.ht||0);c.translate(q.nx*R,p.y*R);
      const pp=p.pop?Math.max(0,1-(performance.now()-p.pop)/350):0;if(pp)c.scale(1+Math.sin(pp*Math.PI)*.35,1+Math.sin(pp*Math.PI)*.35);
      if(p.k==='arms'&&q.a!=null)c.scale(Math.sin(q.a)*s>=0?Math.max(.12,Math.abs(Math.sin(q.a))):-Math.max(.12,Math.abs(Math.sin(q.a))),1);

      if(s<0)c.scale(-1,1);drawPart(c,p.k,p.v,R,g.rh,pose,s);c.restore()}};
  for(const p of parts)if(p.k==='arms')draw(p,'back');
  ball(c,g.bx,g.by,g.rb,m.col,m.lb,yaw);
  for(const p of parts)if(p.k==='btn')draw(p);
  for(const p of parts)if(p.k==='arms')draw(p,'front');
  c.save();c.translate(g.hx,g.hy);c.rotate(pose.ht||0);ball(c,0,0,g.rh,m.col,m.lh,yaw);c.restore();
  for(const p of parts)if(p.k==='scarf')draw(p);
  for(const k of ['cheek','eyes','nose','mouth'])for(const p of parts)if(p.k===k)draw(p);
  for(const p of parts)if(p.k==='hat')draw(p);
  c.restore()}

function lumps(n=16){const a=[];for(let i=0;i<n;i++){const u=Math.random()*2-1,t=Math.random()*TAU,s=Math.sqrt(1-u*u);a.push({x:s*Math.cos(t),y:s*Math.sin(t),z:u,s:.6+Math.random()*.9})}return a}

const F={};// field: grid of snow, trail canvas, background
function fieldInit(keep){const cs=22;F.cs=cs;F.cols=Math.ceil(W/cs);F.rows=Math.ceil(H/cs);F.snow=new Float32Array(F.cols*F.rows).fill(1);
  F.trail=document.createElement('canvas');F.trail.width=Math.ceil(W);F.trail.height=Math.ceil(H);F.tc=F.trail.getContext('2d');
  F.bg=document.createElement('canvas');F.bg.width=Math.round(W*DPR);F.bg.height=Math.round(H*DPR);const b=F.bg.getContext('2d');b.setTransform(DPR,0,0,DPR,0,0);
  const g=b.createLinearGradient(0,0,0,H);g.addColorStop(0,'#fbfdff');g.addColorStop(1,'#e4f0fb');b.fillStyle=g;b.fillRect(0,0,W,H);
  for(let i=0;i<Math.round(W*H/900);i++){b.fillStyle=`rgba(${pick(['170,200,230','200,220,240','255,255,255'])},.6)`;b.beginPath();b.arc(Math.random()*W,Math.random()*H,Math.random()*1.6+.4,0,TAU);b.fill()}

  const tree=(x,y,s)=>{b.fillStyle='rgba(60,80,120,.12)';b.beginPath();b.ellipse(x,y+s*.15,s*.5,s*.18,0,0,TAU);b.fill();b.fillStyle='#4c8f6a';for(let k=0;k<3;k++){b.beginPath();b.moveTo(x,y-s*(1.1-k*.28));b.lineTo(x+s*(.32+k*.1),y-s*(.45-k*.28));b.lineTo(x-s*(.32+k*.1),y-s*(.45-k*.28));b.closePath();b.fill()}
    b.fillStyle='#fff';for(let k=0;k<3;k++){b.beginPath();b.ellipse(x,y-s*(1.02-k*.28),s*(.12+k*.05),s*.05,0,0,TAU);b.fill()}};
  const ts=Math.min(W,H)*.1;[[.06,.12],[.94,.1],[.05,.92],[.95,.94],[.5,.04]].forEach(([a,c])=>tree(a*W,c*H+ts*.4,ts*(.8+Math.random()*.3)));
  if(!keep||!R.x){R.x=W/2;R.y=H*.55}R.x=clamp(R.x,R.r+4,W-R.r-4);R.y=clamp(R.y,R.r+4,H-R.r-4)}
const R={stage:1,x:0,y:0,r:10,rMin:0,rMax:0,tx:null,ty:null,moved:0,crunchAt:0,okSaid:false,maxed:false,lowT:0,snowySaid:false,idle:0,hintAt:0,body:null,pts:null};
function startRoll(){const my=++run;mode='roll';hush();playScreen(T().rollT);R.body=null;R.x=0;F.unit=0;fieldInit(false);flakes(30);newBall(1);ask(T().roll1);say('roll1')}
function newBall(stage){const m=Math.min(W,H);R.stage=stage;F.unit=F.unit||m*.2;const U=F.unit;
  if(stage===1){R.rMax=U*1.0;R.rMin=U*.62;R.r=U*.22;R.x=W/2;R.y=H*.55}
  else{R.rMax=Math.min(U*.78,R.body.r*.86);R.rMin=R.rMax*.62;R.r=U*.18;
    // start where there is room, away from the body
    let best=null;for(let i=0;i<30;i++){const x=R.r+10+Math.random()*(W-2*R.r-20),y=R.r+10+Math.random()*(H-2*R.r-20);const d=Math.hypot(x-R.body.x,y-R.body.y);if(!best||d>best.d)best={x,y,d}}
    R.x=(best.x+W/2)/2;R.y=(best.y+H/2)/2;const d=Math.hypot(R.x-R.body.x,R.y-R.body.y);if(d<R.body.r+R.r+10){R.x=best.x;R.y=best.y}}
  R.pts=lumps(18);R.okSaid=false;R.maxed=false;R.lowT=0;R.snowySaid=false;R.idle=0;R.hintAt=0;R.tx=null;
  rollCtl()}
function rollCtl(){const t=T();if(R.r>=R.rMin&&!R.maxed)ctl([t.okBtn,'go',rollDone]);else ctl()}
function rollDone(){if(mode!=='roll'||R.maxed&&R.doneLock)return;R.doneLock=true;const my=run;sfx.ok();
  if(R.stage===1){R.body={x:R.x,y:R.y,r:R.r,pts:R.pts};setTimeout(()=>{if(my!==run)return;R.doneLock=false;newBall(2);ask(T().roll2);say('roll2')},700)}
  else{R.head={r:R.r,pts:R.pts};setTimeout(()=>{if(my!==run)return;R.doneLock=false;startStack()},800)}}
function rollStep(dt,t){if(R.doneLock)return;
  // snow comes back slowly
  for(let i=0;i<F.snow.length;i++)if(F.snow[i]<1)F.snow[i]=Math.min(1,F.snow[i]+dt*.06);
  F.tc.globalCompositeOperation='destination-out';F.tc.fillStyle=`rgba(0,0,0,${dt*.07})`;F.tc.fillRect(0,0,W,H);F.tc.globalCompositeOperation='source-over';
  if(R.tx==null){R.idle+=dt;if(R.idle>7&&t-R.hintAt>15000&&R.r<R.rMin){R.hintAt=t;sayIdle('roll_hint')}return}
  R.idle=0;const dx=R.tx-R.x,dy=R.ty-R.y,d=Math.hypot(dx,dy);if(d<1.5)return;
  const vmax=Math.max(420,W*1.3);const step=Math.min(d,Math.min(vmax,d*9)*dt);const ux=dx/d,uy=dy/d;
  let nx=clamp(R.x+ux*step,R.r+3,W-R.r-3),ny=clamp(R.y+uy*step,R.r+3,H-R.r-3);
  if(R.body){const bx=nx-R.body.x,by=ny-R.body.y,bd=Math.hypot(bx,by),min=R.body.r+R.r+2;if(bd<min&&bd>0){nx=R.body.x+bx/bd*min;ny=R.body.y+by/bd*min;nx=clamp(nx,R.r+3,W-R.r-3);ny=clamp(ny,R.r+3,H-R.r-3)}}
  const mv=Math.hypot(nx-R.x,ny-R.y);if(mv<.3)return;
  // pick up the snow under the ball
  const rr=R.r*.75,cs=F.cs;let sum=0,n=0;const c0=Math.max(0,Math.floor((nx-rr)/cs)),c1=Math.min(F.cols-1,Math.floor((nx+rr)/cs)),r0=Math.max(0,Math.floor((ny-rr)/cs)),r1=Math.min(F.rows-1,Math.floor((ny+rr)/cs));
  for(let rr2=r0;rr2<=r1;rr2++)for(let cc=c0;cc<=c1;cc++){const cxp=(cc+.5)*cs,cyp=(rr2+.5)*cs;if(Math.hypot(cxp-nx,cyp-ny)>rr+cs*.5)continue;const i=rr2*F.cols+cc;sum+=F.snow[i];n++;F.snow[i]=Math.max(0,F.snow[i]-mv/cs*.3)}

  rot(R.pts,-uy,ux,mv/R.r);R.x=nx;R.y=ny;R.moved+=mv;
  const U=F.unit,c=U*U/(10*W);const old=R.r;R.r=Math.min(R.rMax,Math.sqrt(R.r*R.r+c*mv*Math.max(.3,avail)));
  if(R.moved>R.crunchAt){R.crunchAt=R.moved+30+Math.random()*25;sfx.crunch();if(avail>.3&&Math.random()<.6)puff(R.x-ux*R.r,R.y-uy*R.r,2,'#ffffff',50,2.5)}
  if(avail<.3){R.lowT+=dt;if(R.lowT>1.6&&!R.snowySaid){R.snowySaid=true;sayIdle('snowy')}}else R.lowT=0;
  if(old<R.rMin&&R.r>=R.rMin){sfx.grow();sparkle(R.x,R.y-R.r,10);cheer('⭐');if(!R.okSaid){R.okSaid=true;say(R.stage===1?'ok1':'ok2')}rollCtl()}
  if(R.r>=R.rMax&&!R.maxed){R.maxed=true;sfx.fan();sparkle(R.x,R.y,18);say(R.stage===1?'max1':'max2');ctl();R.doneLock=false;setTimeout(()=>{if(mode==='roll')rollDone()},900)}}
function rollDraw(t){cx.clearRect(0,0,W,H);cx.drawImage(F.bg,0,0,W,H);cx.drawImage(F.trail,0,0,W,H);
  const sh=(x,y,r)=>{cx.fillStyle='rgba(60,90,140,.16)';cx.beginPath();cx.ellipse(x+r*.12,y+r*.18,r*1.02,r*.95,0,0,TAU);cx.fill()};

  if(R.tx==null&&R.idle>2.5&&R.r<R.rMin){const k=(t/1000)%2/2;const a=k*TAU;const hx=R.x+Math.cos(a)*R.r*1.8,hy=R.y+Math.sin(a)*R.r*1.2;cx.globalAlpha=.85;cx.font=`${Math.round(Math.min(W,H)*.09)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;cx.textAlign='center';cx.textBaseline='middle';cx.fillText('👆',hx,hy+20);cx.globalAlpha=1}

  // size gauge

  cx.fillStyle='rgba(255,255,255,.85)';rr(gx-30,gy-6,gw+42,gh+12,14);cx.fill();

function hitPart(px,py){const L=manLayout();const g=geom(MAN,L.x,L.gy,L.U);// top-most first

let DN=[],danceFrom='home',STARS=[];
const SAMPLES=[{rb:.95,rh:.66,col:'w',parts:[{k:'eyes',v:'e1',x:.36,y:-.15},{k:'nose',v:'n1',x:0,y:.1},{k:'mouth',v:'m2',x:0,y:.43},{k:'hat',v:'h1',x:0,y:-.82},{k:'scarf',v:'s1',x:0,y:-.93},{k:'arms',v:'a1',x:.92,y:-.28},{k:'btn',v:'b1',x:0,y:-.45},{k:'btn',v:'b1',x:0,y:0}]},
  {rb:.8,rh:.6,col:'w',parts:[{k:'eyes',v:'e2',x:.36,y:-.12},{k:'nose',v:'n2',x:0,y:.12},{k:'mouth',v:'m1',x:0,y:.43},{k:'cheek',v:'c1',x:.58,y:.27},{k:'hat',v:'h2',x:0,y:-.82},{k:'arms',v:'a2',x:.92,y:-.28},{k:'scarf',v:'s2',x:0,y:-.93}]}];
function startDance(focus,fromZ){run++;hush();mode='dance';if(!fromZ)danceFrom='home';const t=T();playScreen(t.danceT);
  let list=S.men.length?[...S.men]:SAMPLES.map(m=>Object.assign({},m));let sample=!S.men.length;
  if(focus){list=list.filter(m=>m.id!==focus.id);list.unshift(focus)}else list.reverse();list=list.slice(0,8);
  // put the focused one in the middle of the front row
  const n=list.length,back=n>4?Math.floor(n/2):0;const front=list.slice(0,n-back),backRow=list.slice(n-back);const mid=Math.floor(front.length/2);if(front.length>1){const f=front.shift();front.splice(mid,0,f)}
  DN=[];backRow.forEach((m,i)=>DN.push({m:Object.assign({lb:lumps(),lh:lumps()},m),row:0,i,n:backRow.length,seed:Math.random()*8,tap:-9}));front.forEach((m,i)=>DN.push({m:Object.assign({lb:lumps(),lh:lumps()},m),row:1,i,n:front.length,seed:Math.random()*8,tap:-9}));
  STARS=[];for(let i=0;i<70;i++)STARS.push({x:Math.random(),y:Math.random()*.6,r:Math.random()*1.4+.4,p:Math.random()*TAU});flakes(40);
  ask(t.danceAsk+(sample?' '+t.sample:''));beat0=performance.now();musicStart();danceCtl();say('night')}
function danceCtl(){const t=T();ctl([t.home,'go',renderHome],[t.make,'sub',startRoll],[S.music?t.musicOn:t.musicOff,'sub',()=>{S.music=!S.music;save();if(S.music)musicStart();else musicStop();danceCtl()}])}
function danceLayout(d){const gy0=H*.93;const rowH=d.row?H*.62:H*.42;const gy=d.row?gy0:H*.74;const slot=W/d.n;const U=Math.min(fitU(d.m,slot*.95,rowH),fitU({rb:1,rh:.7},W*.3,rowH));return{x:slot*(d.i+.5)+(d.row?0:slot*.0),gy,U}}
const MOVES=['bounce','sway','wave','hop','spin','bob'];
function dancePose(d,b){const mi=(Math.floor(b/8)+Math.floor(d.seed))%MOVES.length;const mv=MOVES[mi];const ph=b+d.seed*.0;const L=danceLayout(d);const hgt=L.U*d.m.rb;let p={};
  const s1=Math.sin(ph*Math.PI),c1=Math.cos(ph*Math.PI);
  if(mv==='bounce'){p.dy=-Math.abs(s1)*hgt*.22;p.sq=Math.abs(s1)<.2?.08:-.02;p.arm=.3+Math.abs(s1)*.3;p.ht=s1*.06}
  if(mv==='sway'){p.tilt=s1*.16;p.arm=-s1*.4;p.ht=-s1*.1}
  if(mv==='wave'){p.arm=.5+Math.sin(ph*TAU)*.5;p.ht=Math.sin(ph*Math.PI/2)*.12;p.dy=-Math.abs(Math.sin(ph*TAU))*hgt*.05}
  if(mv==='hop'){const k=(ph%2)/2;p.dy=-Math.max(0,Math.sin(k*TAU))*hgt*.55;p.sq=k>.48&&k<.6?.1:0;p.arm=.8;p.tilt=Math.sin(k*TAU)*.05}
  if(mv==='spin'){p.yaw=(ph%8)/8*TAU;p.arm=.4;p.dy=-Math.abs(s1)*hgt*.08}
  if(mv==='bob'){p.hdx=Math.sin(ph*Math.PI)*.28;p.arm=.2+Math.abs(c1)*.4;p.tilt=-s1*.04}
  const tk=(b-d.tap)/2;if(tk>=0&&tk<1){p.dy=(p.dy||0)-Math.sin(tk*Math.PI)*hgt*1.1;p.yaw=(p.yaw||0)+tk*TAU;p.arm=1}
  return p}
function danceDraw(dt,t){const now=t/1000;const g=cx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#0b1634');g.addColorStop(.7,'#2a3f7a');g.addColorStop(1,'#3d5596');cx.fillStyle=g;cx.fillRect(0,0,W,H);
  for(const s of STARS){cx.globalAlpha=.4+.6*Math.abs(Math.sin(now*1.5+s.p));cx.fillStyle='#fff';cx.beginPath();cx.arc(s.x*W,s.y*H,s.r,0,TAU);cx.fill()}cx.globalAlpha=1;
  const mr=Math.min(W,H)*.07;const mg=cx.createRadialGradient(W*.82,H*.14,mr*.5,W*.82,H*.14,mr*3);mg.addColorStop(0,'rgba(255,245,200,.45)');mg.addColorStop(1,'rgba(255,245,200,0)');cx.fillStyle=mg;cx.fillRect(0,0,W,H);
  cx.fillStyle='#fff6d0';cx.beginPath();cx.arc(W*.82,H*.14,mr,0,TAU);cx.fill();cx.fillStyle='#0f1d42';cx.beginPath();cx.arc(W*.82+mr*.45,H*.14-mr*.2,mr*.85,0,TAU);cx.fill();
  // snowy hills under the moonlight
  cx.fillStyle='#4a62a8';cx.beginPath();cx.moveTo(0,H*.76);cx.quadraticCurveTo(W*.3,H*.62,W*.6,H*.72);cx.quadraticCurveTo(W*.85,H*.64,W,H*.7);cx.lineTo(W,H);cx.lineTo(0,H);cx.fill();
  cx.fillStyle='#c9d8f5';cx.fillRect(0,H*.78,W,H);const sg=cx.createLinearGradient(0,H*.78,0,H);sg.addColorStop(0,'#b8caef');sg.addColorStop(1,'#e8efff');cx.fillStyle=sg;cx.fillRect(0,H*.78,W,H*.22);
  const b=beats();
  // spotlights on the beat
  const pulse=Math.pow(1-(b%1),3);for(const d of DN){if(d.row!==1)continue;const L=danceLayout(d);const sp=cx.createRadialGradient(L.x,L.gy,2,L.x,L.gy,L.U*d.m.rb*1.8);sp.addColorStop(0,`rgba(255,250,220,${.25+.2*pulse})`);sp.addColorStop(1,'rgba(255,250,220,0)');cx.fillStyle=sp;cx.fillRect(L.x-L.U*3,L.gy-L.U*2,L.U*6,L.U*4)}
  for(const d of DN){const L=danceLayout(d);const pose=dancePose(d,b);const bl=(now+d.seed)%4<.12;if(bl)pose.blink=1;cx.save();if(d.row===0){cx.globalAlpha=.92}drawMan(cx,d.m,L.x,L.gy,L.U,pose);cx.restore()}
  flakeDraw(dt,'rgba(255,255,255,.85)')}
function danceTap(px,py){const b=beats();for(let k=DN.length-1;k>=0;k--){const d=DN[k];const L=danceLayout(d);const g=geom(d.m,L.x,L.gy,L.U);const top=g.hy-g.rh*1.6;
  if(px>L.x-g.rb*1.1&&px<L.x+g.rb*1.1&&py>top&&py<L.gy+6){if(b-d.tap<1.6)return;d.tap=b;sfx.boing();sparkle(L.x,g.hy-g.rh,12);sayIdle(pick(['tap0','tap1','tap2','tap3']));return}}}

// ================= palette thumbnails =================
function thumb(c,k,v){const x=c.getContext('2d');const w=c.width,h=c.height;x.clearRect(0,0,w,h);
  if(k==='col'){drawMan(x,{rb:1,rh:.7,col:v,parts:[{k:'eyes',v:'e1',x:.36,y:-.15},{k:'nose',v:'n1',x:0,y:.1}]},w/2,h*.95,fitU({rb:1,rh:.7},w*.95,h*.88),{},false);return}
  if(k==='arms'){x.save();x.translate(w*.25,h*.62);drawPart(x,k,v,w*.62,w*.4,{},1);x.restore();ball(x,w*.2,h*.7,w*.24,'w');return}
  if(k==='btn'){ball(x,w/2,h/2,w*.44,'w');x.save();x.translate(w/2,h/2);drawPart(x,k,v,w*.9,w*.3,{},1);x.restore();return}
  if(k==='scarf'){ball(x,w/2,h*.2,w*.3,'w');ball(x,w/2,h*1.05,w*.45,'w');x.save();x.translate(w/2,h*.52);drawPart(x,k,v,w*.4,w*.34,{},1);x.restore();return}
  if(k==='hat'){const R=w*.3;ball(x,w/2,h*.78,R,'w');x.save();x.translate(w/2,h*.78-R*.82);drawPart(x,k,v,R,R,{},1);x.restore();return}
  const R=w*.42;ball(x,w/2,h/2,R,'w');const[dx,dy]=DEF[k];const cxp=w/2,cyp=h/2;
  for(const s of PAIR[k]?[1,-1]:[1]){x.save();x.translate(cxp+s*dx*R,cyp+dy*R);if(s<0)x.scale(-1,1);drawPart(x,k,v,R,R,{},s);x.restore()}}

function openParent(){const t=T();$('parent').hidden=false;$('pTitle').textContent=t.pTitle;$('pLangL').textContent=t.pLang;$('pVoiceL').textContent=t.pVoice;
  $('pLang').value=LANG;const vals=['ai:1','ai:2','ai:3','ai:4','dev','off'];$('pVoice').innerHTML=vals.map((v,i)=>`<option value="${v}">${t.voices[i]}</option>`).join('');$('pVoice').value=S.voice;
  $('pSnd').textContent=S.snd?t.sndOn:t.sndOff;$('pMusic').textContent=S.music?t.musicOn:t.musicOff;$('pVoiceTest').textContent=t.vTest;$('pAbout').textContent=t.about;$('pReset').textContent=t.reset;$('pResetMsg').textContent='';$('pClose').textContent=t.close;resetArm=false}
let resetArm=false;

$('pVoice').onchange=()=>{S.voice=$('pVoice').value;save()};

$('pVoiceTest').onclick=()=>{audio();hush();say('hello')};
